# One workflow running the same targets a developer runs locally (`task build`
# and `task test`, see the root Taskfile.yml), one step per project so each
# project's duration shows in the run UI without any hand-rolled timing.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  task:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: go-task/setup-task@v1
        with:
          version: 3.53.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            contracts/generated/protobuf/go/go.sum
            tools/protobuf/go/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.424'
      - name: Install Mono (runs the net472 protobuf proof on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mono-devel
      # The native mod and fixture projects compile against the game's managed
      # assemblies, Harmony and the RimBridgeServer SDK. Hosted runners have no
      # game, so stage pinned, hash-verified substitutes (publicised RimWorld
      # reference assemblies, the Lib.Harmony NuGet, the RimBridgeServer
      # release) and make the native/fixtures steps fail rather than skip.
      - uses: actions/cache@v4
        with:
          path: .rimgovernor/native-inputs/downloads
          key: native-inputs-${{ hashFiles('scripts/fetch_native_build_inputs.ps1') }}
      - name: Stage native build inputs
        shell: pwsh
        run: |
          $root = ./scripts/fetch_native_build_inputs.ps1 -OutputRoot .rimgovernor/native-inputs
          "RIMWORLD_MANAGED_DIR=$root/managed" >> $env:GITHUB_ENV
          "HARMONY_ASSEMBLY=$root/0Harmony.dll" >> $env:GITHUB_ENV
          "RIMBRIDGE_SDK_DIR=$root/rimbridge" >> $env:GITHUB_ENV
          "NATIVE_INPUTS_REQUIRED=1" >> $env:GITHUB_ENV

      - run: task go:build
      - run: task go:test
      - run: task dashboard:build
      - run: task dashboard:test
      - run: task wire:build
      - run: task wire:test
      - run: task protobuf-go:build
      - run: task protobuf-go:test
      - run: task protobuf:build
      - run: task protobuf:test
      - run: task native:build
      - run: task native:test
      - run: task probes:build
      - run: task probes:test
      - run: task fixtures:build
      - run: task fixtures:test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protobuf-evidence-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            .rimgovernor/task/protobuf/go-check/result.json
            .rimgovernor/task/protobuf/origin
            .rimgovernor/task/protobuf/exchange/roundtrip
            .rimgovernor/task/protobuf/return
