name: Remote acceptance

run-name: Remote acceptance ${{ inputs.label || github.event_name }}${{ inputs.cases && format(' / {0}', inputs.cases) || '' }}

on:
  workflow_dispatch:
    inputs:
      tested_ref:
        description: Same-repository branch or tag to test (resolved once at startup)
        default: main
        type: string
      tested_commit:
        description: Optional full commit SHA overriding tested_ref
        required: false
        type: string
      label:
        description: Free text shown in the run title, to tell concurrent runs apart (e.g. 1248 ied-lane)
        required: false
        type: string
      tier:
        type: choice
        options: [smoke, nightly, cases]
        default: smoke
      cases:
        description: For tier cases, comma-separated case names or bare areas (e.g. power,food/reserve)
        required: false
        type: string
      shards:
        description: Nonempty shards, 1 through 32 (at most 20 active)
        type: number
        default: 2
      repeat:
        description: For tier cases, run each shard this many times (1-50) and report a per-case pass rate; run 1 is the verdict
        type: number
        default: 1
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  REMOTE_ACCEPTANCE_ENABLED: ${{ vars.REMOTE_ACCEPTANCE_ENABLED }}
  REMOTE_ACCEPTANCE_MAINTAINERS: ${{ vars.REMOTE_ACCEPTANCE_MAINTAINERS }}
  REMOTE_BUNDLE_ASSET: ${{ vars.REMOTE_BUNDLE_ASSET }}
  REMOTE_INVENTORY_ASSET: ${{ vars.REMOTE_INVENTORY_ASSET }}
  REMOTE_BUNDLE_SHA256: ${{ vars.REMOTE_BUNDLE_SHA256 }}
  REMOTE_ARTIFACT_MAX_BYTES: ${{ vars.REMOTE_ARTIFACT_MAX_BYTES || '0' }}
  GOTOOLCHAIN: local
  GOWORK: 'off'
  CGO_ENABLED: '0'

jobs:
  plan:
    if: github.repository == 'davidarcher/rimgovernor' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    environment: remote-acceptance
    # Go build and module caches (restored below, saved only by pushes to
    # main, one entry per role, go.sum and ISO week so they cannot pile up).
    env:
      GOCACHE: C:\rg\gocache
      GOMODCACHE: C:\rg\gomod
    outputs:
      head: ${{ steps.gate.outputs.head }}
      matrix: ${{ steps.plan.outputs.matrix }}
      repeat: ${{ steps.plan.outputs.repeat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Authorize before selected code, bundle cache or identity access
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase gate
      # Several script steps are continue-on-error; parse every script here so
      # a syntax error fails the run instead of hiding as an annotation.
      - name: Parse every PowerShell script
        run: |
          $bad = 0
          Get-ChildItem trusted -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head }}
          path: tested
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: trusted/go/.go-version
          cache: false
      - name: Name the Go cache
        id: gokey
        shell: bash
        run: echo "key=go-plan-windows-${{ hashFiles('tested/go/go.sum') }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gocache
        with:
          path: |
            C:\rg\gocache
            C:\rg\gomod
          key: ${{ steps.gokey.outputs.key }}
          restore-keys: go-plan-windows-${{ hashFiles('tested/go/go.sum') }}-
      - name: Plan complete selection from detached tested source
        id: plan
        run: ./trusted/scripts/remote_workflow.ps1 -Phase plan
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.gocache.outputs.cache-hit != 'true' }}
        with:
          path: |
            C:\rg\gocache
            C:\rg\gomod
          key: ${{ steps.gokey.outputs.key }}
      - name: Upload immutable plan inputs
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: C:\rg\evidence
          if-no-files-found: error
          retention-days: 7

  # Whole-module Go race pass. Not a landing gate (it is dropped from
  # go:test as too slow for the win it delivered) and it needs no licensed
  # inputs, so it runs on scheduled and manually dispatched full tiers against public source
  # with no environment or secrets. Linux because the race runtime is
  # several times faster there and gcc is preinstalled.
  # The same job owns the Protobuf generation drift check (contracts/proto
  # against the committed C#/Go bindings) and the proof helper module under
  # tools/protobuf/go, which is its own Go module so `./...` from go/ never
  # sees it. Neither is in the landing loop (cmd/test and cmd/land do not
  # run task protobuf:*), so without this nothing runs them. The C#/Go/C#
  # exchange proof (task protobuf:test) stays manual: it proves the pinned
  # runtime, which only changes with the pins, and needs Mono here.
  race:
    needs: plan
    if: github.repository == 'davidarcher/rimgovernor' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/.go-version
          cache: false
      - name: go test -race
        working-directory: go
        shell: bash
        env:
          CGO_ENABLED: '1'
          GORACE: atexit_sleep_ms=0
        # The hosted runner has 4 vCPUs; go test would also build and run
        # up to 4 packages at once, and the race runtime multiplies each
        # test's CPU. Two packages at a time with 4 tests each keeps the
        # tests' hang guards (bridge testBudget, buildingruntime
        # playerFixture) out of reach instead of tripping them on load.
        run: go test -race -p 2 -parallel 4 -timeout 40m ./...
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Protobuf generation drift
        working-directory: go
        shell: bash
        run: |
          go run ./internal/protobufgen/cmd/generatecsharp --check \
            --output ../.rimgovernor/task/protobuf/csharp-check
          go run ./internal/protobufgen/cmd/generatego --check \
            --protoc "$HOME/.nuget/packages/grpc.tools/2.72.0/tools/linux_x64/protoc" \
            --output ../.rimgovernor/task/protobuf/go-check
      - name: Protobuf proof module tests
        working-directory: tools/protobuf/go
        shell: bash
        run: go test -mod=readonly ./...

  # Per-test budget: under -short every test not marked
  # slowtest.Skip must finish within 1 s. Own job so the box is quiet
  # and the durations are honest; also reports every test the marker skips
  # (a run summary), so nothing is skipped forever. The parse logic is
  # go/internal/testkit/cmd/checktesttimes.
  budget:
    needs: plan
    if: github.repository == 'davidarcher/rimgovernor' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/.go-version
          cache: false
      - name: go test -short, 1 s per-test budget
        working-directory: go
        shell: bash
        run: |
          set -o pipefail
          go test -short -count=1 -p 2 -json ./... \
            | go run ./internal/testkit/cmd/checktesttimes -budget 1s -skipped "$RUNNER_TEMP/skipped.md"
      - name: Report tests skipped by slowtest.Skip
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/skipped.md" ]; then
            cat "$RUNNER_TEMP/skipped.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload skipped report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skipped-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skipped.md
          if-no-files-found: ignore
          retention-days: 7

  # Non-race full test run on Windows: the race job above is Linux
  # only, and the landing loop runs on Windows with -short. Git is
  # preinstalled on windows-2022 for the git-heavy tests.
  windows-full:
    needs: plan
    if: github.repository == 'davidarcher/rimgovernor' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly'))
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/.go-version
          cache: false
      - name: go test (full, no -short, no -race)
        working-directory: go
        run: go test -count=1 -timeout 40m ./...

  # The trusted remoteaccept tool, cross-compiled once on Linux beside
  # plan instead of cold-compiled on every Windows shard and the verdict.
  # Trusted (workflow) source only; no environment or secrets.
  tools:
    if: github.repository == 'davidarcher/rimgovernor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: trusted/go/.go-version
          cache: false
      - name: Cross-compile trusted remoteaccept
        working-directory: trusted/go
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o ../../tools/remoteaccept.exe ./cmd/remoteaccept
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/remoteaccept.exe
          if-no-files-found: error
          retention-days: 1

  shard:
    needs: [plan, tools]
    permissions:
      contents: read
      checks: write
    # Soak repetitions (rep > 1) get distinct names and artifacts, so collect
    # and the verdict see only repetition 1.
    name: acceptance-${{ matrix.shard }}${{ matrix.rep > 1 && format('-r{0}', matrix.rep) || '' }}
    runs-on: windows-2022
    timeout-minutes: 360
    environment: remote-acceptance
    # Go build and module caches (restored below, saved only by pushes to
    # main, one entry per role, go.sum and ISO week so they cannot pile up).
    env:
      GOCACHE: C:\rg\gocache
      GOMODCACHE: C:\rg\gomod
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Recheck authorization before cache and secrets
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase authorize
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: C:\rg\evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          path: tested
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: trusted/go/.go-version
          cache: false
      - name: Name the Go cache
        id: gokey
        shell: bash
        run: echo "key=go-shard-windows-${{ hashFiles('tested/go/go.sum') }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gocache
        with:
          path: |
            C:\rg\gocache
            C:\rg\gomod
          key: ${{ steps.gokey.outputs.key }}
          restore-keys: go-shard-windows-${{ hashFiles('tested/go/go.sum') }}-
      - name: Fetch the trusted public-evidence exporter
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\rg
      - name: Audit process exits so a vanished game leaves its exit status
        continue-on-error: true
        run: auditpol /set /subcategory:"Process Termination" /success:enable
      - name: Bootstrap private layouts and run exact shard cases
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_BUNDLE_IDENTITY: ${{ secrets.REMOTE_BUNDLE_IDENTITY }}
          SHARD: ${{ matrix.shard }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase execute -Shard $env:SHARD
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.gocache.outputs.cache-hit != 'true' && matrix.shard == 's1' && matrix.rep == 1 }}
        with:
          path: |
            C:\rg\gocache
            C:\rg\gomod
          key: ${{ steps.gokey.outputs.key }}
      - name: Record why governed processes exited (#1358)
        if: always() && steps.gate.outcome == 'success'
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: ./trusted/scripts/collect_crash_remote.ps1 -Out "C:\rg\crash\$env:SHARD"
      - name: Stop this job's processes and remove identity
        if: always() && steps.gate.outcome == 'success'
        run: |
          foreach ($role in @('fixture','production')) {
            ./trusted/scripts/cleanup_remote.ps1 -Work "C:\rg\$role"
          }
          if (Test-Path C:\rg\identity.txt) { Remove-Item -LiteralPath C:\rg\identity.txt }
      - name: Export allowlisted diagnostics even after native failure
        if: always() && steps.gate.outcome == 'success'
        env:
          SHARD: ${{ matrix.shard }}
          PUBLIC: ${{ matrix.rep > 1 && format('C:\rg\public\r{0}', matrix.rep) || 'C:\rg\public' }}
        run: |
          New-Item -ItemType Directory -Force "C:\rg\evidence\$env:SHARD" | Out-Null
          $code = 1
          try {
            if (Test-Path C:\rg\export-jobs.json) {
              & C:\rg\remoteaccept.exe export -root C:\rg\evidence -shard $env:SHARD -jobs C:\rg\export-jobs.json
              $code = $LASTEXITCODE
            }
          } finally {
            if ($code) { '{"passed":false,"error":"Shard export incomplete; inspect Actions job logs"}' | Set-Content "C:\rg\evidence\$env:SHARD\incomplete.json" }
            New-Item -ItemType Directory -Force $env:PUBLIC | Out-Null
            Copy-Item -LiteralPath "C:\rg\evidence\$env:SHARD" -Destination "$env:PUBLIC\$env:SHARD" -Recurse
            if (Test-Path "C:\rg\crash\$env:SHARD") { Copy-Item -LiteralPath "C:\rg\crash\$env:SHARD" -Destination "$env:PUBLIC\$env:SHARD\crash" -Recurse }
          }
          exit $code
      - name: Upload shard diagnostics
        id: upload
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.rep > 1 && 'soak' || 'acceptance' }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}${{ matrix.rep > 1 && format('-r{0}', matrix.rep) || '' }}
          path: C:\rg\public
          if-no-files-found: error
          retention-days: 7
      - name: Link shard evidence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "Shard diagnostics: $env:ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path C:\rg\remoteaccept.exe) {
            $env:GH_TOKEN | & C:\rg\remoteaccept.exe progress -finish -artifact-url $env:ARTIFACT_URL
          }

  verdict:
    needs: [plan, tools, shard]
    if: always() && needs.plan.outputs.head != ''
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\rg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: acceptance-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: C:\rg\evidence
          merge-multiple: true
      - name: Authenticate conclusions and collect all planned shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase collect
      - name: Close abandoned shard progress
        if: always()
        continue-on-error: true
        working-directory: trusted/go
        env:
          GH_TOKEN: ${{ github.token }}
        run: $env:GH_TOKEN | & C:\rg\remoteaccept.exe progress -sweep
      - name: Compute complete native verdict
        id: aggregate
        working-directory: trusted/go
        run: |
          C:\rg\remoteaccept.exe aggregate -root C:\rg\evidence -shards shards.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: always() && needs.plan.outputs.repeat > 1
        with:
          pattern: soak-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: C:\rg\soak
          merge-multiple: true
      - name: Summarize soak pass rate per case
        if: always() && needs.plan.outputs.repeat > 1
        continue-on-error: true
        working-directory: trusted/go
        env:
          REPEAT: ${{ needs.plan.outputs.repeat }}
        run: |
          "Soak: $env:REPEAT runs per case" >> $env:GITHUB_STEP_SUMMARY
          C:\rg\remoteaccept.exe soak -root C:\rg\evidence -soak C:\rg\soak -repeat $env:REPEAT | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Index per-case evidence
        if: always()
        continue-on-error: true
        working-directory: trusted/go
        run: C:\rg\remoteaccept.exe index -root C:\rg\evidence
      - name: Upload complete verdict and diagnostics
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}-verdict
          path: C:\rg\evidence
          if-no-files-found: error
          retention-days: 7
      - name: Summarize verdict and source identity
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          VERDICT: ${{ job.status }}
          TESTED_COMMIT: ${{ needs.plan.outputs.head }}
        run: |
          "Remote acceptance: $env:VERDICT" >> $env:GITHUB_STEP_SUMMARY
          "Tested commit: $env:TESTED_COMMIT" >> $env:GITHUB_STEP_SUMMARY
          "[Verdict and all available diagnostics]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
