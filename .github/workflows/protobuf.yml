name: Shared Protobuf contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: contracts/generated/protobuf/go/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.424'
      - name: Install Mono runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { throw 'Package index failed' }
          sudo apt-get install -y mono-devel
          if ($LASTEXITCODE -ne 0) { throw 'Mono runtime install failed' }
      - name: Check official generated C#
        run: |
          python scripts/generate_protobuf.py --check --output .rimgovernor/protobuf-csharp-check
          if ($LASTEXITCODE -ne 0) { throw 'Official C# generation drift' }
      - name: Check official generated Go
        run: |
          $protoPlatform = if ($IsWindows) { 'windows_x64/protoc.exe' } else { 'linux_x64/protoc' }
          $packageRoot = if ($IsWindows) { "$env:USERPROFILE/.nuget/packages" } else { "$env:HOME/.nuget/packages" }
          $compilerPath = "$packageRoot/grpc.tools/2.72.0/tools/$protoPlatform"
          python scripts/generate_protobuf_go.py --protoc $compilerPath --check --output .rimgovernor/protobuf-go-check
          if ($LASTEXITCODE -ne 0) { throw 'Official Go generation drift or module checks failed' }
      - name: Exchange full generated message fixtures
        run: |
          go -C tools/protobuf/go test -mod=readonly ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go proof tests failed' }
          go -C tools/protobuf/go vet -mod=readonly ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go proof vet failed' }
          go -C tools/protobuf/go run -mod=readonly . --output ../../../.rimgovernor/protobuf-go-origin
          if ($LASTEXITCODE -ne 0) { throw 'Go origin fixtures failed' }
          python scripts/generate_protobuf.py --check --proof --cross-language-inputs .rimgovernor/protobuf-go-origin --output .rimgovernor/protobuf-exchange
          if ($LASTEXITCODE -ne 0) { throw 'C# official runtime exchange failed' }
          go -C tools/protobuf/go run -mod=readonly . --output ../../../.rimgovernor/protobuf-go-return --cross-language-inputs ../../../.rimgovernor/protobuf-exchange/roundtrip --check-go-echo
          if ($LASTEXITCODE -ne 0) { throw 'Go official runtime exchange failed' }
          $proofExe = '.rimgovernor/protobuf-exchange/source/tools/protobuf/bin/Release/net472/ProtobufProof.exe'
          if ($IsWindows) {
            & $proofExe --verify-return .rimgovernor/protobuf-exchange/roundtrip .rimgovernor/protobuf-go-return
          } else {
            mono $proofExe --verify-return .rimgovernor/protobuf-exchange/roundtrip .rimgovernor/protobuf-go-return
          }
          if ($LASTEXITCODE -ne 0) { throw 'C# original/Go/C# full-set equality failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protobuf-${{ runner.os }}
          path: |
            .rimgovernor/protobuf-go-check/result.json
            .rimgovernor/protobuf-go-origin
            .rimgovernor/protobuf-exchange/roundtrip
            .rimgovernor/protobuf-go-return
