name: Fixture factory

# Runs the colony generator (`acceptance colony`) on the remote-acceptance
# runner setup and publishes its checkpoint ring as the run artifact
# colony-checkpoints-<commit>, also when the window fails (the run stays red).
# `acceptance profile-capture -from latest-ci` and `acceptance fetch-fixture`
# download the newest completed run's artifact. Gate and bootstrap are
# remote_workflow.ps1's, as in remote-acceptance; no case is planned.

on:
  workflow_dispatch:
    inputs:
      tested_ref:
        description: Same-repository branch or tag to run (resolved once at startup)
        default: main
        type: string
  schedule:
    - cron: '41 3 * * 0'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  REMOTE_ACCEPTANCE_ENABLED: ${{ vars.REMOTE_ACCEPTANCE_ENABLED }}
  REMOTE_ACCEPTANCE_MAINTAINERS: ${{ vars.REMOTE_ACCEPTANCE_MAINTAINERS }}
  REMOTE_BUNDLE_ASSET: ${{ vars.REMOTE_BUNDLE_ASSET }}
  REMOTE_INVENTORY_ASSET: ${{ vars.REMOTE_INVENTORY_ASSET }}
  REMOTE_BUNDLE_SHA256: ${{ vars.REMOTE_BUNDLE_SHA256 }}
  REMOTE_ARTIFACT_MAX_BYTES: ${{ vars.REMOTE_ARTIFACT_MAX_BYTES || '0' }}
  REMOTE_GENERATOR: colony
  GOTOOLCHAIN: local
  GOWORK: 'off'
  CGO_ENABLED: '0'

concurrency:
  group: fixture-factory
  cancel-in-progress: false

jobs:
  factory:
    if: github.repository == 'davidarcher/rimgovernor' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 360
    environment: remote-acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Authorize before selected code, bundle cache or identity access
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase gate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head }}
          path: tested
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Compiling tools/rg needs the game's reference assemblies (brain/Game.props);
      # the script decrypts just those from the bundle, builds from the trusted
      # checkout and deletes them and the identity before it returns.
      - name: Publish the trusted tool host (rg.exe)
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_BUNDLE_IDENTITY: ${{ secrets.REMOTE_BUNDLE_IDENTITY }}
        run: ./trusted/scripts/publish_trusted_rg.ps1 -Trusted "$env:GITHUB_WORKSPACE/trusted" -Out C:\rg
      - name: Bootstrap and run the colony generator
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_BUNDLE_IDENTITY: ${{ secrets.REMOTE_BUNDLE_IDENTITY }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase factory
      - name: Stop this job's processes and remove identity
        if: always() && steps.gate.outcome == 'success'
        run: |
          ./trusted/scripts/cleanup_remote.ps1 -Work C:\rg\fixture
          if (Test-Path C:\rg\identity.txt) { Remove-Item -LiteralPath C:\rg\identity.txt }
      # A failed window still leaves its ring (published below); these are why
      # the governed processes exited and the generator's result.json.
      - name: Record why governed processes exited
        if: failure() && steps.gate.outcome == 'success'
        continue-on-error: true
        run: ./trusted/scripts/collect_crash_remote.ps1 -Out C:\rg\crash\s1
      - name: Collect failure diagnostics
        if: failure() && steps.gate.outcome == 'success'
        run: |
          New-Item -ItemType Directory -Force C:\rg\public | Out-Null
          if (Test-Path C:\rg\crash\s1) { Copy-Item -LiteralPath C:\rg\crash\s1 -Destination C:\rg\public\crash -Recurse }
          if (Test-Path C:\rg\fixture\job\out\result.json) { Copy-Item -LiteralPath C:\rg\fixture\job\out\result.json -Destination C:\rg\public }
          if (-not (Get-ChildItem C:\rg\public)) { '{"passed":false,"error":"The generator left no result; inspect Actions job logs"}' | Set-Content C:\rg\public\incomplete.json }
      - name: Upload failure diagnostics
        if: failure() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-diagnostics-${{ github.run_id }}
          path: C:\rg\public
          if-no-files-found: error
          retention-days: 7
      # Published passed or failed (a failed window keeps the run red): the
      # bundle is what a colony is troubleshot and profiled from.
      - name: Collect the checkpoint ring
        if: always() && steps.gate.outcome == 'success'
        env:
          TESTED_COMMIT: ${{ steps.gate.outputs.head }}
        run: |
          $boot = 'C:\rg\fixture\job\bootstrap.json'
          if (-not (Test-Path $boot)) { throw 'The run left no fixture bootstrap' }
          $root = (Get-Content -LiteralPath $boot -Raw | ConvertFrom-Json).root
          $ring = Join-Path $root 'checkpoints\sustained\colony'
          if (-not (Test-Path -LiteralPath (Join-Path $ring 'ring.json'))) { throw 'The run left no checkpoint ring' }
          New-Item -ItemType Directory -Force C:\rg\factory\checkpoints\sustained | Out-Null
          Copy-Item -LiteralPath $ring -Destination C:\rg\factory\checkpoints\sustained\colony -Recurse
          if (Test-Path C:\rg\fixture\job\out\result.json) { Copy-Item -LiteralPath C:\rg\fixture\job\out\result.json -Destination C:\rg\factory }
          @{tested_commit=$env:TESTED_COMMIT; run_id=$env:GITHUB_RUN_ID; cases='sustained/colony'} |
            ConvertTo-Json | Set-Content C:\rg\factory\factory.json
      # 90 days (the public-repository maximum) outlives the weekly cadence
      # many times over, so the newest bundle never expires before the next.
      - name: Upload the checkpoint bundle
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colony-checkpoints-${{ steps.gate.outputs.head }}
          path: C:\rg\factory
          if-no-files-found: error
          retention-days: 90
