name: External controller
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned RIMAPI source from the local patch bundle
        run: |
          git clone --no-checkout https://github.com/IlyaChichkov/RIMAPI.git integrations/RIMAPI
          git -C integrations/RIMAPI fetch ../patches/rimapi-local.bundle HEAD
          git submodule update --init --no-fetch integrations/RIMAPI
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: pnpm install --frozen-lockfile
        working-directory: dashboard
      - run: pnpm run typecheck && pnpm test && pnpm build
        working-directory: dashboard
