name: Go migration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
        shell: pwsh
    env:
      GOTOOLCHAIN: go1.27.1
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Verify pinned toolchain and formatting
        run: |
          if ((go env GOVERSION) -ne ('go' + (Get-Content .go-version).Trim())) {
            throw 'Go toolchain differs from .go-version'
          }
          $unformatted = gofmt -l .
          if ($LASTEXITCODE -ne 0 -or $unformatted) {
            throw "Run gofmt: $unformatted"
          }
      - name: Check module integrity and graph drift
        run: |
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Module integrity failed' }
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { throw 'Module graph needs tidy' }
      - run: go vet ./...
      - run: go test ./...
      - name: Build gated command
        run: go build -trimpath -o ../.rimgovernor/go/rimgovernor${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/rimgovernor
      - name: Linux race checks
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
          # Ownership tests exercise a one-second subprocess shutdown deadline.
          GORACE: 'atexit_sleep_ms=0'
        run: go test -race ./...
