name: Colony review

# Plays `acceptance colony-review` (a pinned-seed map for an in-game season
# with the governor in charge, recording an hourly screenshot and colony
# facts) on the remote-acceptance runner setup, renders the recording with
# the colonyreview tool and publishes the newest reports to GitHub Pages. A
# review, not a gate: the report is built from whatever was recorded even
# when the run fails. Gate and bootstrap are remote_workflow.ps1's, as in
# fixture-factory.yml; no case is planned.

on:
  workflow_dispatch:
    inputs:
      tested_ref:
        description: Same-repository branch or tag to run (resolved once at startup)
        default: main
        type: string
      seed:
        description: World seed (empty plays the pinned nightly seed)
        required: false
        type: string
      days:
        description: In-game days to play (a quadrum is 15)
        default: '15'
        type: string
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  REMOTE_ACCEPTANCE_ENABLED: ${{ vars.REMOTE_ACCEPTANCE_ENABLED }}
  REMOTE_ACCEPTANCE_MAINTAINERS: ${{ vars.REMOTE_ACCEPTANCE_MAINTAINERS }}
  REMOTE_BUNDLE_ASSET: ${{ vars.REMOTE_BUNDLE_ASSET }}
  REMOTE_INVENTORY_ASSET: ${{ vars.REMOTE_INVENTORY_ASSET }}
  REMOTE_BUNDLE_SHA256: ${{ vars.REMOTE_BUNDLE_SHA256 }}
  REMOTE_ARTIFACT_MAX_BYTES: ${{ vars.REMOTE_ARTIFACT_MAX_BYTES || '0' }}
  REMOTE_GENERATOR: colony-review
  GOTOOLCHAIN: local
  GOWORK: 'off'
  CGO_ENABLED: '0'
  # How many reports the Pages site keeps, newest first.
  KEEP_RUNS: '14'
  # How many earlier reports the render step searches for a same-seed score
  # baseline (the newest with the run's seed wins).
  BASELINE_RUNS: '8'

concurrency:
  group: colony-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'davidarcher/rimgovernor' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 360
    environment: remote-acceptance
    permissions:
      contents: read
      actions: read
    outputs:
      report: ${{ steps.report.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Authorize before selected code, bundle cache or identity access
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase gate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head }}
          path: tested
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Compiling tools/rg needs the game's reference assemblies (brain/Game.props);
      # the script decrypts just those from the bundle, builds from the trusted
      # checkout and deletes them and the identity before it returns.
      - name: Publish the trusted tool host (rg.exe)
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_BUNDLE_IDENTITY: ${{ secrets.REMOTE_BUNDLE_IDENTITY }}
        run: ./trusted/scripts/publish_trusted_rg.ps1 -Trusted "$env:GITHUB_WORKSPACE/trusted" -Out C:\rg
      # The site job (below) runs this same trusted host; the artifact is the exe
      # alone, never the decrypted reference assemblies or the identity.
      - name: Upload the trusted tool host for the site job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colony-review-tools-${{ github.run_id }}
          path: C:\rg\rg.exe
          if-no-files-found: error
          retention-days: 1
      - name: Audit process exits so a vanished game leaves its exit status
        continue-on-error: true
        run: auditpol /set /subcategory:"Process Termination" /success:enable
      # The review renders through a graphics device; a hosted runner has none, so lavapipe (CPU Vulkan) stands in.
      - name: Install a software Vulkan device
        run: ./trusted/scripts/install_software_vulkan.ps1
      - name: Bootstrap and play the review season
        id: play
        continue-on-error: true
        # A hung game must not hold the always() collect and upload steps back: a one-day trial gets 40 minutes, a longer
        # season (the nightly's 15 days) the job's 360; the run's own -timeout is the finer bound.
        timeout-minutes: ${{ fromJSON(inputs.days || '15') <= 1 && 40 || 360 }}
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_BUNDLE_IDENTITY: ${{ secrets.REMOTE_BUNDLE_IDENTITY }}
          RIMGOVERNOR_REVIEW_SEED: ${{ inputs.seed }}
          RIMGOVERNOR_REVIEW_DAYS: ${{ inputs.days }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase review
      - name: Record why governed processes exited (#1358)
        if: always() && steps.gate.outcome == 'success'
        continue-on-error: true
        run: ./trusted/scripts/collect_crash_remote.ps1 -Out C:\rg\crash\s1
      - name: Stop this job's processes and remove identity
        if: always() && steps.gate.outcome == 'success'
        run: |
          ./trusted/scripts/cleanup_remote.ps1 -Work C:\rg\fixture
          if (Test-Path C:\rg\identity.txt) { Remove-Item -LiteralPath C:\rg\identity.txt }
      # Why the governed processes exited and the run's result.json, whatever
      # the play step's outcome (as fixture-factory.yml publishes them).
      - name: Collect diagnostics
        if: always() && steps.gate.outcome == 'success'
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force C:\rg\public | Out-Null
          if (Test-Path C:\rg\crash\s1) { Copy-Item -LiteralPath C:\rg\crash\s1 -Destination C:\rg\public\crash -Recurse }
          if (Test-Path C:\rg\fixture\job\out\result.json) { Copy-Item -LiteralPath C:\rg\fixture\job\out\result.json -Destination C:\rg\public }
          # The in-process brain's store (clock holds, plans, decisions): what a stalled clock was waiting on.
          if (Test-Path C:\rg\fixture\job\out\service.sqlite) { Copy-Item -Path C:\rg\fixture\job\out\service.sqlite* -Destination C:\rg\public }
          # The brain's OTLP log ring (config-*/<game>/logs*.jsonl: clock_run decisions with their refused reasons,
          # planner steps), beside the game's captured stdout (config-*/<game>/game.log): why a launch never announced its channel.
          $bridge = 'C:\rg\fixture\job\layout\bridge\'
          Get-ChildItem -LiteralPath $bridge -Filter game.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $name = $_.FullName.Substring($bridge.Length) -replace '[\\/]', '_'
            Get-Content -LiteralPath $_.FullName -Tail 20000 | Set-Content -LiteralPath (Join-Path C:\rg\public $name)
          }
          Get-ChildItem -LiteralPath $bridge -Filter 'logs*.jsonl' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $name = $_.FullName.Substring($bridge.Length) -replace '[\\/]', '_'
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path C:\rg\public $name)
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.gate.outcome == 'success'
        with:
          name: colony-review-diagnostics
          path: C:\rg\public
          if-no-files-found: ignore
          retention-days: 7
      # The previous nights' reports are the score baseline store:
      # the same artifacts the pages job builds the site from. Only run.json
      # is read; a failed download just leaves no baseline (unknown).
      - name: Fetch earlier reports for the score baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ids = gh run list -R $env:GITHUB_REPOSITORY -w colony-review.yml -s success -L $env:BASELINE_RUNS --json databaseId -q '.[].databaseId'
          foreach ($id in $ids) {
            if ("$id" -eq $env:GITHUB_RUN_ID) { continue }
            gh run download $id -R $env:GITHUB_REPOSITORY -n colony-review-report -D C:\rg\baselines
            if ($LASTEXITCODE) { Write-Host "run ${id}: no report artifact" }
          }
      - name: Render the report
        id: report
        env:
          TESTED_COMMIT: ${{ steps.gate.outputs.head }}
          PLAYED: ${{ steps.play.outcome }}
        run: |
          # No result.json (bootstrap or launch failed) still renders a page that
          # says the run failed; the last step of this job then fails it.
          $out = 'C:\rg\fixture\job\out'
          $in = if (Test-Path (Join-Path $out 'result.json')) { $out } else { (New-Item -ItemType Directory -Force C:\rg\no-result).FullName }
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $name = "$date-$env:GITHUB_RUN_ID"
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          & C:\rg\rg.exe colonyreview report -in $in -out "C:\rg\review-report\$name" -baselines C:\rg\baselines `
            -meta "date=$date" -meta "commit=$($env:TESTED_COMMIT.Substring(0,9))" -meta "run=$url" -meta "outcome=$env:PLAYED"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "name=$name" >> $env:GITHUB_OUTPUT
          "Colony review $name rendered (play step: $env:PLAYED)." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colony-review-report
          path: C:\rg\review-report
          if-no-files-found: error
          retention-days: 90
      # The season not playing is the run failing, though its page is still
      # built and published.
      - name: Fail the job when the season did not play
        if: always() && steps.play.outcome == 'failure'
        run: |
          Write-Host "The play step failed; the report records it."
          exit 1

  # Builds the site with the trusted rg.exe the review job published. Windows
  # because rg.exe needs the game's assemblies to compile (brain/Game.props) and
  # runs as a win-x64 exe; it needs no secret (the identity stays in the review
  # job) and runs no tested code. The site goes up as a plain artifact; the pages
  # job below deploys it from Linux, where upload-pages-artifact and
  # deploy-pages are known to work.
  site:
    needs: review
    if: always() && needs.review.outputs.report != ''
    runs-on: windows-2022
    timeout-minutes: 15
    environment: remote-acceptance
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Recheck authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase authorize
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: colony-review-tools-${{ github.run_id }}
          path: C:\rg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: colony-review-report
          path: runs
      # Earlier reports come back from their own runs' artifacts, so the
      # site needs no branch of its own.
      - name: Fetch earlier reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ids = gh run list -R $env:GITHUB_REPOSITORY -w colony-review.yml -L $env:KEEP_RUNS --json databaseId -q '.[].databaseId'
          foreach ($id in $ids) {
            if ("$id" -eq $env:GITHUB_RUN_ID) { continue }
            gh run download $id -R $env:GITHUB_REPOSITORY -n colony-review-report -D runs
            if ($LASTEXITCODE) { Write-Host "run ${id}: no report artifact" }
          }
          Get-ChildItem runs -Directory | Sort-Object Name -Descending | Select-Object -Skip ([int]$env:KEEP_RUNS) |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
          $global:LASTEXITCODE = 0
      - name: Build the site
        run: |
          & C:\rg\rg.exe colonyreview site -runs runs -out site
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colony-review-site-${{ github.run_id }}
          path: site
          if-no-files-found: error
          retention-days: 1

  # Deploy only: no game, no secret, no checkout.
  pages:
    needs: site
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: colony-review-site-${{ github.run_id }}
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
