name: Snapshot perf

# Nightly SnapshotFrames.Capture timings: profile-capture on the
# fixture factory's newest colony-generator bundle, recorded as
# snapshot-perf-<commit> and compared with the median p90 of the last
# seven successful runs; a regressed family opens or updates one issue.

on:
  workflow_dispatch:
    inputs:
      tested_ref:
        description: Same-repository branch or tag to profile (resolved once at startup)
        default: main
        type: string
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  REMOTE_ACCEPTANCE_ENABLED: ${{ vars.REMOTE_ACCEPTANCE_ENABLED }}
  REMOTE_ACCEPTANCE_MAINTAINERS: ${{ vars.REMOTE_ACCEPTANCE_MAINTAINERS }}
  REMOTE_BUNDLE_ASSET: ${{ vars.REMOTE_BUNDLE_ASSET }}
  REMOTE_INVENTORY_ASSET: ${{ vars.REMOTE_INVENTORY_ASSET }}
  REMOTE_BUNDLE_SHA256: ${{ vars.REMOTE_BUNDLE_SHA256 }}
  REMOTE_ARTIFACT_MAX_BYTES: ${{ vars.REMOTE_ARTIFACT_MAX_BYTES || '0' }}
  # Profile runs no case: the gate resolves its source as a generator.
  REMOTE_GENERATOR: profile-capture
  GOTOOLCHAIN: local
  GOWORK: 'off'
  CGO_ENABLED: '0'

jobs:
  profile:
    if: github.repository == 'davidarcher/rimgovernor' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    environment: remote-acceptance
    permissions:
      contents: read
      actions: read
    outputs:
      head: ${{ steps.gate.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Authorize before selected code, bundle cache or identity access
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase gate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head }}
          path: tested
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Compiling tools/rg needs the game's reference assemblies (brain/Game.props);
      # the script decrypts just those from the bundle, builds from the trusted
      # checkout and deletes them and the identity before it returns.
      - name: Publish the trusted tool host (rg.exe)
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_BUNDLE_IDENTITY: ${{ secrets.REMOTE_BUNDLE_IDENTITY }}
        run: ./trusted/scripts/publish_trusted_rg.ps1 -Trusted "$env:GITHUB_WORKSPACE/trusted" -Out C:\rg
      # The compare job runs this same trusted host; the artifact is the exe alone.
      - name: Upload the trusted tool host for the compare job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-perf-tools-${{ github.run_id }}
          path: C:\rg\rg.exe
          if-no-files-found: error
          retention-days: 1
      - name: Fetch the newest factory bundle
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = & C:\rg\rg.exe acceptance fetch-fixture -root C:\rg\ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "bundle=$(@($bundle)[-1])" >> $env:GITHUB_OUTPUT
      - name: Bootstrap and profile SnapshotFrames.Capture
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_BUNDLE_IDENTITY: ${{ secrets.REMOTE_BUNDLE_IDENTITY }}
          BUNDLE: ${{ steps.fixture.outputs.bundle }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase profile -Bundle $env:BUNDLE -Count 50
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-capture-${{ github.run_id }}
          path: C:\rg\evidence\profile.json
          if-no-files-found: error
          retention-days: 7

  # Windows because rg.exe needs the game's assemblies to compile
  # (brain/Game.props) and is a win-x64 exe. No secret and no tested code: it
  # runs the trusted host the profile job published.
  compare:
    needs: profile
    runs-on: windows-2022
    timeout-minutes: 15
    environment: remote-acceptance
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Recheck authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./trusted/scripts/remote_workflow.ps1 -Phase authorize
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot-perf-tools-${{ github.run_id }}
          path: C:\rg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-capture-${{ github.run_id }}
          path: ${{ runner.temp }}\capture
      - name: Record and compare with the rolling baseline
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.profile.outputs.head }}
        run: |
          & C:\rg\rg.exe acceptance profile-compare `
            -current "$env:RUNNER_TEMP\capture\profile.json" -commit $env:HEAD_SHA -run $env:GITHUB_RUN_ID `
            -out "$env:RUNNER_TEMP\record\record.json" -history "$env:RUNNER_TEMP\history" -fetch -window 7 `
            -threshold 0.3 -summary $env:GITHUB_STEP_SUMMARY -issue
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # 30 days holds the seven-run window several times over.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-perf-${{ needs.profile.outputs.head }}
          path: ${{ runner.temp }}/record/record.json
          if-no-files-found: error
          retention-days: 30
