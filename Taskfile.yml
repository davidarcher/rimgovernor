# Repository build/test contract (https://taskfile.dev).
#
# `task build` and `task test` fan out to every project with its own toolchain
# root; each project ships a Taskfile.yml implementing both, so a missing one
# fails to load instead of being skipped. `build` includes the static gates that
# produce a build failure (warnings as errors, locked restores, architecture
# analyzers); `test` is tests only and runs every project concurrently.
# Projects needing machine-local inputs (game DLLs) report
# `unavailable` with the missing path rather than pass.
# Build outputs and evidence land under .rimgovernor/task. Hosted workflows
# (.github/workflows) cover remote acceptance only; the gate runs locally before work lands on main.
#
# Install: `winget install Task.Task`.
version: '3'

includes:
  native: { taskfile: integrations/rimgovernor-native, dir: integrations/rimgovernor-native }
  probes: { taskfile: contracts/tests, dir: contracts/tests }
  brain: { taskfile: brain, dir: brain }
  repo: { taskfile: tools/repo, dir: tools/repo }
  rg: { taskfile: tools/rg, dir: tools/rg }
  launcher: { taskfile: tools/launcher, dir: tools/launcher }

tasks:
  build:
    desc: Static gates and builds for every project
    cmds:
      - task: native:build
      - task: probes:build
      - task: brain:build
      - task: repo:build
      - task: rg:build
      - task: launcher:build

  test:
    desc: Tests for every project, run concurrently
    deps:
      - native:test
      - probes:test
      - brain:test
      - repo:test
      - rg:test
      - launcher:test
