# Official Protobuf toolchain: generation drift checks for both languages and
# the C#/Go/C# fixture exchange. Requires the .NET SDK; Linux additionally
# needs Mono to execute the net472 proof.
version: '3'

vars:
  REPO: '{{.TASKFILE_DIR}}/../..'
  EVIDENCE: '{{.REPO}}/.rimgovernor/task/protobuf'
  NUGET_PACKAGES: '{{.NUGET_PACKAGES | default (printf "%s/.nuget/packages" (ternary .USERPROFILE .HOME (eq OS "windows")))}}'
  # Grpc.Tools 2.72.0 is restored by generatecsharp; generatego runs its protoc.
  PROTOC: '{{.NUGET_PACKAGES}}/grpc.tools/2.72.0/tools/{{if eq OS "windows"}}windows_x64/protoc.exe{{else}}linux_x64/protoc{{end}}'
  GENERATE: go -C {{.REPO}}/go run ./internal/protobufgen/cmd
  PROOF_GO: go -C {{.TASKFILE_DIR}}/go run -mod=readonly .
  MONO: '{{if ne OS "windows"}}mono {{end}}'

tasks:
  build:
    desc: Generated C# and Go match the checked-in outputs (compiles the C# proof)
    cmds:
      - rm -rf {{.EVIDENCE}}/csharp-check {{.EVIDENCE}}/go-check
      - mkdir -p {{.EVIDENCE}}
      - '{{.GENERATE}}/generatecsharp --check --output {{.EVIDENCE}}/csharp-check'
      - '{{.GENERATE}}/generatego --protoc "{{.PROTOC}}" --check --output {{.EVIDENCE}}/go-check --modcache {{.EVIDENCE}}/gomodcache'

  test:
    desc: C#→Go→C# exchange of every generated message shape; skipped while its inputs are unchanged
    sources:
      - '{{.REPO}}/contracts/proto/**/*'
      - '{{.REPO}}/contracts/generated/protobuf/**/*'
      - '{{.REPO}}/go/internal/protobufgen/**/*'
      - '**/*'
      - exclude: '**/bin/**'
      - exclude: '**/obj/**'
    generates:
      - '{{.EVIDENCE}}/exchange.ok'
    cmds:
      - rm -rf {{.EVIDENCE}}/origin {{.EVIDENCE}}/exchange {{.EVIDENCE}}/return {{.EVIDENCE}}/exchange.ok
      - mkdir -p {{.EVIDENCE}}
      - '{{.PROOF_GO}} --output {{.EVIDENCE}}/origin'
      - '{{.GENERATE}}/generatecsharp --check --proof --cross-language-inputs {{.EVIDENCE}}/origin --output {{.EVIDENCE}}/exchange'
      - '{{.PROOF_GO}} --output {{.EVIDENCE}}/return --cross-language-inputs {{.EVIDENCE}}/exchange/roundtrip --check-go-echo'
      - '{{.MONO}}{{.EVIDENCE}}/exchange/source/tools/protobuf/bin/Release/net472/ProtobufProof.exe --verify-return {{.EVIDENCE}}/exchange/roundtrip {{.EVIDENCE}}/return'
      - echo "C#/Go/C# exchange verified" > {{.EVIDENCE}}/exchange.ok
