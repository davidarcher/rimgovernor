# Optional local telemetry backend (Grafana, Tempo, Loki, Prometheus and an OTel
# collector in one image). Consumer contract (launcher): project name
# rimgovernor-observability, service "lgtm", host ports 4317 (OTLP gRPC),
# 4318 (OTLP HTTP) and 3000 (Grafana), dashboards provisioned from ./dashboards.
# See docs/developers/observability.md.
name: rimgovernor-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data
      - ./dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/rimgovernor.yaml:ro
      - ./dashboards:/rimgovernor-dashboards:ro
    restart: unless-stopped

volumes:
  lgtm-data:
