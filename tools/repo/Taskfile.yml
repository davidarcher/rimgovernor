# Repo front door (tools/repo, with tools/common): the C# console tool behind RimGovernor.cmd (land, test, issue,
# affected). Needs only the .NET SDK 10 and git; this build is the static gate (nullable, warnings as errors).
version: '3'

tasks:
  build:
    desc: Front door and its lane tests with nullable and warnings as errors
    cmds:
      - dotnet build ../repo.Tests/repo.Tests.csproj --configuration Release --nologo -p:RestoreLockedMode=true -p:TreatWarningsAsErrors=true

  test:
    desc: The landing lane against throwaway git repositories
    cmds:
      - dotnet test ../repo.Tests/repo.Tests.csproj --configuration Release --nologo --no-build
