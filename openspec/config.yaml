schema: spec-driven

context: |
  Food security is the only migrated capability. Read openspec/README.md and
  docs/requirements/food-security.md before planning food changes. Other
  capabilities remain in docs/requirements. AGENTS.md governs work and landing.

rules:
  specs:
    - Preserve stable RG requirement IDs and existing intent provenance.
    - Do not promote inferred candidates or proposed scenarios to human-approved intent without an explicit decision and source.
    - Keep implementation status and execution evidence in the owning requirements evidence page, linked from the spec.
  design:
    - Trace changed behavior through facts, pure policy, shared demand and Method admission, Hands, native orders and observed outcomes; review architecture rules 7–9.
  tasks:
    - Include appropriate tests, owning contract updates and evidence updates with the behavior change; distinguish registered cases from executed passes.

operations:
  apply:
    guidance:
      - Follow AGENTS.md for verification and landing; use RimGovernor.cmd test and the landing lane.
  archive:
    guidance:
      - Preserve intent provenance and evidence limits when synchronizing; archive completion is not gameplay proof.
