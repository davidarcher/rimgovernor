[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rimbot"
version = "0.2.0"
description = "External RimWorld colony controller and dashboard over RIMAPI"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "websockets>=14,<17"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "openapi-spec-validator>=0.7,<0.8"]

[project.scripts]
rimbot = "rimbot.__main__:main"

[tool.setuptools.packages.find]
where = ["controller"]

[tool.setuptools.package-data]
rimbot = ["static/*", "static/assets/*", "data/*.json", "data/strategies/*.json"]

[tool.pytest.ini_options]
testpaths = ["controller_tests"]
pythonpath = ["controller"]
asyncio_mode = "auto"
