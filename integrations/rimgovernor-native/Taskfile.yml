# Native mod (Bridge + Runtime + the vendored GABP host in integrations/rimgovernor-host)
# packaged by scripts/build_native_mod.ps1. Needs the game's managed assemblies and
# Harmony; without them the build reports `unavailable` naming the missing path.
version: '3'

vars:
  REPO: '{{.TASKFILE_DIR}}/../..'
  EVIDENCE: '{{.REPO}}/.rimgovernor/task/native'
  RIMWORLD_DIR: '{{.RIMWORLD_DIR | default "C:/Program Files (x86)/Steam/steamapps/common/RimWorld"}}'
  HARMONY_ASSEMBLY: '{{.HARMONY_ASSEMBLY | default "C:/Program Files (x86)/Steam/steamapps/workshop/content/294100/2009463077/Current/Assemblies/0Harmony.dll"}}'

tasks:
  build:
    desc: Bridge and Runtime with warnings as errors and a locked restore, packaged with notices
    sources:
      - 'src/**/*'
      - '{{.REPO}}/integrations/rimgovernor-host/**/*'
      - 'About/**/*'
      - 'Notices/**/*'
      - '{{.REPO}}/contracts/proto/**/*'
      - '{{.REPO}}/contracts/generated/protobuf/csharp/**/*'
      - '{{.REPO}}/scripts/build_native_mod.ps1'
      - '{{.RIMWORLD_DIR}}/*.dll'
      - '{{.HARMONY_ASSEMBLY}}'
      - exclude: '**/bin/**'
      - exclude: '**/obj/**'
    generates:
      - '{{.EVIDENCE}}/mod/RimGovernor/native-manifest.json'
    cmds:
      - |
        missing=""
        for input in "{{.RIMWORLD_DIR}}/Assembly-CSharp.dll" "{{.HARMONY_ASSEMBLY}}"; do
          [ -f "$input" ] || missing="$missing $input"
        done
        if [ -n "$missing" ]; then
          echo "native build: unavailable (missing$missing)"
          exit 0
        fi
        rm -rf "{{.EVIDENCE}}/mod"
        mkdir -p "{{.EVIDENCE}}"
        pwsh -NoProfile -File "{{.REPO}}/scripts/build_native_mod.ps1" \
          -RimWorldDir "{{.RIMWORLD_DIR}}" -HarmonyAssembly "{{.HARMONY_ASSEMBLY}}" \
          -OutputRoot "{{.EVIDENCE}}/mod"

  test:
    desc: No unit tests; native behavior is verified by go/internal/nativeaccept harnesses against a real game
    cmds:
      - 'echo "native test: no unit tests (game-level acceptance lives in go/internal/nativeaccept/cmd)"'
