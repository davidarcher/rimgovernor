syntax = "proto3";
package rimgovernor.clock.v1;
option csharp_namespace = "RimGovernor.Protocol.Clock";
option go_package = "github.com/davidarcher/RimGovernor/go/internal/wire/clockpb;clockpb";
import "common.proto";
import "authority.proto";
import "receipts.proto";

// Requested epoch speeds. Ultrafast is an ordinary speed on the wire; the
// native dev tick boost behind it is test acceleration
// (StartRequest.test_acceleration), which only a game launched with
// -rimgovernor-test-acceleration (acceptance profiles) admits.
enum Speed {
  SPEED_UNSPECIFIED = 0;
  SPEED_NORMAL = 1;
  SPEED_FAST = 2;
  SPEED_SUPERFAST = 3;
  SPEED_ULTRAFAST = 4;
}
enum ObservedSpeed {
  OBSERVED_SPEED_UNSPECIFIED = 0;
  OBSERVED_SPEED_PAUSED = 1;
  OBSERVED_SPEED_NORMAL = 2;
  OBSERVED_SPEED_FAST = 3;
  OBSERVED_SPEED_SUPERFAST = 4;
  OBSERVED_SPEED_ULTRAFAST = 5;
}
enum WatchMode {
  WATCH_MODE_UNSPECIFIED = 0;
  WATCH_MODE_COLONY = 1;
  WATCH_MODE_COMBAT = 2;
}
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  STOP_REASON_REQUESTED_PAUSE = 1;
  STOP_REASON_TICK_BUDGET = 2;
  STOP_REASON_SESSION_CHANGED = 3;
  STOP_REASON_UNAVAILABLE = 4;
  STOP_REASON_EXTERNAL_PAUSE = 5;
  STOP_REASON_LETTER_PAUSE = 6;
  STOP_REASON_EXTERNAL_SPEED_CHANGED = 7;
  STOP_REASON_LEASE_EXPIRED = 8;
  STOP_REASON_WATCHER_ERROR = 9;
  STOP_REASON_EVENT_JOURNAL_ERROR = 10;
  STOP_REASON_FORCE_PAUSED = 11;
  STOP_REASON_COLONY_NAMING = 12;
  STOP_REASON_START_REFUSED = 13;
  STOP_REASON_NOTIFICATION_BATCH = 14;
  STOP_REASON_MEDICAL_REST_CHANGED = 15;
  STOP_REASON_HOSTILE = 16;
  STOP_REASON_COLONIST_DOWNED = 17;
  STOP_REASON_PREDATOR_HUNT = 18;
  STOP_REASON_HUNTING_ROUTE_UNSAFE = 19;
  STOP_REASON_COLONIST_HEALTH = 20;
  STOP_REASON_COLONIST_INJURY = 21;
  // An armed watched attempt reached a terminal outcome; the epoch stopped at
  // the next tick boundary so the controller can react at once.
  STOP_REASON_WATCH_LATCHED = 22;
  // A force-pausing Verse.Dialog_NodeTree the game opened by itself holds the
  // clock; PauseEvidence.dialog names it and ColonyFactsSnapshot.dialog lists
  // its options for Operations.AnswerDialog.
  STOP_REASON_DIALOG_PAUSE = 23;
}

message WatchPolicy {
  optional WatchMode mode = 1;
  optional float health_drop_fraction = 2;
  optional float min_health_fraction = 3;
  optional float hostile_within = 4;
  repeated string acknowledged_hostile_ids = 5;
  repeated string acknowledged_downed_colonist_ids = 6;
  repeated string acknowledged_injured_colonist_ids = 7;
  optional uint32 injury_stop_cooldown_ms = 8;
  repeated string surgical_recovery_ids = 9;
  repeated string medical_rest_ids = 10;
  // Attempts whose terminal progress stops the epoch at the next tick boundary
  // (STOP_REASON_WATCH_LATCHED). At most 16, distinct, complete keys, each an
  // attempt the native ledger admitted for this identity. An attempt that is
  // already terminal at Start is reported once as OperationOutcome and is not
  // armed; it never burns the window.
  repeated rimgovernor.common.v1.AttemptKey watched_attempts = 11;
}

// Epoch ownership is distinct from automation authority and viewer/input leases.
message EpochOwner {
  optional string controller_session_id = 1;
  optional int64 epoch = 2;
}
message StartRequest {
  rimgovernor.authority.v1.WritePrecondition authority = 1;
  optional Speed speed = 2;
  WatchPolicy policy = 3;
  optional uint32 lease_ms = 4;
  optional uint32 max_ticks = 5;
  // Enable the native tick boost for this epoch. Requires SPEED_ULTRAFAST and
  // a game launched with test acceleration (Status.test_acceleration_available);
  // refused otherwise. An accelerated epoch cannot change speed, only pause
  // or change its ceiling.
  optional bool test_acceleration = 6;
  // Blind-tick regulator (issue #583). Blind ticks are the ticks between the
  // controller's last read (a status, events or bundle read, or the oldest
  // journal row it has not yet acknowledged with an after_cursor) and the
  // current tick. Past this budget native throttles the epoch toward Normal
  // at the next tick boundary and ramps back up once the controller catches
  // up (immediate decrease, multiplicative increase), journaling both
  // transitions as SpeedChanged without ending the epoch. Zero or absent
  // leaves the epoch unregulated.
  optional uint32 blind_tick_budget = 7;
  // Continuous ceiling on the epoch's tick rate, beneath the requested
  // speed's own rate; an accelerated epoch admits a live change through
  // SpeedRequest. Zero or absent is the speed's own rate.
  optional uint32 max_ticks_per_second = 8;
}
message OwnedRequest {
  rimgovernor.common.v1.Identity identity = 1;
  EpochOwner owner = 2;
}
message RenewRequest {
  OwnedRequest epoch = 1;
  rimgovernor.authority.v1.WritePrecondition authority = 2;
  optional uint32 lease_ms = 3;
}
message SpeedRequest {
  OwnedRequest epoch = 1;
  rimgovernor.authority.v1.WritePrecondition authority = 2;
  optional Speed speed = 3;
  // The new ceiling (StartRequest.max_ticks_per_second); absent keeps the
  // epoch's. An accelerated epoch admits this with SPEED_ULTRAFAST.
  optional uint32 max_ticks_per_second = 4;
}
message StatusRequest { rimgovernor.common.v1.Identity identity = 1; }

message Epoch {
  EpochOwner owner = 1;
  rimgovernor.common.v1.ObservationContext origin = 2;
  optional Speed requested_speed = 3;
  WatchPolicy policy = 4;
  optional int64 start_tick = 5;
  optional int64 tick_deadline = 6;
  optional uint32 lease_remaining_ms = 7;
  optional int64 last_tick = 8;
  optional bool test_acceleration = 9;
  optional uint32 blind_tick_budget = 10;
  optional uint32 max_ticks_per_second = 11;
  // The ceiling the blind-tick regulator holds right now; zero when it is
  // not throttling.
  optional uint32 regulated_ticks_per_second = 12;
}
message Running { Epoch epoch = 1; }
message Stopping {
  Epoch epoch = 1;
  optional StopReason pending_reason = 2;
  optional string detail = 3;
  // Failed pause stays armed. This state never grants permission to resume.
  optional bool actual_paused = 4;
}
message Stopped {
  Epoch epoch = 1;
  optional StopReason reason = 2;
  optional string detail = 3;
  optional bool actual_paused = 4;
  optional bool pause_verified = 5;
  optional bool pause_requested = 6;
  optional int64 stopped_at_unix_ms = 7;
}
message NeverStarted {}
message Status {
  rimgovernor.common.v1.ObservationContext context = 1;
  oneof state {
    Running running = 2;
    Stopping stopping = 3;
    Stopped stopped = 4;
    NeverStarted never_started = 5;
    rimgovernor.common.v1.Unavailable unavailable = 6;
  }
  optional bool native_tick_boundary = 7;
  optional bool durable_events = 8;
  optional int64 newest_cursor = 9;
  optional string watcher_error = 10;
  optional uint64 force_pause_waiting_ms = 11;
  optional string force_pause_kind = 12;
  optional int64 max_probe_tick_gap = 13;
  optional uint64 probe_count = 14;
  repeated Alert baseline_alerts = 15;
  repeated Injury suppressed_injuries = 16;
  rimgovernor.common.v1.PageInfo evidence_completeness = 17;
  optional ObservedSpeed observed_speed = 18;
  optional bool actual_paused = 19;
  // The launch admits StartRequest.test_acceleration.
  optional bool test_acceleration_available = 20;
  // Wall time the supervisor's own stop/start transitions account for in
  // this game session, on a monotonic clock: paused_ms is the time from
  // each stop to the next start (the open gap included while stopped),
  // running_ms the time each epoch ran. Gaps no controller observed count.
  // Both reset when the loaded game changes.
  optional uint64 paused_ms = 21;
  optional uint64 running_ms = 22;
  // Supervisor probe accounting (#626), cumulative for the loaded game
  // session like paused_ms: wall time the hazard probe (probe_elapsed_ms,
  // probe_total passes) and the fact-change digests (digest_elapsed_ms,
  // digest_total passes) took on the main thread, and the widest tick gap
  // between consecutive probes any epoch of the session saw.
  optional double probe_elapsed_ms = 23;
  optional double digest_elapsed_ms = 24;
  optional uint64 probe_total = 25;
  optional uint64 digest_total = 26;
  optional int64 session_max_probe_tick_gap = 27;
  // Per hazard class: the declared maximum detection gap in ticks and the
  // widest gap observed this session (#626).
  repeated HazardGap hazard_gaps = 28;
}
// One hazard class the supervisor probe covers: its declared detection
// bound in ticks (holds at every speed) and the widest gap observed.
message HazardGap {
  string hazard_class = 1;
  int64 bound_ticks = 2;
  int64 max_tick_gap = 3;
  // The class also has a direct game hook that requests a probe on the
  // next tick; max_tick_gap then measures hook to probe.
  bool hooked = 4;
}
message StatusReply {
  oneof outcome {
    Status status = 1;
    rimgovernor.common.v1.Failure failure = 2;
  }
}
message LongEventPending { optional string detail = 1; }
message AppliedControl { Status status = 1; }
message UncertainControl { Status last_observed = 1; optional string detail = 2; }
// authorizing_owner (rimgovernor.authority.v1.Owner) was removed: with a
// single bot process there is only ever one possible authorizing actor.
message ControlReceipt {
  rimgovernor.common.v1.AttemptKey attempt = 1;
  rimgovernor.common.v1.ObservationContext admitted_context = 2;
  reserved 3;
  reserved "authorizing_owner";
  oneof outcome {
    AppliedControl applied = 4;
    UncertainControl uncertain = 5;
  }
}
// Admission failure has no clock effect. A changed or uncertain clock returns status.
message ControlReply {
  oneof outcome {
    ControlReceipt receipt = 1;
    rimgovernor.common.v1.Failure failure = 2;
    LongEventPending long_event_pending = 3;
  }
}
message AttemptRequest {
  rimgovernor.common.v1.Identity identity = 1;
  rimgovernor.common.v1.AttemptKey attempt = 2;
}
// Missing records never prove that a lost request had no effect.
message AttemptUnknown {}
message AttemptReply {
  oneof outcome {
    ControlReceipt receipt = 1;
    AttemptUnknown unknown = 2;
    rimgovernor.common.v1.Failure failure = 3;
  }
}

message Letter {
  optional string id = 1;
  optional string label = 2;
  optional string def_name = 3;
  optional bool negative = 4;
}
message TransientMessage {
  optional string id = 1;
  optional string type_def = 2;
  optional string text = 3;
  optional int64 starting_tick = 4;
  optional bool negative = 5;
}
message Notification {
  oneof source {
    Letter letter = 1;
    TransientMessage message = 2;
  }
}
message NotificationBatch {
  repeated Letter letters = 1;
  repeated TransientMessage messages = 2;
  rimgovernor.common.v1.PageInfo completeness = 3;
}
message Alert {
  optional string key = 1;
  optional string label = 2;
  optional string priority = 3;
}
message PawnEvent {
  optional string pawn_id = 1;
  optional string name = 2;
  rimgovernor.common.v1.Cell position = 3;
  optional string reason = 4;
}
message Health {
  optional int32 injury_count = 1;
  optional float severity = 2;
  optional float bleed_rate = 3;
  optional float blood_loss = 4;
  optional float summary_health = 5;
}
enum InjurySuppression {
  INJURY_SUPPRESSION_UNSPECIFIED = 0;
  INJURY_SUPPRESSION_NONE = 1;
  INJURY_SUPPRESSION_ACKNOWLEDGED = 2;
  INJURY_SUPPRESSION_COOLDOWN = 3;
}
message Injury {
  PawnEvent pawn = 1;
  Health before = 2;
  Health after = 3;
  optional InjurySuppression suppression = 4;
  optional uint32 cooldown_remaining_ms = 5;
  optional bool new_wound = 6;
}
message HealthThreshold {
  PawnEvent pawn = 1;
  optional float health_at_start = 2;
  optional float health_now = 3;
  optional float min_health_fraction = 4;
  optional float health_drop_fraction = 5;
}
message HostilesCleared {
  repeated PawnEvent downed_hostiles = 1;
  repeated PawnEvent drafted_colonists = 2;
  optional int32 conscious_hostiles_before = 3;
  optional bool across_epoch_restart = 4;
  rimgovernor.common.v1.PageInfo completeness = 5;
}
message BudgetReached {
  optional int64 start_tick = 1;
  optional int64 tick_deadline = 2;
  optional int64 actual_tick = 3;
}
message PauseEvidence {
  optional bool actual_paused = 1;
  optional bool pause_requested = 2;
  optional bool pause_verified = 3;
  repeated string force_pausing_window_ids = 4;
  optional bool long_event_pending = 5;
  Letter letter = 6;
  optional Speed requested_speed = 7;
  optional ObservedSpeed actual_speed = 8;
  DialogPause dialog = 9;
}
message DialogPause { optional int32 window_id = 1; optional string window_type = 2; optional string title = 3; }
// Terminal progress of an armed watched attempt, latched at a tick boundary.
// The outcome mirrors receipts.v1.Progress so the controller reconciles the
// same attempt through receipts_observe_progress and finds agreement.
message OperationOutcome {
  rimgovernor.common.v1.AttemptKey attempt = 1;
  optional int64 latched_tick = 2;
  oneof outcome {
    rimgovernor.receipts.v1.CompletedEffect completed = 3;
    rimgovernor.receipts.v1.UnsuccessfulEffect unsuccessful = 4;
    rimgovernor.receipts.v1.AbsentEffect absent = 5;
    rimgovernor.receipts.v1.UnknownEffect unknown = 6;
  }
}
// The native authority generation moved. Observed with or without an epoch;
// this is the only event whose Event.owner may be absent.
message AuthorityChanged {
  optional uint64 generation = 1;
  optional uint64 previous_generation = 2;
  // NativeControlRevocationReason name, or "acquired".
  optional string reason = 3;
  optional bool active = 4;
}
message WatchLatched {
  OperationOutcome outcome = 1;
  optional int64 tick_deadline = 2;
}
message StopEvent {
  optional StopReason reason = 1;
  oneof evidence {
    NotificationBatch notifications = 2;
    PawnEvent pawn = 3;
    Injury injury = 4;
    HealthThreshold health = 5;
    BudgetReached budget = 6;
    PauseEvidence pause = 7;
    rimgovernor.common.v1.Unavailable unavailable = 8;
    WatchLatched watch = 9;
  }
  // The tick at which the supervisor first raised this stop; the event's
  // context tick is the tick it took (a failed pause retries per frame).
  optional int64 detected_tick = 10;
  // The tick the hazard arose, when the evidence carries one (a new wound's
  // age); absent otherwise.
  optional int64 occurrence_tick = 11;
}
message EpochStarted { Epoch epoch = 1; }
// A group of observation reads that go stale together. Definitions and world
// facts survive a tick advance; the rest are facts of one paused tick.
enum FactFamily {
  FACT_FAMILY_UNSPECIFIED = 0;
  FACT_FAMILY_DEFINITIONS = 1;
  FACT_FAMILY_WORLD = 2;
  FACT_FAMILY_IDENTITY = 3;
  FACT_FAMILY_COLONY = 4;
  FACT_FAMILY_PAWNS = 5;
  FACT_FAMILY_EMERGENCY = 6;
  FACT_FAMILY_ROOMS = 7;
  FACT_FAMILY_RESEARCH = 8;
}
// Native noticed the named fact families change under a running epoch
// without a controller write or a stop (a research project finished, faction
// relations moved, a zone edited): a controller holding cached rows of those
// families discards them. Never empty. When native can attribute the change
// it narrows the discard: entity_ids (<= 64) name the changed rows of the
// families (a zone's ListZones id) and cells is the one rectangle the change
// touched, so a store keeps the rest of each family. Without either the
// whole family is stale.
message ObservationInvalidated {
  repeated FactFamily families = 1;
  optional string reason = 2;
  repeated string entity_ids = 3;
  Rectangle cells = 4;
}
// Inclusive cell bounds, minimum <= maximum on both axes.
message Rectangle { rimgovernor.common.v1.Cell minimum = 1; rimgovernor.common.v1.Cell maximum = 2; }
// The epoch's speed, ceiling or regulator changed; the epoch continues. An
// owner's change carries its new ceiling; a regulator transition carries the
// ceiling it now holds (zero once it releases) and the blind ticks that
// drove it.
message SpeedChanged {
  optional Speed speed = 1;
  optional uint32 max_ticks_per_second = 2;
  optional uint32 regulated_ticks_per_second = 3;
  optional int64 blind_ticks = 4;
}
message PauseFailed { StopEvent pending = 1; }
message ForcePauseWaiting {
  PauseEvidence pause = 1;
  optional uint64 waited_ms = 2;
  optional uint32 grace_ms = 3;
}
message ForcePauseCleared {
  optional uint64 waited_ms = 1;
  optional string force_pause_kind = 2;
  optional bool speed_restored = 3;
}
message Event {
  optional int64 cursor = 1;
  // Absent only for an AuthorityChanged event observed outside any epoch.
  EpochOwner owner = 2;
  rimgovernor.common.v1.ObservationContext context = 3;
  optional int64 observed_at_unix_ms = 4;
  optional string detail = 5;
  oneof event {
    EpochStarted started = 6;
    SpeedChanged speed_changed = 7;
    StopEvent stopped = 8;
    Notification notification = 9;
    Alert alert = 10;
    Injury injury_observed = 11;
    HostilesCleared hostiles_cleared = 12;
    PauseFailed pause_failed = 13;
    ForcePauseWaiting force_pause_waiting = 14;
    ForcePauseCleared force_pause_cleared = 15;
    OperationOutcome operation_outcome = 16;
    AuthorityChanged authority_changed = 17;
    ObservationInvalidated observation_invalidated = 18;
  }
  // How long ago, on native's own clock, this event was observed when the
  // page carrying it was composed: the unobserved time a stop sat in native
  // before this reply, measured without comparing clocks across processes.
  optional uint64 age_at_reply_ms = 19;
}
message EventsRequest {
  rimgovernor.common.v1.Identity identity = 1;
  optional int64 after_cursor = 2;
  optional uint32 limit = 3;
  // Long poll: when no event follows after_cursor, the reader waits up to
  // wait_ms (0..5000) for one before answering. It never waits when a page is
  // already available, and the bound stays well under the call ceiling.
  optional uint32 wait_ms = 4;
}
message EventsPage {
  rimgovernor.common.v1.ObservationContext context = 1;
  repeated Event events = 2;
  optional int64 oldest_cursor = 3;
  optional int64 newest_cursor = 4;
  optional int64 next_cursor = 5;
  optional bool gap = 6;
  optional uint64 lost_count = 7;
}
message EventsReply {
  oneof outcome {
    EventsPage page = 1;
    rimgovernor.common.v1.Failure failure = 2;
  }
}
service Clock {
  rpc ReadStatus(StatusRequest) returns (StatusReply);
  rpc ReadEvents(EventsRequest) returns (EventsReply);
  rpc ReadAttempt(AttemptRequest) returns (AttemptReply);
  rpc Start(StartRequest) returns (ControlReply);
  rpc Pause(OwnedRequest) returns (StatusReply);
  rpc Renew(RenewRequest) returns (ControlReply);
  rpc ChangeSpeed(SpeedRequest) returns (ControlReply);
}
