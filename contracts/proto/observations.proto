enum WasteLocation { WASTE_LOCATION_UNSPECIFIED = 0; WASTE_LOCATION_EXPOSED = 1; WASTE_LOCATION_RELOCATED = 2; WASTE_LOCATION_BURIED = 3; }
message WasteItem { rimgovernor.common.v1.Ref thing = 1; optional int64 count = 2; optional WasteLocation state = 3; rimgovernor.common.v1.Ref zone = 4; rimgovernor.common.v1.Ref grave = 5; optional rimgovernor.common.v1.RotStage rot_stage = 6; optional WasteKind kind = 7; optional bool eligible = 8; optional string protected_reason = 9;
  // A corpse's inner pawn; unset for non-corpses.
  optional rimgovernor.common.v1.CorpseClass corpse_class = 11; }
message WasteSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated WasteItem items = 2; }
