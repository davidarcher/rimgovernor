// BuildingStatus is the native construction stage of a building row.
enum BuildingStatus { BUILDING_STATUS_UNSPECIFIED = 0; BUILDING_STATUS_BLUEPRINT = 1; BUILDING_STATUS_FRAME = 2; BUILDING_STATUS_BUILT = 3; }
// BuildingState is the canonical building row (#1343), built by one native
// builder: only the bundle's building table and the list read carry it;
// every other message points at a building by Ref (#1342), which the
// reader resolves against the table. service and settings.forbidden are set on
// every row.
message BuildingState {
  EntityRef building = 1; optional rimgovernor.placement.v1.Rotation rotation = 2; optional string stuff = 3; rimgovernor.common.v1.Ref faction = 4;
  optional BuildingStatus status = 5; optional string build_def_name = 6; optional string install_of_def_name = 7;
  optional int32 hit_points = 8; optional int32 max_hit_points = 9;
  ConstructionState construction = 11; BuildingServiceState service = 12; BuildingSettings settings = 13;
  repeated ThermalSide thermal_sides = 14; BillStack bills = 15; optional string inspect_text = 16;
  optional bool burning = 17; optional bool uses_hit_points = 18; repeated ReadIssue issues = 19;
  SnapshotRef snapshot = 20;
  // The building's occupied rect, inclusive (#1346).
  Rectangle occupied = 22;
  // Odyssey hack and portal facts (#1708); absent on a building with neither.
  OdysseyBuilding odyssey = 23;
  // Anomaly containment and study facts (#1737); absent without Anomaly or on
  // a building with neither.
  AnomalyBuilding anomaly = 24;
}
message PowerNetwork {
  optional string id = 1; optional uint32 producers = 2; optional uint32 consumers = 3; optional uint32 batteries = 4;
  optional uint32 transmitters = 5; optional uint32 connectors = 6; optional double generation_w = 7; optional double consumption_w = 8;
  optional double net_w = 9; optional double stored_watt_days = 10; optional double capacity_watt_days = 11;
  optional bool has_source = 12; optional bool has_active_source = 13; repeated string flags = 14;
  repeated string member_ids = 15;
}
message BuildingsSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated BuildingState buildings = 2; repeated PowerNetwork power_networks = 3; Completeness completeness = 4;
  // Row ids removed since the base table, in a delta section (SectionWatermark.delta, #1348).
  repeated string removed = 10; }
message ListBuildingsRequest { ReadScope scope = 1; repeated string ids = 2; repeated string def_names = 3; repeated string statuses = 4; optional string category = 5; optional bool player_only = 6; optional double damaged_below_fraction = 7; Rectangle region = 8; optional bool inspect = 9; optional bool bill_ingredients = 10; }
message ListBuildingsReply { oneof outcome { BuildingsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message RoomStat { optional string def_name = 1; optional double value = 2; optional string display = 3; optional string unit = 4; optional string cost = 5; rimgovernor.common.v1.Unavailable unavailable = 6; }
message RoomBedMembership { rimgovernor.common.v1.Ref building = 5; repeated rimgovernor.common.v1.Ref owners = 2; repeated rimgovernor.common.v1.Ref users = 3; repeated rimgovernor.common.v1.Ref accessible_to = 4; }
message StockpileMembership { rimgovernor.common.v1.Ref zone = 1; repeated ResourceStock contents = 2; }
message RoomState {
  optional string id = 1; optional string role = 2; optional string label = 3; optional bool proper_room = 4; optional bool doorway = 5;
  optional bool outdoors = 6; optional bool psychologically_outdoors = 7; optional bool touches_map_edge = 8; optional bool fogged = 9;
  optional double temperature_c = 10; optional uint32 open_roof_count = 11; optional uint32 cell_count = 12;
  Rectangle extents = 13; rimgovernor.common.v1.Cell center = 14;
  repeated RoomStat stats = 17; repeated rimgovernor.common.v1.Ref pawns = 18;
  repeated rimgovernor.common.v1.Ref beds = 28; repeated rimgovernor.common.v1.Ref stockpile_zones = 20; repeated Quantity contents = 21;
  repeated ReadIssue issues = 23;
  SnapshotRef snapshot = 24; repeated RoomBedMembership bed_memberships = 25; repeated StockpileMembership stockpile_memberships = 26;
  repeated RoomDoor doors = 27; // Doors in the room's boundary: door cell, the cell it opens onto, and whether that side is outdoors.
  // The room's key in the whole-map cell grid (CellGrid.room, #1346): the
  // row-major map index of its first unfogged cell; its cells are the grid
  // cells carrying it. Absent when every cell is fogged.
  optional string grid_room = 29;
}
message RoomDoor { rimgovernor.common.v1.Cell cell = 1; rimgovernor.common.v1.Cell outside = 2; optional bool outdoors = 3; }
message RoomsSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated RoomState rooms = 2; Completeness completeness = 3; }
message ListRoomsRequest { ReadScope scope = 1; Rectangle region = 2; optional bool include_outdoors = 3; optional bool include_boundary = 4; repeated string room_ids = 6; }
message ListRoomsReply { oneof outcome { RoomsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message ZoneState {
  optional string id = 2; optional string label = 3; optional string type = 4; Rectangle bounds = 5;
  optional string priority = 6; optional string crop_def_name = 7; optional bool explicitly_set_crop = 8;
  optional bool allow_sow = 9; optional bool allow_cut = 10; StockpileFilter filter = 11;
  optional uint32 slot_group_cells = 14; optional uint32 haul_grid_cells = 15; optional bool consistent = 16;
  optional bool contiguous = 17; repeated Quantity contents = 19;
  optional uint32 free_cells = 20; optional uint32 blocked_cells = 21; optional uint32 impassable_cells = 22;
  optional uint32 crop_plants_in_listed_cells = 23; optional uint32 crop_plants_in_grid_cells = 24;
  repeated ReadIssue issues = 27;
  FarmFacts farm = 28; optional bool food_storage = 29;
}
message ZonesSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated ZoneState zones = 2; Completeness completeness = 3; }
message ListZonesRequest { ReadScope scope = 1; repeated string ids = 2; optional string name_contains = 3; Rectangle region = 4; optional bool include_contents = 6; optional bool include_filter = 7; }
message ListZonesReply { oneof outcome { ZonesSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// A thing's canonical row (#1343), from one native builder: the cells
// read's things and the bundle's things table. thing.snapshot is the
// thing's own CAS token. The food facts (15-23) are set for an ingestible
// item or a corpse: rot_ticks at the current ambient temperature (present
// exactly while the thing rots), temperature_c that ambient temperature,
// roofed and room_id where a spawned thing stands, is_human_meat when the
// thing or any ingredient it was made from (CompIngredients) is humanlike meat;
// a corpse adds forbidden, its meat yield (meat_amount), body size and a
// one-cell footprint. What the def alone says (class, vegetable, raw meat and
// raw ingredient class, a corpse's humanlike race) is the definition catalog's
// (#1733).
message Thing { EntityRef thing = 1; optional int64 stack_count = 3; optional string stuff = 4; optional int32 hit_points = 5; optional bool forbidden = 6; repeated rimgovernor.common.v1.Ref owners = 7; optional bool medical = 8; optional double growth = 9; optional bool harvestable_now = 10; optional string build_def_name = 11; optional bool blueprint = 12; optional bool frame = 13;
  optional int64 rot_ticks = 15; optional double temperature_c = 16; optional bool roofed = 17; rimgovernor.common.v1.Ref room = 18;
  optional bool corpse = 19; optional double meat_amount = 20; optional double body_size = 21; optional int64 tile_footprint = 22;
  optional bool is_human_meat = 23;
  // The thing's own CAS token (#1342).
  SnapshotRef snapshot = 28; }
message ThingsSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated Thing things = 2;
  // Row ids removed since the base table, in a delta section (SectionWatermark.delta, #1348).
  repeated string removed = 3; }
// One observations_get_cells read (#1346): the map's dimensions and the
// requested rectangle as a CellGrid keyframe (mirror.proto's arrays and
// sentinels: a fogged cell is not held; glow is artificial light only).
// room keys a native room by the whole-map row-major index of its first
// held cell inside the read. foundation, when requested, is one byte per
// grid cell (row-major, 0 on a cell the grid does not hold): bit 0
// supports_heavy (the terrain takes a wall), bit 1 supports_light, bit 2
// resource_rock (mineable ore), bit 3 tree, bit 4 bridgeable, bit 5 dries
// (a moisture pump dries it), each of the natural ground
// under any bridge or floor; bit 6 hazard (the terrain now at the cell hurts
// or contaminates by its own def flags, lava). things, when requested, are the canonical rows (#1343)
// of the things standing on the grid's held cells, each once, in id
// order, at its own thing.position.
message CellsSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1; MapSize map_size = 2;
  rimgovernor.mirror.v1.CellGrid grid = 11; bytes foundation = 12; repeated Thing things = 13;
}
// GetCellsRequest reads the inclusive rectangle, on the map, of at most
// 1048576 cells.
message GetCellsRequest {
  ReadScope scope = 1; Rectangle rectangle = 2; optional bool foundation = 8; optional bool things = 9;
}
message GetCellsReply { oneof outcome { CellsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message ResearchUnlock { optional string def_name = 1; optional string native_type = 2; optional string label = 3; }
// TechLevel is the vanilla TechLevel.
enum TechLevel { TECH_LEVEL_UNSPECIFIED = 0; TECH_LEVEL_UNDEFINED = 1; TECH_LEVEL_ANIMAL = 2; TECH_LEVEL_NEOLITHIC = 3; TECH_LEVEL_MEDIEVAL = 4; TECH_LEVEL_INDUSTRIAL = 5; TECH_LEVEL_SPACER = 6; TECH_LEVEL_ULTRA = 7; TECH_LEVEL_ARCHOTECH = 8; }
message ResearchProject {
  DefinitionRef project = 1; optional string tab = 2; optional string category = 3; optional TechLevel tech_level = 4;
  optional double base_cost = 5; optional double apparent_cost = 6; optional double cost_factor = 7; optional double progress = 8;
  optional double progress_fraction = 9; optional bool finished = 10; optional bool current = 11; optional bool available = 12;
  optional bool can_start = 13; repeated string prerequisites = 14; repeated string hidden_prerequisites = 15;
  optional uint32 techprints_applied = 16; optional uint32 techprints_needed = 17; optional string required_building = 18;
  repeated string required_facilities = 19; repeated string lock_reasons = 20; optional string lock_detail = 21;
  repeated ResearchUnlock unlocks = 22; repeated ReadIssue issues = 24;
}
message Researcher { rimgovernor.common.v1.Ref pawn = 1; optional double intellectual = 2; optional int32 priority = 3; optional bool disabled = 4; optional bool ever_work = 5; optional bool active = 6; }
message ResearchFacility { DefinitionRef definition = 1; optional bool active = 2; }
message ResearchBench { rimgovernor.common.v1.Ref building = 4; repeated ResearchFacility facilities = 2; repeated ReadIssue issues = 3; }
message ResearchSlot { optional string category = 1; optional string current_project = 2; }
// finished names every finished project, whatever the request filters.
message ResearchSnapshot { rimgovernor.common.v1.ObservationContext context = 1; SnapshotRef snapshot = 2; repeated ResearchSlot slots = 3; repeated ResearchProject projects = 4; repeated ResearchBench benches = 5; repeated Researcher researchers = 6; optional bool anomaly_active = 7; optional string player_tech_level = 8; Completeness completeness = 9; repeated string finished = 10; }
// progress_only (#1340) lists only the current projects, with their lock
// reasons, and the started unfinished ones, each without the static fields
// the definition catalog carries (costs, prerequisites, tab, tech level,
// required bench); the other filters are ignored.
message ResearchRequest { ReadScope scope = 1; optional bool include_locked = 2; optional bool include_finished = 3; optional bool include_unlocks = 4; optional bool include_capability = 5; optional string name_contains = 6; optional bool progress_only = 8; }
message ResearchReply { oneof outcome { ResearchSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }

message AccessTarget { rimgovernor.common.v1.Cell cell = 1; optional bool native_reachable = 2; optional bool projected_reachable = 3; optional uint32 projected_steps = 4; }
message PawnAccess { rimgovernor.common.v1.Ref pawn = 1; optional uint32 current_cells = 2; optional uint32 projected_cells = 3; repeated AccessTarget targets = 6; rimgovernor.common.v1.Cell projected_origin = 7; optional uint32 egress_steps = 8; optional bool loses_access = 10;
  // The pawn's cell when the access was read (#1342).
  rimgovernor.common.v1.Cell position = 11; }
message SpatialAccessSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated PawnAccess pawns = 2; optional uint32 map_cells = 3; optional uint32 observed_walkable_cells = 4; }
message SpatialAccessRequest { ReadScope scope = 1; repeated rimgovernor.common.v1.Cell blocked_cells = 2; repeated rimgovernor.common.v1.Cell target_cells = 3; repeated string pawn_ids = 4; }
message SpatialAccessReply { oneof outcome { SpatialAccessSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Defense site census: bounded terrain, cover and raider-approach facts for
// layout planning. cover_fill is the native edifice/cover fillPercent the
// shooting model uses (0 when open); edge_reachable is native ground
// reachability from the cell to any map edge without opening doors, the
// ordinary walk-in raid approach. Every cell of the requested rectangle.
message DefenseCell {
  rimgovernor.common.v1.Cell cell = 1; optional bool fogged = 2; optional bool walkable = 3; optional bool passable = 4;
  optional double cover_fill = 5; optional bool blocks_sight = 6; optional string edifice_def_name = 7; optional bool player_owned = 8;
  optional bool natural_rock = 9; optional bool edge_reachable = 10; optional bool home_area = 11; optional string terrain = 12;
  optional bool door = 13; repeated ReadIssue issues = 14;
  // The thing whose fillPercent cover_fill reports (GetCover, else the
  // edifice), with the clearance designation ordinary work would need.
  // Absent when the cell is open.
  optional string cover_thing_id = 15; optional string cover_def_name = 16; optional CoverKind cover_kind = 17;
  optional bool cover_designated = 19;
  // The cell's foundation (a Bridge) is designated for removal (#954).
  optional bool foundation_removal_designated = 20;
  // The edifice's stuff def (WoodLog, Plasteel), absent for a stuffless one (#1065).
  optional string edifice_stuff_def_name = 21;
  // The cell is under any roof (#1122: a burn-out's seal holds its heat).
  optional bool roofed = 22;
}
// How the game's own designators would remove a cover thing.
enum CoverKind { COVER_KIND_UNSPECIFIED = 0; COVER_KIND_PLANT = 1; COVER_KIND_CHUNK = 2; COVER_KIND_MINEABLE = 3; COVER_KIND_BUILDING = 4; }
// One hostile lord observed on the map since load: where its first pawn was
// seen (ground when on the map edge), and a bounded trail of one of its
// pawns sampled every RaidTrack.SampleInterval ticks, so a census can find
// where the raid crossed its boundary. Session-scoped, like traffic.
message RaidTrack {
  optional string lord_id = 1; optional string faction_def = 2; optional int64 spawn_tick = 3; rimgovernor.common.v1.Cell spawn = 4;
  optional bool ground = 5; repeated rimgovernor.common.v1.Cell trail = 6; optional int64 last_tick = 7;
}
// cover_threshold is the lowest positive fillPercent among loaded defs: the
// floor below which nothing on the map gives CoverUtility a block chance.
message DefenseSiteSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1; MapSize map_size = 2; Rectangle region = 3; repeated DefenseCell cells = 4;
  optional double cover_threshold = 6; repeated RaidTrack raids = 7;
}
message DefenseSiteRequest { ReadScope scope = 1; Rectangle region = 2; }
message DefenseSiteReply { oneof outcome { DefenseSiteSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Lines of fire: native GenSight line of sight and CoverUtility overall block
// chance for every (firing, approach) pair. target_cover is the chance a
// target at `to` is protected from a shooter at `from`; shooter_cover is the
// reverse. At most 64 firing and 64 approach cells (4096 pairs) per read.
message LineOfFire { rimgovernor.common.v1.Cell from = 1; rimgovernor.common.v1.Cell to = 2; optional bool line_of_sight = 3; optional double target_cover = 4; optional double shooter_cover = 5; optional double distance = 6; repeated ReadIssue issues = 7; }
message LinesOfFireSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated LineOfFire lines = 2; }
message LinesOfFireRequest { ReadScope scope = 1; repeated rimgovernor.common.v1.Cell firing_cells = 2; repeated rimgovernor.common.v1.Cell approach_cells = 3; }
message LinesOfFireReply { oneof outcome { LinesOfFireSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message RoofSupportCell { rimgovernor.common.v1.Cell cell = 1; optional string roof_def_name = 2; optional bool supported_without_target = 3; optional string blocker = 4; }
message RoofSupportSnapshot { rimgovernor.common.v1.ObservationContext context = 1; rimgovernor.common.v1.Ref target = 2; repeated RoofSupportCell roofs = 3; }
message RoofSupportRequest { ReadScope scope = 1; optional string target_id = 2; }
message RoofSupportReply { oneof outcome { RoofSupportSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Excavation reads certify a requested set of rock cells for staged room/corridor
// excavation. Unlike surface mining, roofed cells are admissible; support is a
// counterfactual check that every remaining roof stays within the native support
// radius of a holder after all requested cells are removed. Fogged cells are unknown.
enum ExcavationSupport { EXCAVATION_SUPPORT_UNSPECIFIED = 0; EXCAVATION_SUPPORT_SUPPORTED = 1; EXCAVATION_SUPPORT_UNKNOWN = 2; EXCAVATION_SUPPORT_UNSUPPORTED = 3; }
message ExcavationCell {
  rimgovernor.common.v1.Cell cell = 1; optional bool fogged = 2; optional string mineable_def_name = 3; optional string mineable_id = 4;
  optional int32 hit_points = 5; optional string roof_def_name = 6; optional bool holds_roof = 7; optional bool walkable = 8;
  optional bool mine_designated = 9; optional bool eligible = 10; optional string blocker = 11;
}
message ExcavationSiteSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1; repeated ExcavationCell cells = 2;
  ExcavationSupport support_after_removal = 3; optional uint32 roof_cells_checked = 4; optional string support_blocker = 5;
  optional bool collapse_pending = 6; optional bool worker_available = 7; repeated string worker_ids = 8;
  optional bool access_reachable = 9;
}
message ExcavationSiteRequest { ReadScope scope = 1; repeated rimgovernor.common.v1.Cell cells = 2; rimgovernor.common.v1.Cell access_cell = 3; }
message ExcavationSiteReply { oneof outcome { ExcavationSiteSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Plant cut census (#1547): for up to 1024 exact cells, the undesignated
// non-crop plants still standing, the plants AreaPlantCutIntent would
// designate. chop_wood marks a harvestable tree (chop-wood). Fogged and
// out-of-bounds cells report nothing.
message PlantCutCensusRequest { ReadScope scope = 1; repeated rimgovernor.common.v1.Cell cells = 2; }
message PlantCutTarget { rimgovernor.common.v1.Ref plant = 1; optional bool chop_wood = 2; rimgovernor.common.v1.Cell cell = 3; }
message PlantCutCensusSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated PlantCutTarget plants = 2; }
message PlantCutCensusReply { oneof outcome { PlantCutCensusSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// One material a stuffed definition may be built from, with the native cost
// list for that material.
message StuffOption { optional string stuff = 1; repeated Quantity costs = 2; }
message WallUpgradeSite {
  rimgovernor.common.v1.Ref target = 1; optional bool target_present = 2;
  repeated rimgovernor.common.v1.Cell backup_cells = 4; repeated Quantity costs = 5;
  repeated ResourceStock materials = 6; repeated rimgovernor.common.v1.Ref workers = 7; optional string blocker = 8;
  optional bool designated = 9; optional string removal_id = 10; optional int64 completed_tick = 11;
  SnapshotRef snapshot = 12; rimgovernor.common.v1.Cell normal = 13;
  rimgovernor.common.v1.Ref original = 22; rimgovernor.common.v1.Ref left_support = 23; rimgovernor.common.v1.Ref right_support = 24;
  repeated rimgovernor.common.v1.Ref completed_backups = 25; rimgovernor.common.v1.Ref replacement = 26;
  // The target's CAS token for the upgrade's guarded operations (#1342).
  SnapshotRef target_snapshot = 27;
  repeated StuffOption replacement_materials = 19;
  CellsSnapshot geometry = 20; RoofSupportSnapshot roof_support = 21;
}
