  optional double target_temperature_c = 9; optional bool medical = 10; optional bool for_prisoners = 11;
  repeated rimgovernor.common.v1.Ref assigned_pawns = 13; optional uint32 maximum_assigned_pawns = 14; repeated rimgovernor.common.v1.Ref assigning_candidates = 15;
  optional bool room_can_be_prison_cell = 16; repeated ReadIssue issues = 17;
  // crop_def_name is a plant grower's current crop beside its own CAS snapshot (BuildingPatchIntent.plant_def).
