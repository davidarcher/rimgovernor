// pawn refers to the bundle pawn table row (#1343); its snapshot is the
// prisoner custody and interaction settings token.
message PopulationPerson { reserved 1; rimgovernor.common.v1.Ref pawn = 24; SnapshotRef pawn_snapshot = 25; optional bool admitted = 2; optional bool guest = 3; optional bool recruitable = 4; optional double resistance = 5; optional string interaction = 6; reserved 7; rimgovernor.common.v1.Ref owned_bed = 23; optional double nutrition_per_day = 8; optional int64 prisoner_ticks = 9;
  // Prisoner prospect facts MaintainPopulation judges a prisoner's use by
  // (#1036): Pawn_GuestTracker.will (Ideology), the pawn's ideoligion load
  // id, Verse.WildManUtility.IsWildMan, and, for prisoners and free
  // colonists, the skill/trait/age biography and SummaryHealthPercent.
  optional double will = 10; optional string ideo_id = 11; optional bool wild_man = 12;
  PawnBiography biography = 13; optional double health_summary = 14;
  // After combat (#1079), for a hostile: a LuciferiumAddiction hediff (not
  // worth capturing: stripped and finished instead) and any worn apparel
  // (every downed raider is stripped before it is captured).
  optional bool luciferium_addicted = 15; optional bool wearing_apparel = 16;
  // Organ harvest facts (#1169), for a prisoner of the colony only: its
  // surgery facts (missing_parts, operations and surgery_bills filled as on
  // the pawn care read, other PawnHealth fields absent), its faction's load
  // id, and the goodwill change vanilla's Recipe_RemoveBodyPart violation
  // report (-70) would make with it after CalculateAdjustedGoodwillChange and
  // the -100 floor; 0 when the faction's goodwill cannot change or none.
  PawnHealth surgery = 17; rimgovernor.common.v1.Ref faction = 18; optional int32 harvest_goodwill_change = 19;
  // The MedicalCareCategory name (#1239), for a colony prisoner or a guest
  // of the colony (#1301).
  optional rimgovernor.operations.v1.MedicalCare medical_care = 20;
  // Peg-leg control (#1236), for a prisoner of the colony only: it carries a
  // drug addiction (Hediff_Addiction). A prisoner gets no drugs, so an
  // addiction is withdrawal now or soon, until the addiction clears.
  optional bool withdrawal = 21;
  // Medical care cap inputs (#1301), for a colony prisoner or guest: life
  // threat, every hediff (definition, severity, immunity and their rates)
  // and the completeness; other PawnHealth fields absent.
  PawnHealth conditions = 22; }
message PopulationSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated PopulationPerson persons = 2; repeated DefinitionRef supported_interactions = 3; reserved 4;
  // ModsConfig.IdeologyActive, IdeoManager.classicMode, the player faction's
  // primary ideoligion load id and the defName of its Slavery-issue precept
  // (Slavery_Abhorrent .. Slavery_Honorable); absent without Ideology.
  optional bool ideology_active = 5; optional bool classic_ideo_mode = 6; optional string colony_ideo_id = 7; optional string slavery_precept = 8;
  // Storyteller population outlook (#1031): StorytellerUtilityPopulation intent and
  // adjusted population, and the capture odds that intent sets for a non-colony
  // humanlike downed by violence (death chance) and for a new prisoner (unrecruitable).
  optional double population_intent = 9; optional double adjusted_population = 10;
  optional double death_on_downed_chance = 11; optional double unrecruitable_chance = 12;
  // The defName of the player ideoligion's OrganUse-issue precept (#1169):
  // OrganUse_Classic without the Ideology DLC or in classic mode.
  optional string organ_use_precept = 13;
  // Owned-pawn names (#1310): every living named pawn the colony owns --
  // player-faction colonists, slaves and animals, and colony prisoners --
  // on any map, caravan or transporter; unnamed animals are absent.
  repeated OwnedName owned_names = 14; }
