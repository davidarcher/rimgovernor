// One steam geyser on the map: geyser is the Building_SteamGeyser with its
// anchor position, cells its 2x2 footprint, and occupied whether a harvester
// (a geothermal generator, built or under construction) or any other
// building already stands on it.
message SteamGeyser { EntityRef geyser = 1; repeated rimgovernor.common.v1.Cell cells = 2; optional bool occupied = 3; }
message DevelopmentFacts { repeated DevelopmentPower power = 1; repeated DevelopmentFurniture furniture = 2; ResearchSnapshot research = 3; Completeness completeness = 4; repeated PowerNetwork networks = 5; optional int64 short_circuit_tick = 6; repeated SteamGeyser geysers = 7; }
message EnvironmentCondition { optional string id = 1; optional string def_name = 2; optional string implementation = 3; optional string label = 4; optional bool permanent = 5; optional int64 ticks_left = 6; }
// FoodClimate is the map tile's calendar for food planning: growing_days is
// the tile's growing period per 60-day year, growing_days_remaining the days
// until the seasonal temperature next leaves the crop growth range (60 while
// it never does), growing_days_until the days until it next re-enters it (0
// while crops grow now, 60 when the tile never grows), and non_growing_days
// the length of the current or coming non-growing stretch on the same daily
// walk (first out-of-range day to re-entry: 0 while it never leaves, 60 when
// it never grows; equal to growing_days_until while crops do not grow).
// season is the native Season name at the tile and day_of_year the 0-based
// day of the 60-day year.
message FoodClimate { optional double growing_days = 1; optional double growing_days_remaining = 2; repeated ReadIssue issues = 3; optional bool sowing_now = 4; optional double growing_days_until = 5; optional string season = 6; optional int32 day_of_year = 7; optional double non_growing_days = 8; }
message FarmFacts { optional string zone_id = 1; optional string crop = 2; optional uint32 usable_cells = 3; optional uint32 planted_cells = 4; optional uint32 growing_cells = 5; optional bool edible_crop = 6; optional double harvest_lower_bound_days = 7; optional double nutrition_per_harvest_cell = 8; optional bool sowing_now = 9; }
message PlanningDefinition { DefinitionRef definition = 1; optional string stuff = 2; optional bool available = 3; repeated string research_prerequisites = 4; optional int32 construction_skill = 5; MapSize size = 6; repeated Quantity costs = 7; optional double rest_effectiveness = 8; optional double grow_days = 9; optional double fertility_min = 10; optional double fertility_sensitivity = 11; optional double harvest_nutrition = 12; optional double nutrition_demand_per_day = 13; optional bool edible = 14; repeated ReadIssue issues = 15; repeated string sow_tags = 16; optional double grow_min_glow = 17; optional double power_w = 18; /* native base draw: positive consumes, negative generates */ optional double grower_fertility = 19; optional string sow_tag = 20; optional double glow_radius = 21; optional bool needs_power = 22;
  // Floor (TerrainDef) facts: set only when the definition is a terrain. The
  // stats are the native abstract stat values a laid floor would carry.
  optional bool terrain = 23; optional double cleanliness = 24; optional int32 path_cost = 25; optional double beauty = 26; optional double flammability = 27;
  optional double harvest_work = 28;
  optional bool raw_preferred = 29; // Edible raw without the native bad-taste thought.
  optional bool diet_allowed = 30; // No colonist ideology penalises this crop product.
  optional bool requires_pollution = 31; optional bool requires_clean_soil = 32;
}
// Controlled-environment growing facts within the planning region: sun lamps
// with the exact cells they grow, plant growers (hydroponics) with their
// fertility and sow tag, roofed rooms with temperature, and per-network
// power headroom split by source so night and outage margins are computable.
message GrowLight { EntityRef building = 1; optional string room_id = 2; optional bool powered = 3; optional double power_w = 4; repeated rimgovernor.common.v1.Cell growth_cells = 5; optional bool lit_now = 6; optional string power_net_id = 7; repeated ReadIssue issues = 8; }
message PlantGrower { EntityRef building = 1; optional string room_id = 2; optional bool powered = 3; optional double power_w = 4; optional double fertility = 5; repeated rimgovernor.common.v1.Cell plant_cells = 6; optional string sow_tag = 7; optional string crop_def_name = 8; optional bool can_sow = 9; optional string power_net_id = 10; repeated ReadIssue issues = 11; }
message GrowRoom { optional string room_id = 1; optional double temperature_c = 2; optional uint32 cell_count = 3; optional uint32 open_roof_count = 4; optional bool proper_room = 5; optional bool psychologically_outdoors = 6; optional uint32 lit_cells = 7; }
message PowerHeadroom { optional string id = 1; optional double generation_w = 2; optional double solar_w = 3; optional double wind_w = 4; optional double consumption_w = 5; optional double stored_watt_days = 6; optional double capacity_watt_days = 7; optional bool has_active_source = 8; }
message ControlledEnvironment { repeated GrowLight lights = 1; repeated PlantGrower growers = 2; repeated GrowRoom rooms = 3; repeated PowerHeadroom networks = 4; optional double outdoor_temperature_c = 5; optional bool daylight = 6; Completeness completeness = 7; repeated ReadIssue issues = 8; }
message PlanningFacts { repeated PlanningDefinition definitions = 1; CellsSnapshot cells = 2; GearSnapshot gear = 3; Completeness completeness = 4; repeated ReadIssue issues = 5; SnapshotRef zone_map_snapshot = 6; ControlledEnvironment environment = 7; }
message FoodProduct { optional string def_name = 1; optional int64 count = 2; optional bool edible = 3; optional double nutrition = 4; optional double nutrition_demand_per_day = 5; optional double rot_days = 6; optional bool perishable = 7; }
message FoodProduction { optional string recipe = 1; optional bool available = 2; repeated FoodProduct products = 3; }
message CookingFacts { EntityRef bench = 1; optional bool usable = 2; repeated RecipeState recipes = 3; repeated BillState bills = 4; repeated FoodProduction production = 5; optional string room_id = 6; }
// A blighted plant standing in a player growing zone or on home ground: the
// crop-blight census RemoveBlight cuts from. Nearest the colony first, at
// most 64 rows; plant.snapshot is the CutPlant designation's CAS token.
// zone_id is the growing zone the plant stands in, absent on home ground.
// designated: a CutPlant or HarvestPlant designation already exists.
message BlightedPlant { EntityRef plant = 1; optional string zone_id = 2; optional bool designated = 3; optional double growth = 4; }
message AcquisitionFacts { EntityRef source = 1; optional string resource = 2; optional bool tree = 3; optional bool food = 4; optional double yield = 5; optional double nutrition_yield = 6; optional bool designated = 7; optional bool hunt = 8; optional double revenge_chance = 9; optional uint32 herd_size = 10; optional bool melee_only = 11; optional bool downed = 12; optional double weapon_range = 13; }
message ButcheringFacts { EntityRef bench = 1; repeated BillState bills = 2; optional bool usable = 3; repeated RecipeState recipes = 4; optional string room_id = 5; repeated HumanButcherCandidate human_butchers = 6; optional double human_corpse_nutrition = 7; repeated rimgovernor.common.v1.Cell human_storage_cells = 8; optional bool human_storage_ready = 9; optional string human_corpse_def = 10; }
message HumanButcherCandidate { string pawn_id = 1; repeated string traits = 2; optional bool precept_acceptable = 3; optional bool can_work = 4; }
message FoodCorpse { CorpseState corpse = 1; optional bool fresh = 2; optional bool reachable = 3; optional string meat_def = 4; optional double nutrition_yield = 5; }
message ColonyNaming { optional int32 window_id = 1; optional string faction_name = 2; optional string settlement_name = 3; repeated ReadIssue issues = 4; }
// One force-pausing Verse.Dialog_NodeTree the game opened by itself (an
// incident's caravan demand/meeting, a quest dialog, a finished research
// project's completion dialog). Options are the current node's DiaOptions in
// native order; index is the exact native list position AnswerDialog names.
// selectable is false for a disabled option, for a hyperlink row (never
// closes the dialog) and for an option that neither closes the tree nor links
// to a further node: its action opens another window the controller does not
// drive (CaravanMeeting's Trade opening Dialog_Trade). resolves reports
// whether the option closes the tree (DiaOption.resolveTree) rather than
// moving to a linked node. keys are the language-neutral Keyed translation
// keys whose active- or English-language text produces the label, sorted;
// empty for a label no keyed entry yields (a mod's literal text, a quest's
// composed choice).
message ChoiceDialogOption { optional int32 index = 1; optional string label = 2; optional bool selectable = 3; optional bool resolves = 4; optional string disabled_reason = 5; repeated string keys = 6; }
message ChoiceDialog { optional int32 window_id = 1; optional string window_type = 2; optional string title = 3; optional string text = 4; repeated ChoiceDialogOption options = 5; optional bool interactive = 6; }

