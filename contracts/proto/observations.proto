message RecoverySnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated RecoveryRestriction restrictions = 4; repeated rimgovernor.common.v1.Ref buildings = 7; }
message RecoveryRequest { ReadScope scope = 1; }
message RecoveryReply { oneof outcome { RecoverySnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// pawn refers to the bundle pawn table row (#1343); its snapshot is the
// prisoner custody and interaction settings token.
message PopulationPerson { rimgovernor.common.v1.Ref pawn = 24; SnapshotRef pawn_snapshot = 25; optional bool admitted = 2; optional bool guest = 3; optional bool recruitable = 4; optional double resistance = 5; optional string interaction = 6; rimgovernor.common.v1.Ref owned_bed = 23; optional double nutrition_per_day = 8; optional int64 prisoner_ticks = 9;
  // Prisoner prospect facts MaintainPopulation judges a prisoner's use by
  // (#1036): Pawn_GuestTracker.will (Ideology), the pawn's ideoligion load
  // id, Verse.WildManUtility.IsWildMan, and, for prisoners and free
  // colonists, the skill/trait/age biography and SummaryHealthPercent.
  optional double will = 10; optional string ideo_id = 11; optional bool wild_man = 12;
  PawnBiography biography = 13; optional double health_summary = 14;
  // After combat (#1079), for a hostile: a LuciferiumAddiction hediff (not
  // worth capturing: stripped and finished instead) and any worn apparel
  // (every downed raider is stripped before it is captured).
  optional bool luciferium_addicted = 15; optional bool wearing_apparel = 16;
  // Organ harvest facts (#1169), for a prisoner of the colony only: its
  // surgery facts (missing_parts, operations and surgery_bills filled as on
  // the pawn care read, other PawnHealth fields absent), its faction's load
  // id, and the goodwill change vanilla's Recipe_RemoveBodyPart violation
  // report (-70) would make with it after CalculateAdjustedGoodwillChange and
  // the -100 floor; 0 when the faction's goodwill cannot change or none.
  PawnHealth surgery = 17; rimgovernor.common.v1.Ref faction = 18; optional int32 harvest_goodwill_change = 19;
  // The MedicalCareCategory name (#1239), for a colony prisoner or a guest
  // of the colony (#1301).
  optional rimgovernor.operations.v1.MedicalCare medical_care = 20;
  // Peg-leg control (#1236), for a prisoner of the colony only: it carries a
  // drug addiction (Hediff_Addiction). A prisoner gets no drugs, so an
  // addiction is withdrawal now or soon, until the addiction clears.
  optional bool withdrawal = 21;
  // Medical care cap inputs (#1301), for a colony prisoner or guest: life
  // threat, every hediff (definition, severity, immunity and their rates)
  // and the completeness; other PawnHealth fields absent.
  PawnHealth conditions = 22;
  // Policy inputs (#1554), for a prisoner of the colony only: its current
  // drug policy id and chemical state, as on the work census settings row.
  PawnPolicyInputs policy_inputs = 26; }
message PopulationSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated PopulationPerson persons = 2; repeated DefinitionRef supported_interactions = 3;
  // ModsConfig.IdeologyActive, IdeoManager.classicMode, the player faction's
  // primary ideoligion load id;
  // absent without Ideology; precepts ride the ideology section.
  optional bool ideology_active = 5; optional bool classic_ideo_mode = 6; optional string colony_ideo_id = 7;
  // Storyteller population outlook (#1031): StorytellerUtilityPopulation intent and
  // adjusted population, and the capture odds that intent sets for a non-colony
  // humanlike downed by violence (death chance) and for a new prisoner (unrecruitable).
  optional double population_intent = 9; optional double adjusted_population = 10;
  optional double death_on_downed_chance = 11; optional double unrecruitable_chance = 12;
  // (Organ-use precepts ride the ideology section.)
  // Owned-pawn names (#1310): every living named pawn the colony owns --
  // player-faction colonists, slaves and animals, and colony prisoners --
  // on any map, caravan or transporter; unnamed animals are absent.
  repeated OwnedName owned_names = 14; }
// One owned pawn's short name (Name.ToStringShort) and thingIDNumber, which
// orders pawns by creation: the higher number is the newer pawn.
message OwnedName { optional string pawn_id = 1; optional string short_name = 2; optional int32 thing_id = 3; }
message PopulationRequest { ReadScope scope = 1; }
message PopulationReply { oneof outcome { PopulationSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message Settlement { optional string id = 1; optional string label = 2; rimgovernor.common.v1.Ref faction = 3; optional string faction_def_name = 4; optional string relation = 5; optional int32 goodwill = 6; optional int32 tile = 7; optional double distance_tiles = 8; optional bool player = 9; SnapshotRef snapshot = 10; SnapshotRef faction_snapshot = 11; }
message WorldTile {
  optional int32 tile = 1; DefinitionRef biome = 2; optional string hilliness = 3; optional double elevation = 4;
  optional double latitude = 5; optional double longitude = 6; optional double rainfall = 7; optional double swampiness = 8;
  optional double pollution = 9; optional bool coastal = 10; optional double temperature_c = 11; optional double min_temperature_c = 12;
  optional double max_temperature_c = 13; optional double average_temperature_c = 14; repeated uint32 growing_twelfths = 15;
  optional double growing_days = 16; repeated ReadIssue issues = 17;
}
message WorldSnapshot { rimgovernor.common.v1.ObservationContext context = 1; WorldTile tile = 2; repeated Settlement settlements = 3; }
message WorldRequest { ReadScope scope = 1; optional int32 tile = 2; optional double settlement_radius = 3; }
message WorldReply { oneof outcome { WorldSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message WorldRoute { optional string settlement_id = 1; optional int32 destination = 2; optional bool reachable = 3; optional int64 estimated_ticks = 4; optional string reason = 5; optional double temperature_c = 6; optional bool hostile = 7; optional int32 goodwill = 8; rimgovernor.common.v1.Ref faction = 9; }
message CaravanState {
  EntityRef caravan = 1; optional int32 tile = 2; optional int32 destination = 3; optional bool moving = 4;
  optional bool moving_now = 5; optional bool resting = 6; optional double mass_usage = 7; optional double mass_capacity = 8;
  optional double food_days = 9; optional double food_rot_days = 10; repeated PawnState pawns = 11;
  repeated WorldRoute home_routes = 12; repeated Quantity inventory = 13;
}
message QuestTradeRequest { optional string resource = 1; optional int64 count = 2; optional int32 destination = 3; }
message QuestReward { optional uint32 choice_index = 1; optional string kind = 2; optional string label = 3; repeated Quantity items = 4; optional int32 favor = 5; }
message QuestState { optional string id = 1; optional string label = 2; optional string description = 3; optional rimgovernor.receipts.v1.QuestStatus state = 4; optional int64 accepted_tick = 5; optional int64 expires_in_ticks = 6; optional bool requires_accepter = 7; optional bool can_accept = 8; repeated rimgovernor.common.v1.Ref eligible_pawns = 9; repeated QuestTradeRequest trade_requests = 10; repeated QuestReward rewards = 11; repeated ReadIssue issues = 12; SnapshotRef snapshot = 13; optional string script_def = 14; optional string faction_id = 15; optional int32 map_id = 16; }
message FactionState { optional string id = 1; optional string label = 2; optional bool player = 3; optional bool hostile = 4; optional int32 goodwill = 5; optional string relation = 6; SnapshotRef snapshot = 7; }
message WorldMap { optional int32 id = 1; optional int32 tile = 2; optional bool home = 3; optional string label = 4; repeated PawnState pawns = 5; repeated ResourceStock stored_items = 6; }
message CaravanAssembly { optional string id = 1; optional int32 map_id = 2; optional string status = 3; optional bool gathering_items = 4; repeated rimgovernor.common.v1.Ref pawns = 5; }
message WorldProgressionSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated WorldMap maps = 2; repeated FactionState factions = 3; repeated CaravanState caravans = 4; repeated CaravanAssembly assemblies = 5; repeated QuestState quests = 6; }
message WorldProgressionRequest { ReadScope scope = 1; optional bool include_storage = 2; }
message WorldProgressionReply { oneof outcome { WorldProgressionSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }

// Mixed legacy tools get separate read requests: no action/dryRun write branch.
message BillsSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated BillStack benches = 2; }
message BillsRequest { ReadScope scope = 1; optional string bench_id = 2; optional bool all_factions = 3; }
message BillsReply { oneof outcome { BillsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message RecipesSnapshot { rimgovernor.common.v1.ObservationContext context = 1; SnapshotRef snapshot = 2; repeated RecipeState recipes = 3; optional string bench_def = 5; } // bench_def: the bench's ThingDef, which the recipe rows are read against in the catalog.
message RecipesRequest { ReadScope scope = 1; optional string bench_id = 2; } // bench_id names the bench whose recipe availability is read; required.
message RecipesReply { oneof outcome { RecipesSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message BuildingSettingsRequest { ReadScope scope = 1; optional string thing_id = 2; }
message BuildingSettingsReply { oneof outcome { BuildingSettings observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message PawnSettingsRequest { ReadScope scope = 1; optional string pawn_id = 2; }
message PawnSettingsReply { oneof outcome { PawnSettings observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message ResolveTargetSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated TargetRef candidates = 2; optional bool unique = 3; }
message ResolveTargetRequest { ReadScope scope = 1; oneof query { string entity_id = 2; string exact_name = 3; rimgovernor.common.v1.Cell cell = 4; } }
message ResolveTargetReply { oneof outcome { ResolveTargetSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message GearCandidate { GearItem item = 1; optional double gain = 2; optional string reason = 3; optional string blocker = 4; }
// candidates are every eligible loose item, best gain first (then thing id).
// The pawn's wear inputs (gender, developmental_stage, body_part_groups) are
// what the definition catalog's apparel rows cannot say: Go applies the wear
// filter (gender, stage, body part groups) from those rows. developmental_stage
// is the pawn's single DevelopmentalStage (the apparel filter's flag bit);
// body_part_groups are the BodyPartGroupDef names for which the pawn has a
// part that is not missing.
message GearLoadout { SnapshotRef snapshot = 1; rimgovernor.common.v1.Ref pawn = 2; PawnEquipment equipment = 3; repeated GearCandidate candidates = 4; optional double comfortable_min_c = 6; optional double comfortable_max_c = 7; optional string blocker = 10; ApparelPolicyState apparel_policy = 11; GearLoadoutModel loadout_model = 12;
  optional rimgovernor.defs.v1.Gender gender = 13; optional rimgovernor.defs.v1.DevelopmentalStage developmental_stage = 14; repeated string body_part_groups = 15; }
// One apparel option the Go loadout model may choose. Layers, body part
// groups and the def x stuff stats come from the catalog (def rows and stat
// table); the option carries the instance: id is the thing id for
// worn/loose/stored items, bill:<def>/<stuff> for a producible definition.
// source is worn, loose, stored or bill. smokepop is the def's smoke-pop verb
// (the catalog's def rows do not carry verbs yet).
message GearLoadoutOption {
  optional string id = 1; optional string def_name = 2; optional string stuff = 3; optional int32 quality = 4;
  optional string source = 5;
  optional double condition = 8; optional bool tainted = 15; optional bool locked = 16; optional bool smokepop = 19;
  repeated string research = 20; // the producing recipe's research projects (bill options)
  repeated Quantity ingredients = 21; // the producing recipe's cost for this stuff (bill options)
}
// The loadout model's per-pawn inputs: present only when the producer read the
// whole catalog. worn is every worn garment; options are the eligible loose or
// stored candidates (best native gain first) and the producible definitions
// whose recipe research is finished, one stuff each, at most 64 in total.
message GearLoadoutModel { repeated Trait traits = 2; repeated GearLoadoutOption worn = 3; repeated GearLoadoutOption options = 4; }
// Temperatures are indexed by native Twelfth (0..11), in degrees Celsius.
// Absent climate fields retain ambient-only planning for older producers.
message GearSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1;
  repeated GearLoadout pawns = 2;
  repeated float outdoor_temperature_by_twelfth_c = 4;
  optional uint32 current_twelfth = 5;
  optional int32 ticks_to_next_twelfth = 6;
  GearWeatherCondition active_weather = 7;
  GearStorage stored_apparel = 8;
}
// Aggregate only usable, untainted, unforbidden apparel in valid storage.
// hp_band is floor(condition * 10), clamped to 0..9; band 5 is >50%.
message GearStock { optional string def_name = 1; optional string stuff = 2; optional int32 quality = 3; optional int32 hp_band = 4; optional int32 count = 5; }
message GearStorage { repeated GearStock rows = 1; }
message GearWeatherCondition {
  optional string def_name = 1; // ColdSnap or HeatWave
  optional int64 remaining_ticks = 2; // -1 denotes permanent
  optional float temperature_offset_c = 3; // Native condition offset, not ambient.
}
message GearRequest { ReadScope scope = 1; optional string pawn_id = 2; }
message GearReply { oneof outcome { GearSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message Trader { EntityRef trader = 1; optional string kind = 2; rimgovernor.common.v1.Ref faction = 3; optional int64 ticks_until_departure = 4; optional bool can_trade = 5; optional string reason = 6; optional bool orbital = 7; optional uint32 goods_stacks = 8; optional bool travelling = 9; SnapshotRef trader_snapshot = 10; }
message TradersSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated Trader traders = 2; repeated rimgovernor.common.v1.Ref negotiators = 3; }
message TradersRequest { ReadScope scope = 1; }
message TradersReply { oneof outcome { TradersSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// PriceType is the vanilla trade PriceType.
enum PriceType { PRICE_TYPE_UNSPECIFIED = 0; PRICE_TYPE_UNDEFINED = 1; PRICE_TYPE_VERY_CHEAP = 2; PRICE_TYPE_CHEAP = 3; PRICE_TYPE_NORMAL = 4; PRICE_TYPE_EXPENSIVE = 5; PRICE_TYPE_EXORBITANT = 6; }
message TradeLine { optional uint32 index = 1; DefinitionRef definition = 2; optional string stuff = 3; optional string category = 4; optional int64 colony_count = 5; optional int64 trader_count = 6; optional double buy_price = 7; optional double sell_price = 8; optional PriceType buy_price_type = 9; optional PriceType sell_price_type = 10; optional double market_value = 11; optional bool trader_will_trade = 12; optional bool currency = 13; optional bool pawn = 14; optional string pawn_description = 15; optional int64 transfer_count = 16; optional int64 minimum_count = 17; optional int64 maximum_count = 18; optional bool protected_export = 19; repeated string cannot_sell_reasons = 20; optional string line_id = 21; TradeFoodFacts food = 22; repeated Skill skills = 23; optional bool violence_capable = 24; optional string pawn_id = 25; optional string thing_id = 26; optional int32 quality = 27; optional string pawn_gender = 28; optional double hit_points_fraction = 29; optional string zone_id = 30; optional bool favor = 31; optional string guest_status = 32; optional bool prisoner_secure = 33; optional bool pawn_downed = 34; rimgovernor.common.v1.Ref extra_home_faction = 35; rimgovernor.common.v1.Ref extra_host_faction = 36; }
// TradeCurrencyKind is the open session's currency (vanilla TradeCurrency):
// silver, or the trader faction's royal favor (the Royalty tribute
// collector). In a favor session every row's sell_price is that item's
// favor value, TradeLine.favor marks the favor currency row (no ThingDef, so
// an empty definition; its transfer_count is the favor the negotiator gains),
// and absent reads as silver.
enum TradeCurrencyKind { TRADE_CURRENCY_KIND_UNSPECIFIED = 0; TRADE_CURRENCY_KIND_SILVER = 1; TRADE_CURRENCY_KIND_FAVOR = 2; }
// TradeSession is the adapter's one live trade (#856): the negotiator
// walking to trader_id to open a session (open false), or the pair holding
// the open session (open true). Both ids are absent when neither exists.
message TradeSession { rimgovernor.common.v1.ObservationContext context = 1; optional string trader_id = 2; optional string negotiator_id = 3; optional bool open = 4; }
message TradeSessionRequest { ReadScope scope = 1; }
message TradeSessionReply { oneof outcome { TradeSession observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message TradeSheet { SnapshotRef snapshot = 1; optional string session_id = 2; rimgovernor.common.v1.Ref trader = 3; rimgovernor.common.v1.Ref negotiator = 4; optional bool gift_mode = 5; optional bool negotiator_adjacent = 6; optional bool can_trade_now = 7; optional double balance = 8; optional bool colony_can_afford = 9; optional bool trader_has_enough_silver = 10; repeated TradeLine lines = 11; optional string deal_signature = 13; optional TradeCurrencyKind currency_kind = 14; }
message TradeSheetRequest { ReadScope scope = 1; optional string session_id = 2; optional bool include_untradeable = 3; optional bool only_changed = 4; optional string name_contains = 5; }
message TradeSheetReply { oneof outcome { TradeSheet observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }

message FoodConsumer { optional string pawn_id = 1; optional double nutrition_per_day = 2; optional bool human_meat_acceptable = 3; }
// A food stock references its thing's row in the bundle's things table
// (#1343) and adds what is relative to its eaters: holder when only
// that pawn eats it, the nutrition the stack gives them and who can eat it
// (the row's forbidden flag is the stack's; Go decides which forbidden food
// is the travel reserve).
message FoodStock { rimgovernor.common.v1.Ref item = 1; rimgovernor.common.v1.Ref holder = 3; optional double nutrition = 4; repeated rimgovernor.common.v1.Ref eaters = 5; }
// in_storage is whether the corpse lies in a stockpile (false: in the field).
message CorpseHandling { string stock_id = 1; rimgovernor.common.v1.Cell cell = 2; optional string hauler_id = 3; bool frozen_destination = 4; optional bool in_storage = 5; }
message FoodLarderFacts { double raw_meat_nutrition = 1; double cook_demand_nutrition = 2; repeated CorpseHandling corpses = 3; repeated rimgovernor.common.v1.Cell cold_sites = 4; }
message FoodSupplyFacts { repeated FoodConsumer consumers = 1; repeated FoodStock stocks = 2; FoodLarderFacts larder = 4; }
message CropForecast { rimgovernor.common.v1.Ref zone = 1; optional string crop = 2; optional double sow_work = 3; optional double harvest_work = 4; optional uint32 mature_plants = 5; optional uint32 stalled_plants = 6; optional double standing_yield = 7; optional string product = 8; repeated ReadIssue issues = 9; }
message PatientForecast { optional string pawn_id = 1; optional double bleed_rate_per_day = 2; optional double hours_until_death_from_blood_loss = 3; optional double mood = 4; optional double mood_target = 5; optional double minor_break_threshold = 6; optional double major_break_threshold = 7; optional double extreme_break_threshold = 8; repeated ReadIssue issues = 9; }
message ForecastFacts { repeated string animal_ids = 1; FoodSupplyFacts combined_food_supply = 2; repeated CropForecast crops = 3; repeated PatientForecast patients = 4; }
message ComfortSurface { optional string id = 1; repeated rimgovernor.common.v1.Cell adjacent = 2; rimgovernor.common.v1.Ref room = 3; }
message ComfortFacility { optional string id = 1; optional string kind = 2; repeated rimgovernor.common.v1.Ref accessible_to = 3; repeated rimgovernor.common.v1.Ref users = 4; rimgovernor.common.v1.Ref room = 5; }
// Complete building-backed kind census. Parallel tolerance/bored arrays follow
// kinds; pawns without a joy need are omitted. Absent census means unavailable.
message JoyTolerance { string pawn = 1; repeated double tolerance = 2; repeated bool bored = 3; }
message RecreationCensus { repeated string kinds = 1; repeated JoyTolerance pawns = 2; }
message ComfortFacts { repeated string people = 1; repeated ComfortSurface surfaces = 2; repeated ComfortFacility dining = 3; repeated ComfortFacility recreation = 4; RecreationCensus joy = 6; }
message UpkeepItem { rimgovernor.common.v1.Ref item = 1; optional int64 count = 2; optional int32 hit_points = 3; optional int32 max_hit_points = 4; optional bool roofed = 5; optional bool in_storage = 6; optional double deterioration_rate = 7; optional int64 rot_ticks = 9; optional double temperature_c = 11; optional bool forbidden = 12; optional bool burning = 15; }
message UpkeepBed { rimgovernor.common.v1.Ref bed = 1; optional uint32 slots = 2; optional bool humanlike = 3; optional double rest_effectiveness = 4; optional bool medical = 5; optional bool prisoners = 6; repeated rimgovernor.common.v1.Ref owners = 7; repeated rimgovernor.common.v1.Ref users = 8; repeated rimgovernor.common.v1.Ref accessible_to = 9; optional bool roofed = 10; optional double temperature_c = 11; rimgovernor.common.v1.Ref room = 12; optional string quality = 13; optional string stuff = 15; optional bool for_slaves = 16; }
message StorageCell { rimgovernor.common.v1.Cell cell = 1; optional bool roofed = 2; optional bool occupied = 3; }
message ItemStorageCapacity { optional string item_id = 1; optional int64 unreserved_covered_capacity = 2; optional uint32 accepting_cells = 3; }
message UpkeepStructure { rimgovernor.common.v1.Ref building = 7; optional bool home = 2; optional bool holds_roof = 3; optional int32 repair_priority = 4; optional double flammability = 5; optional bool roofed = 6; }
message FireState { rimgovernor.common.v1.Ref fire = 1; optional double size = 2; optional bool home = 3; repeated rimgovernor.common.v1.Ref safe_workers = 4; }
message FilthState { rimgovernor.common.v1.Ref filth = 1; optional bool home = 2; optional uint32 thickness = 3; optional string room_role = 4; optional bool cleanable = 5; rimgovernor.common.v1.Ref room = 6; }
message ProtectedCell { rimgovernor.common.v1.Cell cell = 1; optional bool home = 2; optional bool roofed = 3; }
// partners: lover, spouse and fiance relations to living pawns on the same
// map (native direct relations). bed_sharing_allowed: the native willingness
// to share a bed with every listed partner (the SharedBed precepts; with no
// partner, the plain SharedBed precept), true without Ideology. title: the
// most senior royal title, absent without one or when Royalty is inactive.
message UpkeepPerson { rimgovernor.common.v1.Ref pawn = 9; rimgovernor.common.v1.Ref owned_bed = 2; optional double comfortable_min_c = 3; optional double comfortable_max_c = 4; optional double temperature_c = 5; repeated rimgovernor.common.v1.Ref partners = 6; optional bool bed_sharing_allowed = 7; RoyalTitleFacts title = 8; }
// Bedroom requirements read from RoyalTitleDef.GetBedroomRequirements for the
// holder (none for an ascetic), skipping requirements an ideo precept disables.
// things: each row is one requirement met by count of any listed def.
message BedroomThingRequirement { repeated string any_of = 1; optional int32 count = 2; }
message RoyalTitleFacts { optional string def_name = 1; optional int32 seniority = 2; optional int32 bedroom_min_area = 3; optional int32 bedroom_min_impressiveness = 4; optional bool bedroom_floored = 5; repeated BedroomThingRequirement bedroom_things = 6; }
// permit_cooldowns (#1607): one row per held permit.
// last_used_tick is FactionPermit.LastUsedTick (absent when never used) and
// cooldown_remaining_ticks the ticks until it can be used again (0 when ready),
// both read at the read's tick.
message PermitCooldown { optional string permit = 1; optional int32 last_used_tick = 2; optional int32 cooldown_remaining_ticks = 3; }
message PawnRoyalHolding { optional string faction_def = 1; optional string title = 2; optional int32 favor = 3; optional int32 permit_points = 4; repeated string permits = 5; repeated PermitCooldown permit_cooldowns = 6; }
// Psycasts (#1600): psycasts holds each psycaster's known psycasts (Ability
// defs with IsPsycast). level is the psylink level that unlocks it,
// psyfocus_cost the Psyfocus it spends (0-1), entropy the neural heat it adds,
// cooldown_ticks the longest cooldown. neuroformers: the psylink neuroformer
// and each psycast neurotrainer, with held (unforbidden spawned stacks on the
// player's home maps), craftable (a recipe that is available now makes it)
// and tradeable (a trader can sell it). teaches_psycast is the trainer's
// ability def. For combat casts (#1611) cooldown_remaining_ticks is the
// psycast's remaining cooldown and the pawn's psyfocus (0-1), entropy and
// entropy_max are read at the read's tick; each is absent when unread.
enum PsycastTargetKind { PSYCAST_TARGET_KIND_UNSPECIFIED = 0; PSYCAST_TARGET_KIND_SELF = 1; PSYCAST_TARGET_KIND_PAWN = 2; PSYCAST_TARGET_KIND_THING = 3; PSYCAST_TARGET_KIND_CELL = 4; }
message PawnPsycast { optional string def_name = 1; optional int32 level = 2; optional double psyfocus_cost = 3; optional double entropy = 4; PsycastTargetKind target_kind = 5; optional int32 cooldown_ticks = 6; optional int32 cooldown_remaining_ticks = 7; }
message NeuroformerStock { optional string def_name = 1; optional string teaches_psycast = 2; optional int32 held = 3; optional bool craftable = 4; optional bool tradeable = 5; }
// PawnState.royalty (#1876): the pawn is the row's.
message PawnRoyalty { reserved 1; repeated PawnRoyalHolding holdings = 2; repeated PawnPsycast psycasts = 3; optional double psyfocus = 4; optional double entropy = 5; optional double entropy_max = 6; }
// Pending bestowing ceremonies (#1602): one per colonist holding an ongoing or
// offered bestowing-ceremony quest (RoyalTitleUtility.GetCurrentBestowingCeremonyQuest).
// quest is the quest load id the quest census lists. pawn is the colonist to be bestowed, bestower the Empire pawn, title the def
// the ceremony awards (GetTitleAwardedWhenUpdating), accepted whether the
// quest is Ongoing (else NotYetAccepted), bestower_waiting whether the bestower
// stands on the map in the lord's Wait toil (the ceremony starts only on the
// player's command), started whether the ritual runs, spot the ceremony cell
// (the throne spot) and attendees the lord's colonist participants. Each
// scalar is absent when native could not read it.
message BestowingCeremony { optional string quest = 10; rimgovernor.common.v1.Ref pawn = 1; rimgovernor.common.v1.Ref bestower = 2; optional string faction_def = 3; optional string title = 4; optional bool accepted = 5; optional bool bestower_waiting = 6; optional bool started = 7; rimgovernor.common.v1.Cell spot = 8; repeated rimgovernor.common.v1.Ref attendees = 9; }
// Throne ownership (#1601): thrones lists every spawned player throne
// (Building_Throne) with its assigned owner; owner is absent when none is
// assigned. A throne appears once it stands, so a throne missing from the
// list was built after the read.
message RoyalThrone { rimgovernor.common.v1.Ref thing = 1; optional string def_name = 2; rimgovernor.common.v1.Ref owner = 3; }
// Royalty colony facts (#1877), a keyed colony section (#1347): the neuroformer
// stock, the pending bestowing ceremonies and the standing thrones. Absent
// without Royalty.
message RoyaltySection { oneof outcome { RoyaltyColonyFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message RoyaltyColonyFacts { repeated NeuroformerStock neuroformers = 1; repeated BestowingCeremony ceremonies = 2; repeated RoyalThrone thrones = 3; }
// reachable_benches lists the player work tables whose position the animal
// can reach inside its allowed area: a bill there drops its product where the
// animal can eat it. reachable_storage lists the stockpile zones holding a
// cell the animal can reach inside its allowed area, each with the
// nutrition-giving definitions its filter accepts among those the animal's
// race can ever eat (accepts): feed produced elsewhere and hauled there is
// feed the animal eats. storage_candidates is a bounded, connected footprint
// of free roofed cells inside the allowed area (standable, unzoned, unbuilt,
// reachable by the animal and a hauler) near the animal on which such a
// zone could be made; empty when no hauler exists or no cell qualifies.
message AnimalFeedStorage { rimgovernor.common.v1.Ref zone = 1; repeated string accepts = 2; }
// pawn refers to the bundle pawn table row (#1343), whose animal_state
// carries the herd facts.
message AnimalFeed { rimgovernor.common.v1.Ref pawn = 9; optional string diet = 2; optional bool requires_pen = 3; rimgovernor.common.v1.Ref suitable_pen = 4; repeated FoodStock reachable_stored_feed = 5; repeated rimgovernor.common.v1.Ref reachable_benches = 6; repeated AnimalFeedStorage reachable_storage = 7; repeated rimgovernor.common.v1.Cell storage_candidates = 8; }
message DevelopmentPower { rimgovernor.common.v1.Ref building = 8; optional double stored_watt_days = 3; optional double capacity_watt_days = 4; optional bool roofed = 6;
  // A turret gun's damage per second from its own verb and burst timing (#1188); absent for other consumers.
  optional double turret_dps = 7; }
message DevelopmentFurniture { rimgovernor.common.v1.Ref building = 1; optional bool indoors = 2; optional uint32 slots = 3; }
// One steam geyser on the map: geyser is the Building_SteamGeyser with its
// anchor position, cells its 2x2 footprint, and occupied whether a harvester
// (a geothermal generator, built or under construction) or any other
// building already stands on it.
message SteamGeyser { rimgovernor.common.v1.Ref geyser = 1; repeated rimgovernor.common.v1.Cell cells = 2; optional bool occupied = 3; }
message DevelopmentFacts { repeated DevelopmentPower power = 1; repeated DevelopmentFurniture furniture = 2; repeated PowerNetwork networks = 5; optional int64 short_circuit_tick = 6; repeated SteamGeyser geysers = 7; }
message EnvironmentCondition { optional string id = 1; optional string def_name = 2; optional string implementation = 3; optional string label = 4; optional bool permanent = 5; optional int64 ticks_left = 6; }
// FoodClimate is the map tile's calendar for food planning: growing_days is
// the tile's growing period per 60-day year, growing_days_remaining the days
// until the seasonal temperature next leaves the crop growth range (60 while
// it never does), growing_days_until the days until it next re-enters it (0
// while crops grow now, 60 when the tile never grows), and non_growing_days
// the length of the current or coming non-growing stretch on the same daily
// walk (first out-of-range day to re-entry: 0 while it never leaves, 60 when
// it never grows; equal to growing_days_until while crops do not grow).
// season is the native Season name at the tile and day_of_year the 0-based
// day of the 60-day year.
message FoodClimate { optional double growing_days = 1; optional double growing_days_remaining = 2; repeated ReadIssue issues = 3; optional bool sowing_now = 4; optional double growing_days_until = 5; optional string season = 6; optional int32 day_of_year = 7; optional double non_growing_days = 8; }
// FarmFacts mirrors one growing zone's raw state; policy computes the harvest
// lead and the growing-cell count from it and the food climate calendar.
// growth_* are the planted plants' growth fractions (0..1), fertility_factor_*
// and light_factor_mean their native growth-rate factors, fertile_planted_cells
// the planted cells whose fertility factor is above zero, and blighted_plants
// the planted plants with blight. temperature is the map's outdoor temperature
// and the *_growth_temperature fields the crop's native growth range.
message FarmFacts {
  reserved 5, 7;
  reserved "growing_cells", "harvest_lower_bound_days";
  rimgovernor.common.v1.Ref zone = 1; optional string crop = 2; optional uint32 usable_cells = 3; optional uint32 planted_cells = 4; optional bool edible_crop = 6; optional double nutrition_per_harvest_cell = 8; optional bool sowing_now = 9;
  optional double growth_min = 10; optional double growth_mean = 11;
  optional double fertility_factor_min = 12; optional double fertility_factor_mean = 13; optional uint32 fertile_planted_cells = 14;
  optional double light_factor_mean = 15; optional uint32 blighted_plants = 16;
  optional double temperature = 17;
  optional double min_growth_temperature = 18; optional double min_optimal_growth_temperature = 19;
  optional double max_optimal_growth_temperature = 20; optional double max_growth_temperature = 21;
}
// Controlled-environment growing facts within the planning region: sun lamps
// with the exact cells they grow, plant growers (hydroponics) with their
// fertility and sow tag, roofed rooms with temperature, and per-network
// power headroom split by source so night and outage margins are computable.
message GrowLight { rimgovernor.common.v1.Ref building = 1; rimgovernor.common.v1.Ref room = 2; optional bool powered = 3; optional double power_w = 4; repeated rimgovernor.common.v1.Cell growth_cells = 5; optional bool lit_now = 6; optional string power_net_id = 7; repeated ReadIssue issues = 8; }
message PlantGrower { rimgovernor.common.v1.Ref building = 1; rimgovernor.common.v1.Ref room = 2; optional bool powered = 3; optional double power_w = 4; optional double fertility = 5; repeated rimgovernor.common.v1.Cell plant_cells = 6; optional string sow_tag = 7; optional string crop_def_name = 8; optional bool can_sow = 9; optional string power_net_id = 10; repeated ReadIssue issues = 11; }
message GrowRoom { rimgovernor.common.v1.Ref room = 1; optional double temperature_c = 2; optional uint32 cell_count = 3; optional uint32 open_roof_count = 4; optional bool proper_room = 5; optional bool psychologically_outdoors = 6; optional uint32 lit_cells = 7; }
message PowerHeadroom { optional string id = 1; optional double generation_w = 2; optional double solar_w = 3; optional double wind_w = 4; optional double consumption_w = 5; optional double stored_watt_days = 6; optional double capacity_watt_days = 7; optional bool has_active_source = 8; }
message ControlledEnvironment { repeated GrowLight lights = 1; repeated PlantGrower growers = 2; repeated GrowRoom rooms = 3; repeated PowerHeadroom networks = 4; optional bool daylight = 6; repeated ReadIssue issues = 8; optional string weather = 9; /* current WeatherDef defName, absent when unread */ }
// A sowable crop with an edible product: the map's per-day facts beside
// the catalog's static row (#1340).
message EdibleCrop { optional string def_name = 1; optional double nutrition_demand_per_day = 2;
  optional bool diet_allowed = 3; // No colonist ideology penalises this crop product.
}
// The definitions themselves are the definition catalog's (#1340); crops
// lists every edible crop, sorted by name.
message PlanningFacts { GearSnapshot gear = 3; repeated ReadIssue issues = 5; ControlledEnvironment environment = 7; repeated EdibleCrop crops = 8; }
// The static facts of a product (nutrition, rot days, perishability, baby
// edibility) are its def row's in the definition catalog (#1733); the frame
// carries what varies: count, whether a human can eat it, the colony's demand
// and the storage room left.
message FoodProduct { optional string def_name = 1; optional int64 count = 2; optional bool edible = 3; optional double nutrition_demand_per_day = 5;
  // storable is the product count roofed, reachable storage accepting it can
  // hold: stored stacks plus empty stack slots (#1359). Caps reserve bill targets.
  optional int64 storable = 8; }
message FoodProduction { optional string recipe = 1; optional bool available = 2; repeated FoodProduct products = 3; }
message CookingFacts { rimgovernor.common.v1.Ref bench = 1; optional bool usable = 2; repeated RecipeState recipes = 3; repeated BillState bills = 4; repeated FoodProduction production = 5; rimgovernor.common.v1.Ref room = 6;
  // auto_refuel is a refuelable bench's CompRefuelable.allowAutoRefuel (BuildingPatchIntent.auto_refuel, #1180).
  optional bool auto_refuel = 7;
  // The bench's CAS token (#1342).
  SnapshotRef bench_snapshot = 8; }
// A blighted plant standing in a player growing zone or on home ground: the
// crop-blight census RemoveBlight cuts from. Nearest the colony first, at
// most 64 rows; plant.snapshot is the CutPlant designation's CAS token.
// zone_id is the growing zone the plant stands in, absent on home ground.
// designated: a CutPlant or HarvestPlant designation already exists.
message BlightedPlant { rimgovernor.common.v1.Ref plant = 1; rimgovernor.common.v1.Ref zone = 2; optional bool designated = 3; optional double growth = 4; SnapshotRef plant_snapshot = 5; }
message AcquisitionFacts { rimgovernor.common.v1.Ref source = 1; SnapshotRef source_snapshot = 16; optional string resource = 2; optional bool tree = 3; optional bool food = 4; optional double yield = 5; optional double nutrition_yield = 6; optional bool designated = 7; optional bool hunt = 8; optional double revenge_chance = 9; optional uint32 herd_size = 10; optional bool melee_only = 11; optional bool downed = 12; reserved 13; reserved "weapon_range"; optional int64 designated_tick = 14; optional bool taken = 15; optional double body_size = 17; optional bool sleeping = 18; optional bool predator = 19;
  // Raw hunt prey facts (#2144): a hunt row is every wild animal that bears a corpse, whatever
  // policy then decides. fogged and in_mental_state are native's current reading of the animal.
  optional bool fogged = 20; optional bool in_mental_state = 21; }
// Raw hunt census (#2144): what Go needs to decide whether a hunt row is offered. Native states
// facts and keeps only physical validity; butcher readiness, weapon rules, hunter eligibility and
// the pending-hunt cap are Go policy (policy.HuntGate).
// HuntProjectileKind classifies a verb's default projectile by its ThingDef class: BULLET is
// exactly RimWorld.Bullet; ARROW is a Bullet-class projectile whose damage def is an arrow
// damage (DamageDef.defName starting "Arrow"); anything else is OTHER.
enum HuntProjectileKind { HUNT_PROJECTILE_KIND_UNSPECIFIED = 0; HUNT_PROJECTILE_KIND_BULLET = 1; HUNT_PROJECTILE_KIND_ARROW = 2; HUNT_PROJECTILE_KIND_OTHER = 3; }
message HuntVerbFacts { optional bool melee = 1; optional bool ai_weapon = 2; optional double range = 3; optional HuntProjectileKind projectile_kind = 4; optional double explosion_radius = 5; optional string damage_def = 6; optional string damage_worker = 7; optional double warmup = 8; }
message HuntWeaponFacts { optional string def_name = 1; optional bool ranged = 2; optional bool melee = 3; repeated HuntVerbFacts verbs = 4; }
// One free colonist. hunting_priority is the raw work priority (0 is off); hunting_active is
// WorkIsActive; hunting_disabled is WorkTypeIsDisabled. weapon is absent for an unarmed pawn.
// has_hunting_weapon and ranged_blocking_shield mirror WorkGiver_HunterHunt.HasHuntingWeapon and
// HasShieldAndRangedWeapon. route_safe_prey lists the hunt row sources the colonist has a safe
// route to (HuntingSafety.RouteSafe, a pathing fact), evaluated only within the hunting reach
// (100 cells) or for a pest: a bound on pathfinding cost, the same reach policy applies.
// reachable_benches lists the butcher benches the colonist can reach.
message HunterFacts {
  optional string pawn_id = 1; rimgovernor.common.v1.Cell position = 2;
  optional bool downed = 3; optional bool in_mental_state = 4; optional bool drafted = 5;
  optional int32 hunting_priority = 6; optional bool hunting_active = 7; optional bool hunting_disabled = 8;
  optional bool cooking_active = 9;
  HuntWeaponFacts weapon = 10; optional bool has_hunting_weapon = 11; optional bool ranged_blocking_shield = 12;
  repeated string route_safe_prey = 13; repeated string reachable_benches = 14;
}
// A butcher-flesh bill on a bench; allowed_corpses are the corpse defs of the census's wild
// animals the bill's ingredient filter allows; product_count is BillCommon.ProductCount for a
// target-count bill.
message HuntButcherBill {
  optional bool suspended = 1; optional bool paused = 2;
  optional rimgovernor.operations.v1.RepeatMode repeat_mode = 3; optional int32 repeat_count = 4; optional int32 target_count = 5; optional int32 product_count = 6;
  repeated string allowed_corpses = 7;
}
message HuntButcherBench { optional string bench_id = 1; optional bool usable = 2; repeated HuntButcherBill bills = 3; }
message HuntCensus { repeated HunterFacts hunters = 1; repeated HuntButcherBench benches = 2; }
message ButcheringFacts { rimgovernor.common.v1.Ref bench = 1; SnapshotRef bench_snapshot = 11; repeated BillState bills = 2; optional bool usable = 3; repeated RecipeState recipes = 4; rimgovernor.common.v1.Ref room = 5; repeated HumanButcherCandidate human_butchers = 6; optional double human_corpse_nutrition = 7; optional string human_corpse_def = 10; }
message HumanButcherCandidate { reserved 2, 3; reserved "precept_acceptable"; string pawn_id = 1; optional bool can_work = 4; repeated Trait pawn_traits = 5; }
message FoodCorpse { CorpseState corpse = 1; optional bool fresh = 2; optional bool reachable = 3; optional string meat_def = 4; optional double nutrition_yield = 5; }
message ColonyNaming { optional int32 window_id = 1; optional string faction_name = 2; optional string settlement_name = 3; repeated ReadIssue issues = 4; }
// One force-pausing Verse.Dialog_NodeTree the game opened by itself (an
// incident's caravan demand/meeting, a quest dialog, a finished research
// project's completion dialog). Options are the current node's DiaOptions in
// native order; index is the exact native list position AnswerDialog names.
// selectable is false for a disabled option, for a hyperlink row (never
// closes the dialog) and for an option that neither closes the tree nor links
// to a further node: its action opens another window the controller does not
// drive (CaravanMeeting's Trade opening Dialog_Trade). resolves reports
// whether the option closes the tree (DiaOption.resolveTree) rather than
// moving to a linked node. keys are the language-neutral Keyed translation
// keys whose active- or English-language text produces the label, sorted;
// empty for a label no keyed entry yields (a mod's literal text, a quest's
// composed choice).
message ChoiceDialogOption { optional int32 index = 1; optional string label = 2; optional bool selectable = 3; optional bool resolves = 4; optional string disabled_reason = 5; repeated string keys = 6; }
message ChoiceDialog { optional int32 window_id = 1; optional string window_type = 2; optional string title = 3; optional string text = 4; repeated ChoiceDialogOption options = 5; optional bool interactive = 6; }

// Independently unavailable helper sections never masquerade as empty arrays.
message ComfortSection { oneof outcome { ComfortFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message FoodSupplySection { oneof outcome { FoodSupplyFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message ForecastSection { oneof outcome { ForecastFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message DevelopmentSection { oneof outcome { DevelopmentFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message PlanningSection { oneof outcome { PlanningFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message WallRemovalRecord { optional string id = 1; optional string target_id = 2; optional bool complete = 3; optional int64 completed_tick = 4; optional string blocker = 5; optional bool target_present = 8; optional bool designated = 9; }
message WallRemovalFacts { repeated WallRemovalRecord records = 1; SnapshotRef snapshot = 3; }
message WallRemovalSection { oneof outcome { WallRemovalFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Present geometry is complete and independent of the bounded Home write batch.
// zone is a stockpile target's full native footprint (#719): colony extent
// takes every stockpile from the census, not only zones the autopilot created.
message HomeExtentGeometry { repeated rimgovernor.common.v1.Cell enclosed_interior = 1; repeated rimgovernor.common.v1.Cell corridor = 2; repeated rimgovernor.common.v1.Cell zone = 3; }
message HomeCoverageTarget { optional string id = 1; optional string shape_token = 2; optional uint32 missing_cells = 3; optional uint32 excluded_cells = 4; optional string blocker = 5; repeated rimgovernor.common.v1.Cell cells = 6; SnapshotRef snapshot = 7; HomeExtentGeometry extent_geometry = 8; }
message HomeCoverageFacts { optional int64 revision = 1; repeated HomeCoverageTarget targets = 2; }
message HomeCoverageSection { oneof outcome { HomeCoverageFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Lighting facts: the measured ground glow at every colonist work bench
// interaction cell plus the colony's glowing fixtures, so MaintainLighting
// reasons from illumination at the cell a pawn actually stands on rather than
// from fixture counts. Glow follows the native GlowGrid (0..1; RimWorld treats
// >= 0.3 as lit). A lamp is lit only when native currently emits light. A work
// cell is light_sensitive when its room holds a plant (or a growing zone set
// to a plant) that native says dies to light, such as cave fungus: lighting
// that room would kill the crop, so the cell is never a lighting deficit.
message WorkLightCell { rimgovernor.common.v1.Ref bench = 1; rimgovernor.common.v1.Cell cell = 2; optional double glow = 3; optional bool roofed = 4; rimgovernor.common.v1.Ref room = 5; optional bool light_sensitive = 6; }
message LampState { rimgovernor.common.v1.Ref building = 5; optional double glow_radius = 2; optional bool lit = 3; rimgovernor.common.v1.Ref room = 4; }
message LightingFacts { repeated WorkLightCell work_cells = 1; repeated LampState lamps = 2; }
message LightingSection { oneof outcome { LightingFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Flooring facts: every proper indoor home room with the terrain under each
// of its cells, plus one row per distinct terrain with the native stats
// MaintainFlooring scores (cleanliness, path cost, beauty, flammability) and
// whether the terrain is natural ground rather than a laid floor. A cell
// whose floor is already ordered carries the pending floor definition so the
// planner never doubles an open blueprint or frame.
message FloorCell { rimgovernor.common.v1.Cell cell = 1; optional string terrain = 2; optional string pending = 3; }
// Room stats live on the bundle rooms census (RoomState.stats), not here (#821, #1338).
message FloorRoom { rimgovernor.common.v1.Ref room = 1; optional string role = 2; repeated FloorCell cells = 3; }
// Every terrain a cell can stand on is a catalog TerrainDef row; the frame names none.
message FlooringFacts { repeated FloorRoom rooms = 1; }
message FlooringSection { oneof outcome { FlooringFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Routes census (issue #6 slice 5): each colony facility a colonist must
// reach (bed, work bench, storage, dining surface, defence emplacement) with
// per-colonist native reachability from where that colonist stands and the
// cost of the path the game itself would walk; a facility no colonist reaches
// lists breach candidates: player wall cells of its room whose outer
// neighbour a colonist can stand on.
// Traffic (#817) counts cell changes of moving pawns per layer, each layer
// decaying on its own half-life, rebuilt from zero after a load; the
// busiest cells are reported per layer with their terrain.
enum TrafficLayer {
  TRAFFIC_LAYER_UNSPECIFIED = 0;
  TRAFFIC_LAYER_COLONIST = 1;
  TRAFFIC_LAYER_CROSSING = 2; // Any pawn stepping from soil or sand onto a built floor.
  TRAFFIC_LAYER_ANIMAL = 3;   // Colony animals.
  TRAFFIC_LAYER_VISITOR = 4;  // Visitors and traders.
  TRAFFIC_LAYER_HOSTILE = 5;  // Hostile pawns; slow decay.
}
message RouteTravel { optional string pawn_id = 1; optional bool reachable = 2; optional int32 path_cost = 3; optional int32 path_cells = 4; }
message RouteBreach { rimgovernor.common.v1.Cell cell = 1; optional string edifice = 2; optional string pending = 3; optional int32 distance = 4; }
enum RouteFacilityKind { ROUTE_FACILITY_KIND_UNSPECIFIED = 0; ROUTE_FACILITY_KIND_BED = 1; ROUTE_FACILITY_KIND_BENCH = 2; ROUTE_FACILITY_KIND_STORAGE = 3; ROUTE_FACILITY_KIND_DINING = 4; ROUTE_FACILITY_KIND_DEFENSE = 5; ROUTE_FACILITY_KIND_STOCKPILE = 6; }
message RouteFacility { rimgovernor.common.v1.Ref facility = 1; optional RouteFacilityKind kind = 2; rimgovernor.common.v1.Cell cell = 3; rimgovernor.common.v1.Ref room = 4; repeated RouteTravel travel = 5; repeated RouteBreach breaches = 6; }
message TrafficCell { rimgovernor.common.v1.Cell cell = 1; optional uint32 samples = 2; optional string terrain = 3; optional bool home = 4; optional string pending = 5; TrafficLayer layer = 6; }
message RoutesFacts { repeated RouteFacility facilities = 1; repeated string pawn_ids = 2; repeated TrafficCell traffic = 3; optional uint32 traffic_samples = 4; optional int32 traffic_since_tick = 5; }
message RoutesSection { oneof outcome { RoutesFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message UpkeepFacts {
  ComfortSection comfort = 1; repeated UpkeepItem items = 3;
  repeated UpkeepBed beds = 4; repeated StorageCell storage_cells = 5; repeated ItemStorageCapacity storage_capacity = 6;
  repeated UpkeepStructure structures = 7; repeated FireState fires = 8; repeated FilthState filth = 9;
  repeated ProtectedCell protected_cells = 10; repeated UpkeepPerson people = 11;
  repeated AnimalFeed animals = 13; repeated ReadIssue issues = 15;
  WallRemovalSection wall_removal = 17; HomeCoverageSection home_coverage = 18; LightingSection lighting = 19;
  repeated AnimalFeed wild_animals = 20; FlooringSection flooring = 21; RoutesSection routes = 22; /* rooms: the bundle rooms census */ repeated UpkeepPerson slaves = 24;
  // Find.PlaySettings.autoHomeArea: the game expands the home area around
  // new player buildings while true (AutoHomeAreaIntent, #1322).
  optional bool auto_home_area = 25;
  // Every cell of the map's home area (#1328), unordered; the home-area
  // planner diffs its target against it.
  repeated rimgovernor.common.v1.Cell home_cells = 26;
}
message UpkeepSection { oneof outcome { UpkeepFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Threat facts (#395): the colony wealth the storyteller scales raids by
// and the raid points a default threat incident would draw right now.
// wealth_* are WealthWatcher's lazy recount (items, buildings, pawns,
// total); storyteller_wealth is the map's PlayerWealthForStoryteller;
// raid_points is StorytellerUtility.DefaultThreatPointsNow for the map,
// already scaled by adaptation_factor (the story watcher's
// TotalThreatPointsFactor) and difficulty_threat_scale. Read-only.
message ThreatFacts { optional double wealth_items = 1; optional double wealth_buildings = 2; optional double wealth_pawns = 3; optional double wealth_total = 4; optional double storyteller_wealth = 5; optional double raid_points = 6; optional double adaptation_factor = 7; optional double difficulty_threat_scale = 8; optional uint32 colonist_count = 9; repeated ReadIssue issues = 11; }
message ThreatSection { oneof outcome { ThreatFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Current autonomous hauling safety for visible haulable items. count is the
// stack size; path_length is the shortest observed safe colonist route to the
// item in cells (present only with safe_to_haul true); storage_headroom is the
// item units the player's accepting storage can still take for this def.
// free_haulers counts free colonists with Hauling enabled; storyteller_quiet
// is true at zero threat scale or with no storyteller incident generators.
message LootItem { rimgovernor.common.v1.Ref item = 1; optional bool forbidden = 2; optional bool safe_to_haul = 3; optional int64 count = 4; optional double path_length = 5; optional int64 storage_headroom = 6; }
message LootCensus { repeated LootItem items = 1; optional int64 free_haulers = 2; optional bool storyteller_quiet = 3; }
message LootSection { oneof outcome { LootCensus observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Food source potential, independent of acquisition instances and policy.
// Animal rows cover every tame animal: absent components leave their scalars
// absent. Water rows aggregate fishable cells by native water body; population
// is shared by that body, not multiplied by its shallow cells. FishableWater
// is absent without Odyssey. Pollution uses the clipped center +/-22 window.
// Raw fishing facts; policy chooses the footprint, verdicts and research lead.
// cells are the water body's fishable cells (vanilla's Designator_ZoneAdd_Fishing
// rule) with whether any fisher can reach and is not forbidden from each.
// reachable is any fisher reaching any non-fogged body cell; frozen is every such
// cell being thin ice. yield_curve_value is the population-to-yield curve at
// the body's population; zones are the fishing zones touching the body.
message FishableCell { rimgovernor.common.v1.Cell cell = 1; optional bool reachable = 2; optional double distance_squared = 3; }
message FishingZoneFacts { optional bool allowed = 1; optional bool do_forever = 2; optional double target_population_pct = 3; optional bool has_fishable_cells = 4; }
message FishableRegion {
  reserved 11, 12, 13, 14;
  rimgovernor.common.v1.Cell root = 1; optional double population = 2; optional double max_population = 3; optional bool zoned = 4; optional uint32 cell_count = 5; optional bool reachable = 6; optional bool frozen = 7; optional double nutrition_per_fish = 8; optional double fish_per_batch = 9; optional double work_ticks_per_batch = 10; optional double nearest_distance_squared = 15;
  repeated FishableCell cells = 16; repeated FishingZoneFacts zones = 17; optional double yield_curve_value = 18;
}
// fishers are the colonists able to fish; researcher_speeds the ResearchSpeed of
// colonists able to research. Research lead in days is
// max(0, base_cost - progress) * cost_factor / (max speed * points_per_work_tick
// * difficulty_speed_factor * work ticks per day).
message FisherFacts { optional double fishing_yield = 1; optional double fishing_speed = 2; }
message FishableWater {
  reserved 3;
  repeated FishableRegion regions = 1; optional bool fishing_researched = 2;
  optional double research_base_cost = 4; optional double research_progress = 5; optional double research_cost_factor = 6;
  repeated double researcher_speeds = 7; optional double research_points_per_work_tick = 8; optional double research_difficulty_speed_factor = 9;
  repeated FisherFacts fishers = 10; optional double base_fishing_duration_ticks = 11;
}
message GatherableAnimal { optional string pawn_id = 1; optional string race = 2; optional double fullness = 3; optional string resource = 4; optional bool handler_reachable = 5; optional double nutrition_per_day = 6; optional double work_per_day = 7; optional double lead_days = 8; optional bool active = 9; }
message EggLayerAnimal { optional string pawn_id = 1; optional string race = 2; optional bool can_lay_now = 3; optional double progress = 4; optional double nutrition_per_day = 5; optional double lead_days = 6; optional bool active = 7; optional bool fertilized = 8; }
message PasteDispenser { optional string building_id = 1; optional bool powered = 2; optional double hopper_nutrition = 3; optional string adjacent_room_id = 4; }
// Native twelfths (0..11) whose average tile temperature permits growth.
// The window is climate potential, not a promise of harvestable instances.
message ForagePlant { optional string def_name = 1; repeated int32 growing_twelfths = 2; optional bool growing_now = 3; }
message PenGrazing { optional string pen_id = 1; optional double demand_per_day = 2; optional double pasture_per_day = 3; optional double stored_nutrition = 4; }
message FoodSlaughterAnimal { optional string pawn_id = 1; optional string race = 2; optional double meat_nutrition = 3; optional double feed_per_day = 4; optional double reproduction_days = 5; }
message FoodChannelsFacts { FishableWater fishable_water = 1; repeated GatherableAnimal gatherable = 2; repeated EggLayerAnimal egg_layer = 3; repeated PasteDispenser paste_dispenser = 4; optional uint32 polluted_cells = 5; repeated ForagePlant forage = 6; repeated PenGrazing grazing = 8; repeated FoodSlaughterAnimal slaughter = 9; }
message FoodChannelsSection { oneof outcome { FoodChannelsFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Discovered DeepResourceGrid cells only, merged into eight-connected components
// of the same definition. Centre is the member nearest the component centroid
// (ties by x,z); touching discoveries merge and depleted cells leave the lump.
message DeepResourceLump { optional string def_name = 1; optional int64 count = 2; rimgovernor.common.v1.Cell centre = 3; optional uint32 cell_count = 4; }
// Built player scanners only (empty list means none built). Working means usable
// and used within the last 30 ticks. Ticks-to-next-find estimates remaining work
// to the guaranteed threshold at the last user's speed, excluding idle time and
// the <=59 tick discovery check interval; random finds may happen sooner.
// Timing is absent when native progress/speed or a guaranteed threshold is absent.
message MineralScannerState { optional string building_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool built = 4; optional bool powered = 5; optional bool working = 6; optional int64 ticks_to_next_find = 7; optional string target_resource = 8; }
// Every spawned player deep drill (an observed empty list means none). resource
// and remaining are the native next deposit under the drill's radius; depleted
// means no valuable deposit remains there (vanilla then drills stone only), so a
// lump centre moving as it is mined never implies depletion. Every colonist
// drill is the controller's under autonomous play; there is no ownership
// ledger. designated reports a standing Deconstruct designation on the drill.
message DeepDrillState { optional string building_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool powered = 4; optional string resource = 5; optional int64 remaining = 6; optional bool depleted = 7; optional bool designated = 9; }
// At most 256 lumps and 256 scanners plus drills total; excess/read failure makes the
// section unavailable, never a silently truncated census. Absent section means unknown.
message DeepResourcesFacts { repeated DeepResourceLump lumps = 1; repeated MineralScannerState ground_scanners = 2; repeated MineralScannerState long_range_scanners = 3; repeated DeepDrillState drills = 4; }
message DeepResourcesSection { oneof outcome { DeepResourcesFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Cumulative deliveries counted at the production site of the player's own work
// (a plant harvested, a catch landed, milk or eggs produced), so hauling and
// stack merges never double-count. source_id is the growing zone id (CROP), the
// water body's root cell "x,z" (FISH), the plant def (FORAGE: a harvested plant
// with no zone or basin) or the animal race (ANIMAL_PRODUCT). units are the
// produced stack counts and nutrition their human-edible nutrition; last_tick
// is the game tick of the latest delivery.
enum DeliverySourceKind { DELIVERY_SOURCE_KIND_UNSPECIFIED = 0; DELIVERY_SOURCE_KIND_CROP = 1; DELIVERY_SOURCE_KIND_FISH = 2; DELIVERY_SOURCE_KIND_FORAGE = 3; DELIVERY_SOURCE_KIND_ANIMAL_PRODUCT = 4; }
message DeliveryRow { optional DeliverySourceKind source_kind = 1; optional string source_id = 2; optional string def_name = 3; optional int64 units = 4; optional double nutrition = 5; optional int64 last_tick = 6; }
// Counters only ever grow within one epoch; epoch changes when the game is
// loaded or restarted, so a reader re-baselines. At most 512 keyed rows: later
// keys add to `other` (source_id and def_name "other") and count toward `lost`,
// the number of deliveries that were not keyed. Absent means unknown, never zero.
// A player pawn killed an animal (a hunt, or a slaughter that leaves a corpse).
// corpse_id is the corpse's thing id (the food census's stock id), race the
// animal's def, body_size its body size and potential_nutrition the meat it
// would yield (meat amount x meat nutrition); tick is the game tick of death and
// pawn_id the killed animal's own thing id (a hunt row's source id).
message KillRecord { optional string corpse_id = 1; optional string race = 2; optional double body_size = 3; optional double potential_nutrition = 4; optional int64 tick = 5; optional string pawn_id = 6; }
// A butcher recipe made its products from one corpse, counted where the
// products are made (any bill, any butcher). meat_units and meat_nutrition are
// the produced meat (meat_def) stack and its nutrition, leather_units the
// produced leather; Go links it to its KillRecord by corpse_id.
message ButcherRecord { optional string corpse_id = 1; optional string recipe = 2; optional string meat_def = 3; optional int64 meat_units = 4; optional double meat_nutrition = 5; optional int64 leather_units = 6; optional int64 tick = 7; }
// kills and butchers hold the newest 256 records each in tick order; kills_total
// and butchers_total count every record of the epoch, so a reader sees records
// that fell off the window.
message DeliveryLedgerFacts { optional string epoch = 1; repeated DeliveryRow rows = 2; DeliveryRow other = 3; optional uint64 lost = 4;
  repeated KillRecord kills = 5; repeated ButcherRecord butchers = 6; optional uint64 kills_total = 7; optional uint64 butchers_total = 8; }
message DeliveryLedgerSection { oneof outcome { DeliveryLedgerFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message ColonyFactsSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1; ColonyNaming naming = 2;
  optional uint32 colonist_count = 3; optional uint32 worker_count = 4; rimgovernor.common.v1.Cell center = 5; MapSize map_size = 6;
  optional string biome = 7; repeated Quantity resources = 8; repeated DefinitionRef policy_resources = 9;
  optional double food_nutrition = 10; optional double nutrition_per_day = 11; optional double food_runway_days = 12;
  optional double pending_food_nutrition = 13; optional uint32 bed_capacity = 14; optional uint32 indoor_sleeping_capacity = 15;
  optional double sleeping_temperature_min_c = 16; optional double sleeping_temperature_max_c = 17; optional double outdoor_temperature_c = 18;
  repeated EnvironmentCondition environment = 19; FoodClimate food_climate = 20; repeated FarmFacts farms = 21;
  repeated CookingFacts cooking = 22; repeated AcquisitionFacts acquisition = 23; repeated ButcheringFacts butchering = 24;
  repeated FoodCorpse food_corpses = 25; optional bool food_storage = 26;
  FoodSupplySection food_supply = 28; ForecastSection forecast = 29; UpkeepSection upkeep = 30; DevelopmentSection development = 31;
  PlanningSection planning = 32; RecoveryReply recovery = 33; WasteReply waste = 34; repeated ReadIssue issues = 36;
  optional double pending_wood_units = 37;
  optional uint32 pending_hunts = 38;
  // Player faction TechLevel name (e.g. Neolithic, Industrial); shapes the starter shelter.
  optional string player_tech_level = 39;
  // Present only while exactly one force-pausing choice dialog is open.
  ChoiceDialog dialog = 40;
  // Blighted plants in growing zones or home ground (BlightedPlant); a
  // `blighted_plants` issue withholds the census.
  repeated BlightedPlant blighted_plants = 41;
  // Colony wealth and raid points (ThreatFacts), or why they could not be read.
  ThreatSection threat = 42;
  LootSection event_loot = 43;
  repeated JoinerLetter joiner_letters = 44;
  FoodChannelsSection food_channels = 45;
  DeepResourcesSection deep_resources = 46;
  optional uint32 fermenting_barrels = 47;
  // Every outfit, drug, food and reading policy and every allowed area (#1297).
  PolicySection policies = 49;
  // Biotech pollution sources, wastepacks, gestators, chargers and baby care (#1679); absent without Biotech.
  BiotechSection biotech = 50;
  // TileMutatorDef defNames of the colony map's world tile (Tile.Mutators;
  // #1708), e.g. caves or ancient vents. Empty without Odyssey or with none.
  repeated string tile_mutators = 51;
  // Odyssey eruption, contamination and underground-site state (#1709); absent without Odyssey.
  OdysseySection odyssey = 52;
  // Anomaly containment, knowledge and incident state (#1738); absent without Anomaly.
  AnomalySection anomaly = 53;
  // Royalty neuroformer stock, bestowing ceremonies and thrones (#1877); absent without Royalty.
  RoyaltySection royalty = 54;
  // Cumulative production-site delivery counters (DeliveryLedgerFacts); absent means unknown.
  DeliveryLedgerSection delivery_ledger = 55;
  // Raw hunt facts for policy.HuntGate (#2144); always present on a native read.
  HuntCensus hunt_census = 56;
}
// Odyssey colony facts (#1709), a keyed colony section (#1347). A scalar
// absent is unknown, never zero.
// conditions: every GameCondition active on the colony map, whatever its
// kind (lava flow, volcanic ash or winter, toxic fallout; the class says
// which). hazard_terrain: the terrain defs on the colony map whose own
// flags make them hurt or contaminate (TerrainDef.dangerous, burnDamage,
// heatPerTick or toxicBuildupFactor above zero) with the cells each covers.
// lava_emergences: spawned LavaEmergence things (an eruption's vents).
// sites: each ancient hatch's pocket (underground) map and its hack state.
message OdysseySection { oneof outcome { OdysseyColonyFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message OdysseyColonyFacts {
  repeated ActiveCondition conditions = 1; repeated HazardTerrain hazard_terrain = 2;
  repeated LavaEmergenceState lava_emergences = 3; repeated UndergroundSite sites = 4;
}
// def_name is the GameConditionDef; condition_class the GameCondition
// subclass CLR full name. Permanent conditions carry no ticks_left. causer_id is the
// Thing causing the condition (a toxic spewer, a climate adjuster), absent
// for an event's.
message ActiveCondition {
  optional string condition_id = 1; optional string def_name = 2; optional string condition_class = 3;
  optional int32 ticks_passed = 4; optional int32 ticks_left = 5; optional bool permanent = 6; optional string causer_id = 7;
}
message HazardTerrain {
  optional string def_name = 1; optional uint32 cells = 2; optional bool dangerous = 3;
  optional int32 burn_damage = 4; optional double heat_per_tick = 5; optional double toxic_buildup_factor = 6;
}
message LavaEmergenceState { optional string thing_id = 1; rimgovernor.common.v1.Cell position = 2; }
// One AncientHatch with an existing pocket map: pocket_map_id, the hatch's
// stockpile type and layout (PortalState), the colonists now on the pocket
// map and every CompHackable thing on it.
message UndergroundSite {
  optional string hatch_id = 1; optional int32 pocket_map_id = 2; optional string stockpile_type = 3; optional string layout = 4;
  optional uint32 colonists_present = 5; repeated UndergroundHackable hackables = 6;
}
message UndergroundHackable {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3;
  optional double progress_percent = 4; optional double defence = 5; optional bool hacked = 6; optional bool locked_out = 7; optional bool autohack = 8;
}
// Anomaly colony facts (#1738), a keyed colony section (#1347). Per-thing
// state (an entity's hold and study, a platform's containment strength)
// rides the pawn and building rows (#1737); this section carries what no
// row holds. A scalar absent is unknown, never zero.
// knowledge: one row per KnowledgeCategoryDef. codex: one row per
// EntityCategoryDef; discovered_entries are the EntityCodexEntryDef names
// the colony has discovered. held_entities: each pawn a holding
// platform holds on the colony map, by id, joining the pawn and building
// rows. holding_platform_available: StudyUtility.HoldingPlatformAvailableOnCurrentMap.
message AnomalySection { oneof outcome { AnomalyColonyFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message AnomalyColonyFacts {
  repeated KnowledgeProgress knowledge = 1; repeated CodexProgress codex = 2; repeated string discovered_entries = 3;
  repeated HeldEntity held_entities = 4; optional bool holding_platform_available = 5; AnomalyIncidentState incidents = 6;
}
// current_project is the ResearchProjectDef the research manager funds from
// this category (absent when none is set); knowledge the amount stored for
// it (ResearchManager.GetKnowledge); projects_available whether any project
// of the category can still be researched.
message KnowledgeProgress {
  optional string category = 1; optional string current_project = 2; optional double knowledge = 3; optional bool projects_available = 4;
}
// entries: the codex entries in the category, discovered: those discovered.
message CodexProgress { optional string category = 1; optional uint32 entries = 2; optional uint32 discovered = 3; }
message HeldEntity { optional string pawn_id = 1; optional string platform_id = 2; }
// GameComponent_Anomaly: the state that gates and times the Anomaly
// threats. level_def and level are the monolith's current MonolithLevelDef
// and its number; highest_level_reached the highest it has reached.
// anomaly_threat_fraction_now is the share of threat points the game
// currently gives Anomaly incidents. awoken_corpse_active: an unnatural
// corpse has awoken; metalhorror_implant_possible: the game would allow a
// new metalhorror biosignature implant now.
message AnomalyIncidentState {
  optional bool monolith_spawned = 1; optional string level_def = 2; optional int32 level = 3; optional int32 highest_level_reached = 4;
  optional bool questline_ended = 5; optional int32 ticks_since_level_change = 6; optional bool ambient_horror_mode = 7;
  optional bool anomaly_study_enabled = 8; optional double anomaly_threat_fraction_now = 9; optional bool void_awakening_active = 10;
  optional bool awoken_corpse_active = 11; optional bool metalhorror_implant_possible = 12;
}
// One policy database row: Policy.GetUniqueLoadID(), label, the player
// pawns (colonists, prisoners, slaves, tame animals; any map, caravan or
// transporter) whose current policy it is, and whether it is the
// database default (index 0). allowed_defs is a reading policy's allowed
// book ThingDefs (#1306) or a food policy's allowed food ThingDefs (one of
// PolicyFacts.foods, #1541); empty for the other databases. drug_entries is
// a drug policy's entries that allow anything (joy, addiction, scheduled
// use or a carried count; #1537); every other drug of it is off.
message PolicyEntry { optional string id = 1; optional string label = 2; repeated string pawn_ids = 3; optional bool default = 4; repeated string allowed_defs = 5;
  repeated rimgovernor.operations.v1.DrugPolicyEntry drug_entries = 6; }
// A food ThingDef a food policy can allow (#1541): a nutrition-giving
// ingestible that is no drug and no corpse. Meals carry their
// FoodPreferability tier (awful, simple, fine, lavish) and ingredients
// (FoodUtility.GetFoodKind: meat-only, meat-free or either); raw foods are
// meat by meat source (animal, human, insect), vegetable, fungus or animal
// product; anything else (kibble, pemmican, chocolate) is other.
enum FoodKind {
  FOOD_KIND_UNSPECIFIED = 0; FOOD_KIND_MEAL_AWFUL = 1; FOOD_KIND_MEAL_SIMPLE = 2; FOOD_KIND_MEAL_FINE = 3; FOOD_KIND_MEAL_LAVISH = 4;
  FOOD_KIND_RAW_MEAT = 5; FOOD_KIND_HUMAN_MEAT = 6; FOOD_KIND_INSECT_MEAT = 7; FOOD_KIND_VEGETABLE = 8; FOOD_KIND_FUNGUS = 9;
  FOOD_KIND_ANIMAL_PRODUCT = 10; FOOD_KIND_OTHER = 11;
  // Animal feed (#1543): FoodTypeFlags.Kibble foods and hay (FoodTypeFlags.Plant).
  FOOD_KIND_KIBBLE = 12; FOOD_KIND_HAY = 13;
}
enum MealIngredients { MEAL_INGREDIENTS_UNSPECIFIED = 0; MEAL_INGREDIENTS_ANY = 1; MEAL_INGREDIENTS_MEAT = 2; MEAL_INGREDIENTS_NON_MEAT = 3; }
// Area_Allowed on the colony map: Area.GetUniqueLoadID(), label and the
// pawns restricted to it there.
message AllowedAreaEntry { optional string id = 1; optional string label = 2; repeated string pawn_ids = 3; }
message PolicyFacts {
  repeated PolicyEntry outfit = 1; repeated PolicyEntry drug = 2; repeated PolicyEntry food = 3; repeated PolicyEntry reading = 4;
  repeated AllowedAreaEntry allowed_areas = 5;
  // HediffDef defNames of the colony map biome's disease incidents
  // (BiomeDef.diseases; #1539), e.g. Malaria, Plague.
  repeated string biome_diseases = 7;
  repeated FoodEater food_eaters = 9;
}
// A food policy holder outside the work census (#1543): a prisoner of the
// colony or a tame animal on the colony map with a food policy. A prisoner
// carries its diet inputs (trait defNames, its ideoligion's precept
// defNames); the food an animal's race can ever eat is its catalog race row's.
enum FoodEaterKind { FOOD_EATER_KIND_UNSPECIFIED = 0; FOOD_EATER_KIND_PRISONER = 1; FOOD_EATER_KIND_ANIMAL = 2; }
message FoodEater { optional string pawn_id = 1; optional FoodEaterKind kind = 2; repeated string precepts = 4; repeated Trait pawn_traits = 6; }
message PolicySection { oneof outcome { PolicyFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
// Biotech colony facts (#1679), a keyed colony section (#1347). The pollution
// cell grid is a separate code; pollution here is its totals plus what makes
// and removes it. Every row is a spawned player-map thing; a scalar absent
// is unknown, never zero.
// pollution: PollutionGrid totals (total_pollution is PollutionGrid.TotalPollution,
// pollutable_cells the count of AllPollutableCells) and the player's
// Area_PollutionClear (the cleanup crew's allowed area, clear_area_cells its
// size). polluters: buildings with CompToxifier or CompPolluteOverTime.
// wastepacks: spawned stacks of things with CompDissolution, which turn into
// pollution when they dissolve. atomizers and pumps remove waste and
// pollution (pumps: CompPollutionPump, off while disabled_by_artificial_buildings). gestators, chargers: Building_MechGestator and
// Building_MechCharger, the producers of wastepacks. babies: each player
// pawn whose developmental stage is Newborn or Baby; breastfeeders are the
// pawns ChildcareUtility.CanBreastfeedPlayerPawns lists (pawn ids).
message BiotechSection { oneof outcome { BiotechColonyFacts observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; } }
message BiotechColonyFacts {
  PollutionTotals pollution = 1;
  repeated Polluter polluters = 2; repeated Wastepack wastepacks = 3;
  repeated WastepackAtomizer atomizers = 4; repeated PollutionPump pumps = 5;
  repeated MechGestatorState gestators = 6; repeated MechChargerState chargers = 7;
  repeated BabyCare babies = 8; repeated string breastfeeders = 9;
  // Gene-building rows (#1930): the banks, assemblers, extractors, genepacks
  // and xenogerms of the colony map.
  repeated GeneBankState gene_banks = 10; repeated GeneAssemblerState gene_assemblers = 11; repeated GeneExtractorState gene_extractors = 12;
  repeated GenepackState genepacks = 13; repeated XenogermState xenogerms = 14;
}
// Gene-building rows (#1930). A pawn or thing reference is a thing id. gene
// lists are GeneDef defNames, sorted; complexity, metabolism and archites are
// the game's own GeneSet totals (ComplexityTotal, MetabolismTotal,
// ArchitesTotal), never summed in Go.
// GeneBankState: a building with CompGenepackContainer. capacity is
// CompProperties_GenepackContainer.maxCapacity, pack_ids the contained
// packs, auto_load the container's own flag.
message GeneBankState {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool powered = 4;
  optional int32 capacity = 5; repeated string pack_ids = 6; optional bool auto_load = 7;
}
// GeneAssemblerState: Building_GeneAssembler. working is Working; the run
// fields (progress, total_work, pack_ids, archites_owed, can_work_now) are
// set only while working. max_complexity is MaxComplexity(), archites_owed
// ArchitesRequiredNow, can_work_now CanBeWorkedOnNow, linked_bank_ids the
// connected facilities that hold a genepack container.
message GeneAssemblerState {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool powered = 4;
  optional bool working = 5; optional double progress = 6; optional double total_work = 7; repeated string pack_ids = 8;
  optional int32 archites_owed = 9; optional int32 max_complexity = 10; repeated string linked_bank_ids = 11; optional bool can_work_now = 12;
}
// GeneExtractorState: Building_GeneExtractor. selected_pawn_id is
// Building_Enterable.SelectedPawn, occupant_id the pawn inside; ticks_remaining
// and power_cut_ticks are set only while working.
message GeneExtractorState {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool powered = 4;
  optional bool working = 5; optional string selected_pawn_id = 6; optional string occupant_id = 7;
  optional int32 ticks_remaining = 8; optional int32 power_cut_ticks = 9;
}
// GenepackState: a Genepack, in a bank (bank_id, no position) or spawned
// loose (position). deteriorating is Genepack.Deteriorating.
message GenepackState {
  optional string thing_id = 1; optional string def_name = 2; repeated string genes = 3; optional string bank_id = 4;
  rimgovernor.common.v1.Cell position = 5; optional bool deteriorating = 6; optional bool auto_load = 7; optional int32 hit_points = 8;
  optional int32 complexity = 9; optional int32 metabolism = 10; optional int32 archites = 11;
}
// XenogermState: a spawned Xenogerm item; target_pawn_id is its pending
// implant target.
message XenogermState {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3;
  repeated string genes = 4; optional string target_pawn_id = 5;
  optional int32 complexity = 6; optional int32 metabolism = 7; optional int32 archites = 8; optional bool forbidden = 9;
  // implant_metabolism: GeneUtility.MetabolismAfterImplanting per colonist, slave or
  // colony prisoner on the map (the game's number; the implant is refused below the
  // biostat range minimum), sorted by pawn id.
  repeated XenogermImplantMetabolism implant_metabolism = 10;
}
message XenogermImplantMetabolism { optional string pawn_id = 1; optional int32 metabolism_after = 2; }
message PollutionTotals {
  optional int32 total_pollution = 1; optional uint32 pollutable_cells = 2;
  optional string clear_area_id = 3; optional int32 clear_area_cells = 4;
  // polluted_cells counts the pollutable cells PollutionGrid.IsPolluted holds;
  // polluted_uncovered_cells those outside the pollution-clear area (#1683).
  optional uint32 polluted_cells = 5; optional uint32 polluted_uncovered_cells = 6;
}
// polluting is CompToxifier.CanPolluteNow; cells_per_day is
// CompProperties_PolluteOverTime.cellsToPollutePerDay.
message Polluter {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3;
  optional bool polluting = 4; optional int32 cells_per_day = 5;
}
// frozen, outdoors, in_atomizer and can_dissolve_now are CompDissolution's
// own verdicts; deterioration_rate is CompDissolution.DeterioarationRate.
message Wastepack {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional int32 count = 4;
  optional bool frozen = 5; optional bool outdoors = 6; optional bool in_atomizer = 7; optional bool can_dissolve_now = 8;
  optional int32 deterioration_rate = 9; optional bool forbidden = 10;
}
// Building_WastepackAtomizer: its CompAtomizer's room and progress.
message WastepackAtomizer {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool powered = 4;
  optional int32 space_left = 5; optional double fill_percent = 6; optional bool auto_load = 7; optional int32 ticks_left = 8;
}
message PollutionPump { optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool powered = 4; optional bool disabled_by_artificial_buildings = 5; }
// state is the active Bill_Mech's FormingState name (Gathering, Preparing,
// Forming, Formed), absent with no bill. bound_pawn_id is the mech being
// gestated, mech_kind its PawnKindDef; forming_percent is
// CurrentBillFormingPercent. waste_count is the wastepacks held in the
// gestator's CompWasteProducer.
message MechGestatorState {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool powered = 4;
  optional string bill_id = 5; optional string state = 6; optional string mech_kind = 7; optional string bound_pawn_id = 8;
  optional int32 cycles_completed = 9; optional double bandwidth_cost = 10; optional double forming_percent = 11; optional int32 waste_count = 12;
}
// full_of_waste is Building_MechCharger.IsFullOfWaste.
message MechChargerState {
  optional string thing_id = 1; optional string def_name = 2; rimgovernor.common.v1.Cell position = 3; optional bool powered = 4;
  optional string charging_mech_id = 5; optional int32 waste_count = 6; optional bool full_of_waste = 7;
}
// wants_suckle, can_suckle_now and being_played_with are ChildcareUtility's
// verdicts; autofeeders are the feeders with an AutofeedMode set for the baby
// (Pawn_MindState.Autofeeders, mode the AutofeedMode name).
message BabyCare {
  optional string pawn_id = 1; optional bool wants_suckle = 2; optional bool can_suckle_now = 3; optional bool being_played_with = 4;
  optional bool in_bed = 5; repeated BabyAutofeeder autofeeders = 6;
}
message BabyAutofeeder { optional string pawn_id = 1; optional string mode = 2; }
// Current-map WandererJoins offers and creepjoiner offers (creepjoiner true, #1740); the token binds letter, quest, pawn and expiry. expires_tick is the letter's disappearAtTick, negative for no timeout.
message JoinerLetter { optional int32 letter_id = 1; optional string snapshot_token = 2; optional string pawn_id = 3; optional int64 expires_tick = 4; optional string accept_label = 5; optional bool can_accept = 6; optional bool creepjoiner = 7; }
message ColonyFactsRequest { ReadScope scope = 1; optional bool planning = 2; }
message ColonyFactsReply { oneof outcome { ColonyFactsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }

// Simulation status excludes notifications/UI/clock, exposed by their typed owners.
// ThreatPawn is one living non-colonist pawn's threat facts (#1356): the
// native emits facts, Go classifies them (bridge.ClassifyThreat). A row is
// emitted for a pawn in a mental state, of a faction hostile to the
// player, breaking out of prison (#1080) or on a PredatorHunt job, and for
// an unowned downed pawn or predator within the requested predator radius
// of a colonist; any other pawn costs one field read and no row (#646).
// pawn references the bundle's pawn table row (#1343); ours is a
// player-faction pawn; faction_id is set with faction_hostile (a held
// prisoner is never faction_hostile). prey is a PredatorHunt's target pawn
// (a corpse's inner pawn), prey_is_ours a player-owned or player-held prey.
// passive (#948, #1335, on ThreatPawn and ThreatBuilding) is set for
// faction-hostile insects and hives (dormant, or awake but not engaging)
// and other CompCanBeDormant hostiles (asleep); a passive threat is left
// alone, never held for or attacked. nearest_colonist_distance is
// Chebyshev cells to the nearest free colonist, absent with none.
message ThreatPawn { rimgovernor.common.v1.Ref prey = 2; optional bool prey_is_ours = 3; optional bool ours = 4; optional bool passive = 6;
  rimgovernor.common.v1.Ref pawn = 7; optional double nearest_colonist_distance = 9; optional string mental_state = 10; optional bool faction_hostile = 11; rimgovernor.common.v1.Ref faction = 12;
  optional bool prison_break = 13; optional bool predator_hunt = 14; optional bool predator = 15; optional bool downed = 16; }
// A hostile-faction building that is itself a combat target (an insect hive,
// a crashed ship part, a mech-cluster piece with combat power): its own CAS
// token rides on building.snapshot for Operations.AttackTarget, and
// nearest_colonist_distance is Chebyshev cells like a threat pawn's;
// occupied is the building's occupied rect (inclusive), the cells a
// ranged defender needs a line of fire to.
// mortar (#1148) is a turret whose verb fires mortar shells.
// A hostile building's row: building is its head (no table holds hostile
// buildings) and building_snapshot its CAS token (#1342).
message ThreatBuilding { EntityRef building = 1; SnapshotRef building_snapshot = 10; optional string hostile_reason = 2; optional int32 hit_points = 3; optional int32 max_hit_points = 4; optional int32 nearest_colonist_distance = 5; optional bool passive = 7; optional bool mortar = 8; Rectangle occupied = 9; }
message ThreatsSnapshot { repeated ThreatPawn pawns = 8; repeated ThreatBuilding hostile_buildings = 7; }
// colonists references every spawned free colonist's pawn table row
// (#1343), complete unless issues name "colonists".
message StatusSnapshot { rimgovernor.common.v1.ObservationContext context = 1; ThreatsSnapshot threats = 3; repeated ReadIssue issues = 4; repeated rimgovernor.common.v1.Ref colonists = 5; }
message StatusRequest { ReadScope scope = 1; optional bool colonists = 2; optional bool threats = 3; optional double predator_radius = 5; }
message StatusReply { oneof outcome { StatusSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// A snapshot stream frame, and the scheduler's step read the controller
// composes (clock_status is set only there: frames never carry it).
message BundleSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1;
  optional bool paused = 2;
  rimgovernor.clock.v1.Status clock_status = 3;
  StatusSnapshot emergency = 4;
  ColonyFactsSnapshot colony_facts = 6;
  PopulationSnapshot population = 7;
  ResearchSnapshot research = 8;
  // The pawn table (35) replaces the colonist detail section (#1343).
  BuildingsSnapshot buildings = 10;
  BillsSnapshot bills = 12;
  ZonesSnapshot zones = 13;
  TradersSnapshot traders = 14;
  WorldProgressionSnapshot world_progression = 15;
  repeated ResourceSourcesSnapshot resource_sources = 16;
  // The planning window band (17) is cut from grid (#1345).
  // Combat state (#851), while the map has an active hostile or a combat
  // epoch runs, else empty: every spawned colonist, hostile and colony
  // animal, and the native's retained event ring (the newest 1024
  // events, oldest first). A reader merges events by their watermark, so
  // a lapped or restarted reader resyncs from any frame.
  repeated rimgovernor.mirror.v1.CombatPawn combat_pawns = 20;
  repeated rimgovernor.mirror.v1.CombatEventRow combat_events = 21;
  // The defense planner's other combat inputs (#853), in the same frame,
  // while the emergency census lists a threat or a colonist in a mental
  // state, else unset. The pawn table carries the combat detail (health,
  // equipment, biography, animals) of every hostile and hunting predator
  // (#1343). combat_lines_of_fire is read_lines_of_fire from every colonist cell
  // with a ranged primary to every hostile building's occupied cells, at
  // most 64 cells a side, unset when either side is empty.
  LinesOfFireSnapshot combat_lines_of_fire = 23;
  // Combat rooms (#897) are read from the rooms census (27).
  // Every damaged spawned player door (#900), with the combat inputs, at most
  // 64: the doors a fight may send a gunner to repair.
  repeated rimgovernor.mirror.v1.CombatDoorRow combat_doors = 25;
  // Planning definitions are the definition catalog's (#1340).
  // list_rooms without outdoor rooms or boundary buildings, with cells:
  // the room census temperature, comfort and hospital planning read (#944).
  RoomsSnapshot rooms = 27;
  // Every spawned unroofed player mortar (#931), with the combat inputs, at
  // most 16: the guns a fight may crew for counter-battery.
  repeated rimgovernor.mirror.v1.CombatMortarRow combat_mortars = 28;
  // The outdoor temperature a fight shelters from (#1077) is
  // colony_facts.outdoor_temperature_c.
  // The hottest live hive's cell temperature in degrees Celsius (#1073),
  // with the combat inputs: an infestation's heat-stroke hold and entry check.
  optional float combat_hive_temperature_c = 30;
  // The watermark of every omittable section (#1347), carried or not:
  // emergency, colony_facts, population, research, traders,
  // world_progression and ideology. Native omits such a section while its content,
  // nested context ticks aside, matches the last one published, and the
  // reader keeps that one, current at this frame's tick. A section absent
  // with a seq other than the one the reader holds was published in a
  // frame the reader missed: it asks for a keyframe.
  repeated SectionWatermark watermarks = 31;
  // The pawn table (#1343): every spawned pawn on the map, the rows every
  // other section's pawn reference resolves against. A free colonist
  // carries every detail family but tend; a hostile or hunting predator
  // the emergency census lists the combat detail; another animal its
  // animal state; any other pawn the core row.
  PawnSnapshot pawns = 35;
  // The things table (#1343): every thing a food stock in colony_facts
  // references, the rows those references resolve against.
  ThingsSnapshot things = 36;
  // The whole map as a cell grid (#1345), every frame: a keyframe on an
  // open or keyframe request, on a map change and at least every 30
  // seconds, else a delta against that keyframe. keyframe_seq numbers
  // keyframes since the stream opened; a delta whose keyframe_seq is not
  // the keyframe the reader holds follows a keyframe it missed: it asks
  // for a keyframe. sky_glow is the map's sky light (0..1), which grid
  // glow leaves out.
  rimgovernor.mirror.v1.CellGrid grid = 32;
  optional uint64 keyframe_seq = 33;
  optional double sky_glow = 34;
  // The player faction's primary ideoligion as it stands (#1654): the
  // precepts and roles in force, ritual state and building precepts.
  // Omittable like the singleton sections above (watermark "ideology");
  // absent, with no watermark, without Ideology or a primary ideoligion.
  IdeologySnapshot ideology = 37;
  // A frame whose section read threw (#1905): the frame carries only this,
  // with the section name, exception type and message in detail. A reader
  // refuses the read naming the section; the frame is never carried on
  // with the section omitted.
  optional rimgovernor.common.v1.Failure failure = 38;
  // ModsConfig.IdeologyActive (#1922), carried on every frame: false means the
  // Ideology expansion is not installed, so an absent ideology section is not
  // an unread ideoligion. Absent stays unknown (unread).
  optional bool ideology_active = 39;
}
// seq counts a section's changes since the stream opened; captured_tick is
// the tick of the frame that last carried it.
// A keyed table section (pawns, buildings, things; #1348) is a keyframe,
// carrying every row, unless delta is set: then it carries only the rows
// whose content changed or appeared since the table at base_seq, plus the
// ids that left it in removed, and the reader merges it into the table it
// holds at base_seq (a different held seq is a gap: it asks for a keyframe).
// An unchanged table is omitted like a singleton section.
message SectionWatermark { optional string section = 1; optional uint64 seq = 2; optional int64 captured_tick = 3; optional bool delta = 4; optional uint64 base_seq = 5; }
message ObservationBatchSnapshot {
  rimgovernor.common.v1.ObservationContext start_context = 1; rimgovernor.common.v1.ObservationContext end_context = 2;
  StatusReply status_before = 3; ListPawnsReply pawns = 4; ListSuppliesReply supplies = 5;
  ListBuildingsReply buildings = 6; ListRoomsReply rooms = 7; ListZonesReply zones = 8; StatusReply status_after = 9;
}
message ObservationBatchRequest { ReadScope scope = 1; StatusRequest status = 2; ListPawnsRequest pawns = 3; ListSuppliesRequest supplies = 4; ListBuildingsRequest buildings = 5; ListRoomsRequest rooms = 6; ListZonesRequest zones = 7; }
message ObservationBatchReply { oneof outcome { ObservationBatchSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }

message ArchitectCategory { optional string id = 1; optional string label = 2; optional bool visible = 3; optional bool enabled = 4; optional uint32 designator_count = 5; }
message ArchitectDesignator {
  optional string id = 1; optional string category_id = 2; optional string label = 3;
  optional string buildable_def_name = 4; optional string buildable_label = 5;
  optional string application_kind = 6; optional bool supports_cell = 7; optional bool supports_rectangle = 8;
  optional bool visible = 9; optional bool enabled = 10; optional string disabled_reason = 11;
}
message ArchitectCategoriesSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated ArchitectCategory categories = 2; }
message ArchitectCategoriesRequest { ReadScope scope = 1; optional bool include_empty = 2; optional bool include_hidden = 3; }
message ArchitectCategoriesReply { oneof outcome { ArchitectCategoriesSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message ArchitectDesignatorsSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated ArchitectDesignator designators = 2; }
message ArchitectDesignatorsRequest { ReadScope scope = 1; optional string category_id = 2; optional bool include_hidden = 3; }
message ArchitectDesignatorsReply { oneof outcome { ArchitectDesignatorsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }

// The snapshot stream (#858): native publishes whole BundleSnapshot frames
// into a named shared-memory ring and signals a named event; this request
// opens it (or replaces its subscription) and names the ring. A frame carries
// every state family whole (no page caps, no field masks) plus the
// subscription's resource sources, and the whole map as a
// cell grid. Clock status stays a dedicated read.
message SnapshotStreamRequest {
  repeated string resource_sources = 1; // list_resource_sources per named resource, no development
  // Only makes the next frame a keyframe, carrying every section (#1347);
  // the subscription and the other fields are left as they are. Every
  // other open is a keyframe too.
  optional bool keyframe = 4;
}
// The definition catalog (#1340): the generated def rows and the stat table
// the planning views read (#1731), and every research project with its static
// facts (costs, prerequisites, tab, tech level, required bench). It is fixed
// for a load: the controller reads it once per load token.
message DefinitionCatalog { rimgovernor.common.v1.ObservationContext context = 1; repeated ResearchProject research = 3;
  // Biotech defs (#1678); absent without Biotech.
  BiotechCatalog biotech = 4;
  // The Ideology defs are rows of `defs` (MemeDef, PreceptDef, RitualPatternDef,
  // RitualBehaviorDef); field 5 carried the hand-written IdeologyCatalog.
  reserved 5;
  reserved "ideology";
  // The Odyssey defs (#1708); absent without Odyssey.
  OdysseyCatalog odyssey = 6;
  // The Anomaly defs (#1737); absent without Anomaly.
  AnomalyCatalog anomaly = 7;
  // Every ThingDef and TerrainDef with all of its fields, by defName (#1730):
  // the messages of defs.proto, filled by protobuf reflection over the game's
  // def objects (field name = CLR field name). Unlike `definitions` it is not
  // filtered to buildable or sowable defs.
  repeated rimgovernor.defs.v1.ThingDef thing_defs = 8;
  repeated rimgovernor.defs.v1.TerrainDef terrain_defs = 9;
  CatalogConstants constants = 10;
  // The game's own stat values per def and stuff (#1759); absent in a reply
  // that carries none.
  DefStatTable stat_values = 11;
  // Every def of every other concrete Verse.Def class (#1761), one repeated
  // field per class, filled the same way.
  rimgovernor.defs.v1.DefSets defs = 12;
  // The base classes of every class the def rows name: the class of each
  // mirrored object (each def's own class among them) and each System.Type
  // value in a row (worker, condition, thing classes), sorted by name. Go
  // matches a family against it (`DefinitionCatalog.ClassIsA`) with no name list.
  repeated ClassChain class_chains = 13;
  // What the game's own code says about every ThingDef, computed once per
  // load (#1733); Go reads it and never ports the rule.
  repeated ThingDefFacts thing_facts = 14;
}
// A class by CLR full name and its base classes, nearest first, up to but not
// including System.Object.
message ClassChain { string name = 1; repeated string bases = 2; }
// One ThingDef's game-computed flags. `food_kind` is set for a food a policy
// can allow (a nutrition-giving ingestible that is no drug and no corpse):
// meals by FoodPreferability, then kibble, hay, meat by FoodUtility
// .GetMeatSourceCategory, IsFungus, IsAnimalProduct, a vegetable or fruit food
// type, else other. `meal_ingredients` is set on meals only
// (FoodUtility.GetFoodKind). `raw_meat` is ThingDef.IsMeat and `medicine` is
// ThingDef.IsMedicine. `room_roles` are the furniture roles the game's own
// room-role code scores the def for by name (#1731): Toy (ThingDefOf.ToyBox),
// Decoration (BabyDecoration), Board (Blackboard) and Desk (SchoolDesk), sorted;
// the roles the rows derive (baby beds, deathrest) are Go's.
message ThingDefFacts {
  string def_name = 1;
  optional FoodKind food_kind = 2;
  optional MealIngredients meal_ingredients = 3;
  bool raw_meat = 4;
  bool medicine = 5;
  repeated string room_roles = 6;
  // Set on a def with RaceProperties (#1722).
  optional RaceFacts race = 7;
}
// What the game's own race code says about one race, computed once per load
// (#1722); the race's numbers (body size, life expectancy, predator, the
// manhunter chances, wildness, minimum handling skill, products, meat) are the
// def rows and the stat table, not copied here. `animal` is RaceProperties
// .Animal, `mechanoid` .IsMechanoid and `insect` .Insect. `trainables` are the
// TrainableDefs the race can ever learn (Pawn_TrainingTracker.CanAssignToTrain's
// race rules: trainability rank, minimum body size, the tag lists) and
// `edible_defs` the foods (ThingDefFacts.food_kind set) RaceProperties
// .CanEverEat accepts, both sorted.
message RaceFacts {
  bool animal = 1;
  bool mechanoid = 2;
  bool insect = 3;
  repeated string trainables = 4;
  repeated string edible_defs = 5;
}
// GetStatValueAbstract(stat, stuff) of every StatDef the game shows for a def,
// for every ThingDef: once per allowed stuff for a def made from stuff, once
// with no stuff otherwise (#1759). Stat rules are game code; Go looks values up
// and never recomputes them. `stats` is the shared table of stat defNames.
message DefStatTable {
  repeated string stats = 1;
  repeated DefStatRow rows = 2;
  // The same rows for every TerrainDef, `stuff_name` empty (a terrain defName
  // may also name a ThingDef, so the two are kept apart). `costs` is the terrain's
  // adjusted cost list (BuildableDef.CostListAdjusted(null)), empty for a free floor.
  repeated DefStatRow terrain_rows = 3;
}
// One (def, stuff) pair: `stat[i]` indexes DefStatTable.stats and `value[i]` is
// its value (parallel arrays, equal length). A stat the game does not show for
// the def (StatWorker.ShouldShowFor) is absent from the row, not zero. `stuff`
// is empty for a def not made from stuff. `costs` is the game's
// ThingDef.CostListAdjusted(stuff): the material list with stuff volume and
// difficulty adjustments applied, empty for a def with no cost.
message DefStatRow {
  string def_name = 1;
  string stuff_name = 2;
  repeated int32 stat = 3;
  repeated float value = 4;
  repeated Quantity costs = 5;
}
// Game constants read from the game assemblies, never typed in (#1730).
message CatalogConstants {
  // GenDate.TicksPerHour, TicksPerDay and DaysPerYear.
  int32 ticks_per_hour = 1;
  int32 ticks_per_day = 2;
  int32 days_per_year = 3;
  // BillStack.MaxCount.
  int32 bill_stack_max = 4;
  // SkillRecord.MaxLevel.
  int32 skill_max_level = 5;
  // GlowGrid.GameGlowLitThreshold (a non-public const): the glow at or above
  // which a cell counts as lit.
  float lit_glow_threshold = 6;
  // The defName of ThingDefOf.Silver: the def Tradeable.IsCurrency tests, so
  // the coin every price and the colony census count in.
  string currency_def = 7;
  // The temperature (C) at which GenTemperature.RotRateAtTemperature first
  // reaches its full rate of 1, found by evaluating the game's own function:
  // food stored at or below it rots slower than the full rate.
  float full_rot_rate_c = 8;
  // RoofCollapseUtility.RoofMaxSupportDistance (a public const read from the
  // assembly, not inlined): how far a roofed cell may lie from a roof holder
  // before the game collapses it.
  float roof_max_support_distance = 9;
  // The defName of ThingDefOf.Wort: what Building_FermentingBarrel takes in
  // and turns into ThingDefOf.Beer (#1721), so the beer reserve names the
  // intermediate without typing it.
  string wort_def = 10;
}
// The player faction's primary ideoligion (#1654): FactionIdeosTracker.PrimaryIdeo.
// Precept ids are Precept.GetUniqueLoadID(); every def name resolves to a
// catalog def row (PreceptDef, MemeDef, RitualPatternDef).
message IdeologySnapshot { rimgovernor.common.v1.ObservationContext context = 1; optional string ideo_id = 2; repeated string memes = 3;
  repeated IdeoPrecept precepts = 4; repeated IdeoRole roles = 5; repeated IdeoRitual rituals = 6; repeated IdeoBuilding buildings = 7;
  // Ideo.ObligationsActive, Ideo.ColonistBelieverCountCached and
  // Ideo.MinBelieversToEnableObligations.
  optional bool obligations_active = 8; optional int32 believers = 9; optional int32 min_believers_for_obligations = 10; }
// A precept in force, role, ritual and building precepts excluded.
message IdeoPrecept { optional string id = 1; optional string def_name = 2; }
// A role precept: whether it is active (enough believers) and the pawns
// holding it (Precept_Role.ChosenPawns), each a pawn row ref.
message IdeoRole { optional string id = 1; optional string def_name = 2; optional bool active = 3; repeated rimgovernor.common.v1.Ref pawns = 4; }
// A ritual precept: its PreceptDef and RitualPatternDef (sourcePattern), the
// raw Precept_Ritual.lastFinishedTick, the count of active obligations,
// whether the repeat penalty applies and whether a LordJob_Ritual of the
// precept is running now (#1660).
message IdeoRitual { optional string id = 1; optional string def_name = 2; optional string pattern = 3; optional int32 last_finished_tick = 4; optional int32 active_obligations = 5; optional bool repeat_penalty_active = 6; optional bool running = 7; }
// A building precept: the ThingDef it takes.
message IdeoBuilding { optional string id = 1; optional string def_name = 2; optional string building = 3; }
// The static Biotech defs, each list sorted by name (#1678). A stat effect is
// a StatModifier of the def: stat is the StatDef name; factor and offset are
// set for the side it carries. Scalars are absent when native could not read
// them. Effects are the game defs' own (never Go name lists): the controller
// reads them once per load token.
message StatEffect { optional string stat = 1; optional double factor = 2; optional double offset = 3; }
message SkillLevel { optional string skill = 1; optional int32 level = 2; }
message CapacityEffect { optional string capacity = 1; optional double offset = 2; optional double set_max = 3; optional double post_factor = 4; }
// LifeStageDef: developmental_stage is the DevelopmentalStage name,
// reproductive/always_downed/claimable/can_voluntarily_sleep and
// involuntary_sleep_is_negative_event are the def's flags, and effects its
// statOffsets and statFactors.
message LifeStageRow {
  optional string def_name = 1; optional string label = 2; optional string developmental_stage = 3;
  optional bool reproductive = 4; optional bool always_downed = 5; optional bool claimable = 6; optional bool can_voluntarily_sleep = 7;
  optional bool involuntary_sleep_is_negative_event = 8; repeated StatEffect effects = 9;
  optional double hunger_rate_factor = 10; optional double body_size_factor = 11; optional double health_scale_factor = 12;
}
// RaceProperties.lifeStageAges of a humanlike race: each stage with the age
// (years) it begins, ascending, and lifeStageWorkSettings: the minimum age of
// each work type a young pawn may do (a work type missing from the list has
// no minimum).
message LifeStageAgeRow { optional string life_stage = 1; optional double min_age_years = 2; }
message WorkMinAge { optional string work_type = 1; optional int32 min_age = 2; }
message RaceLifeStages { optional string race = 1; repeated LifeStageAgeRow stages = 2; repeated WorkMinAge work_min_ages = 3; }
// GeneDef: complexity, metabolism and archite are biostatCpx, biostatMet and
// biostatArc; disabled_work_tags are the WorkTags names the gene disables;
// effects its statOffsets and statFactors; aptitudes the skill levels it
// adds; passion_mods the skills whose passion it changes (mod_type is the
// PassionModType name); capacity_effects its capMods; enables_needs and
// disables_needs the NeedDefs it turns on or off; forced_traits and
// suppressed_traits the TraitDefs; make_immune_to the HediffDefs it
// immunizes against. Chemical tolerance: chemical is the ChemicalDef of a
// dependency or tolerance gene with the three chance factors; the rest are
// the def's own fields (min_age_active years, pain_offset and pain_factor,
// exclusion_tags).
message GeneRow {
  optional string def_name = 1; optional string label = 2; optional string category = 3;
  optional int32 complexity = 4; optional int32 metabolism = 5; optional int32 archite = 6;
  repeated string disabled_work_tags = 7; repeated StatEffect effects = 8; repeated SkillLevel aptitudes = 9;
  repeated PassionEffect passion_mods = 10; repeated CapacityEffect capacity_effects = 11;
  repeated string enables_needs = 12; repeated string disables_needs = 13;
  repeated string forced_traits = 14; repeated string suppressed_traits = 15; repeated string make_immune_to = 16;
  optional string chemical = 17; optional double addiction_chance_factor = 18; optional double overdose_chance_factor = 19; optional double tolerance_buildup_factor = 20;
  optional double min_age_active = 21; optional double pain_offset = 22; optional double pain_factor = 23;
  repeated string exclusion_tags = 24;
}
message PassionEffect { optional string skill = 1; optional string mod_type = 2; }
// XenotypeDef: genes are the GeneDef names it carries.
message XenotypeRow { optional string def_name = 1; optional string label = 2; optional bool inheritable = 3; repeated string genes = 4; }
message MechWorkPriority { optional string work_type = 1; optional int32 priority = 2; }
// A controllable mech kind: a PawnKindDef whose race is a mechanoid with an
// overseer-subject comp. weight_class is the MechWeightClassDef;
// bandwidth_cost the BandwidthCost stat of the race; max_energy and
// fixed_skill_level the race's maxMechEnergy and mechFixedSkillLevel;
// work_types the mechEnabledWorkTypes and work_priorities the
// mechWorkTypePriorities (priority per work type); work_mech whether the race
// does work.
message MechKindRow {
  optional string def_name = 1; optional string label = 2; optional string race = 3; optional string weight_class = 4;
  optional double bandwidth_cost = 5; optional int32 max_energy = 6; optional int32 fixed_skill_level = 7;
  repeated string work_types = 8; repeated MechWorkPriority work_priorities = 9; optional bool work_mech = 10; optional double body_size = 11; optional double combat_power = 12;
}
// MechWorkModeDef: ui_order sorts the command UI; ignore_group_charge_limits
// the def's flag.
// work, escort and recharge are the game's own roles: def ==
// MechWorkModeDefOf.Work, .Escort and .Recharge; each is set on exactly one row.
message MechWorkModeRow {
  optional string def_name = 1; optional string label = 2; optional int32 ui_order = 3; optional bool ignore_group_charge_limits = 4;
  optional bool recharge = 5; optional bool work = 6; optional bool escort = 7;
}
// One point of a game SimpleCurve (#1932).
message CurvePointRow { optional double x = 1; optional double y = 2; }
// The Biotech tuning constants the defs do not carry (#1932), read natively
// from GeneTuning and the gene extractor, a singleton per load.
// biostat_min and biostat_max are GeneTuning.BiostatRange (the metabolism
// bound of a gene set); base_max_complexity GeneTuning.BaseMaxComplexity;
// creation_hours_curve ComplexityToCreationHoursCurve (complexity to hours of
// assembler work, ascending x); regrow_days_min and regrow_days_max
// GeneExtractorRegrowingDurationDaysRange; extract_ticks the extractor's
// TicksToExtract and no_power_eject_ticks its cumulative power-cut limit
// (private constants read by reflection, absent when unreadable). An absent
// scalar is unknown, never zero.
message GeneTuningFacts {
  optional int32 biostat_min = 1; optional int32 biostat_max = 2; optional int32 base_max_complexity = 3;
  repeated CurvePointRow creation_hours_curve = 4;
  optional double regrow_days_min = 5; optional double regrow_days_max = 6;
  optional int32 extract_ticks = 7; optional int32 no_power_eject_ticks = 8;
}
message BiotechCatalog {
  repeated LifeStageRow life_stages = 1; repeated RaceLifeStages races = 2; repeated GeneRow genes = 3; repeated XenotypeRow xenotypes = 4;
  repeated MechKindRow mech_kinds = 5; repeated MechWorkModeRow mech_work_modes = 6;
  GeneTuningFacts gene_tuning = 7;
}
// The Odyssey facts the def mirror (defs.proto) cannot give (#1708, #1791).
// Biome, tile mutator, hackable and portal defs are the mirror's BiomeDef,
// TileMutatorDef, CompProperties_Hackable and MapPortalProperties rows, and
// the biome diseases its BiomeDef.diseases; none is repeated here. What
// remains is derived natively: the wild animal tables per biome (the game
// joins BiomeDef.wildAnimals with each race's wildBiomes) and the stockpile
// type enum, which no def carries. Absent without Odyssey.
message OdysseyCatalog {
  repeated BiomeAnimals biome_animals = 6; repeated StockpileTypeRow stockpile_types = 5;
}
// A wild animal kind in a biome and its commonality there.
message BiomeAnimal { optional string kind = 1; optional double commonality = 2; }
// One BiomeDef's animal kinds with a nonzero commonality, split by the
// inland, pollution and coastal tables; biome names the BiomeDef.
message BiomeAnimals {
  optional string biome = 1;
  repeated BiomeAnimal wild_animals = 2; repeated BiomeAnimal pollution_wild_animals = 3; repeated BiomeAnimal coastal_wild_animals = 4;
}
// One value of the stockpile type enum an ancient hatch carries;
// generatable: the world generator may place it.
message StockpileTypeRow { optional string name = 1; optional bool generatable = 2; }
// Odyssey facts of one building row (#1708). hackable: a building with
// CompHackable; portal: a MapPortal (hatch, pit gate, cave exit). An absent
// scalar is unknown; a failed sub-read leaves its block absent and adds a
// ReadIssue named hackable or portal.
message OdysseyBuilding { HackableState hackable = 1; PortalState portal = 2; repeated ReadIssue issues = 3; }
// CompHackable: progress_percent is 0..1, defence the hack work required.
message HackableState { optional double progress_percent = 1; optional double defence = 2; optional bool hacked = 3; optional bool locked_out = 4; optional bool autohack = 5; }
// MapPortal: pocket_map_exists and the pocket map's id once it exists;
// an ancient hatch adds its stockpile type (StockpileTypeRow.name) and
// layout (LayoutDef name).
message PortalState { optional bool pocket_map_exists = 1; optional int32 pocket_map_id = 2; optional string stockpile_type = 3; optional string layout = 4; }
// The static Anomaly definitions (#1737), each read natively from the game
// defs, sorted by name, fixed for a load: entity and knowledge categories,
// codex entries (the entities and what discovers them), the thing defs that
// are entities, studiable, held on a platform or hold an entity, and the
// incidents the game marks as Anomaly incidents. A def name is the key every
// other Anomaly message refers by.
message AnomalyCatalog {
  repeated EntityCategoryRow entity_categories = 1; repeated KnowledgeCategoryRow knowledge_categories = 2; repeated EntityCodexRow codex_entries = 3;
  repeated AnomalyThingRow things = 4; repeated AnomalyIncidentRow incidents = 5;
  repeated CreepJoinerFormRow creepjoiner_forms = 6; repeated CreepJoinerBenefitRow creepjoiner_benefits = 7; repeated CreepJoinerDownsideRow creepjoiner_downsides = 8;
}
// The creepjoiner defs (#1740), read from the game defs. The shared fields are
// ICreepJoinerDef's: weight, min_combat_points and can_occur_randomly gate the
// random pick and requires and excludes (def names of other creepjoiner
// parts) pair a form, benefit and downside. A form is a PawnKindDef.
message CreepJoinerFormRow {
  optional string def_name = 1; optional string label = 2; optional double weight = 3; optional double min_combat_points = 4; optional bool can_occur_randomly = 5;
  repeated string requires = 6; repeated string excludes = 7;
}
// CreepJoinerBenefitDef: the traits, skills, hediffs and abilities it grants
// (def names; a skill carries its level range).
message CreepJoinerBenefitRow {
  optional string def_name = 1; optional string label = 2; optional double weight = 3; optional double min_combat_points = 4; optional bool can_occur_randomly = 5;
  repeated string requires = 6; repeated string excludes = 7;
  repeated string traits = 8; repeated string hediffs = 9; repeated string abilities = 10; repeated CreepJoinerSkillRange skills = 11;
}
message CreepJoinerSkillRange { optional string skill = 1; optional int32 min = 2; optional int32 max = 3; }
// CreepJoinerDownsideDef: what it adds when it fires, when it can fire and
// the class of its worker. surgical_inspection_hint is whether the def has
// a surgical inspection letter text (the game reveals it only through an
// inspection). The pawn rows never carry which downside a creepjoiner has.
message CreepJoinerDownsideRow {
  optional string def_name = 1; optional string label = 2; optional double weight = 3; optional double min_combat_points = 4; optional bool can_occur_randomly = 5;
  repeated string requires = 6; repeated string excludes = 7;
  repeated string traits = 8; repeated string hediffs = 9; repeated string abilities = 10;
  optional bool repeats = 11; optional double triggers_after_days_min = 12; optional double triggers_after_days_max = 13; optional double trigger_mtb_days = 14;
  optional double trigger_min_days_min = 15; optional double trigger_min_days_max = 16;
  optional bool can_occur_when_imprisoned = 17; optional bool can_occur_while_downed = 18; optional bool must_be_conscious = 19; optional string worker = 20;
  optional bool surgical_inspection_hint = 21;
}
// EntityCategoryDef: a codex grouping of entities.
message EntityCategoryRow { optional string def_name = 1; optional string label = 2; optional int32 list_order = 3; }
// KnowledgeCategoryDef: a kind of anomaly knowledge; overflow_category is the
// category knowledge spills into when this one is full.
message KnowledgeCategoryRow { optional string def_name = 1; optional string label = 2; optional string overflow_category = 3; }
// EntityDiscoveryType: when a codex entry counts as discovered.
enum EntityDiscoveryKind { ENTITY_DISCOVERY_KIND_UNSPECIFIED = 0; ENTITY_DISCOVERY_KIND_SPAWN = 1; ENTITY_DISCOVERY_KIND_UNFOG = 2; ENTITY_DISCOVERY_KIND_BECAME_VISIBLE = 3; }
// EntityCodexEntryDef: category and linked_things (ThingDef names) are the
// entity the entry describes; provocation_incidents are IncidentDef names
// and discovered_research_projects ResearchProjectDef names.
message EntityCodexRow {
  optional string def_name = 1; optional string label = 2; optional string category = 3; optional bool start_discovered = 4;
  optional EntityDiscoveryKind discovery_type = 5; optional bool allow_discovery_while_map_generating = 6; optional int32 order_in_category = 7;
  repeated string linked_things = 8; repeated string provocation_incidents = 9; repeated string discovered_research_projects = 10;
}
// A ThingDef that is an Anomaly entity (RaceProperties.IsAnomalyEntity), has
// a codex entry, is studiable, can be held on a holding platform or holds an
// entity. entity is the race flag; race_knowledge_category and
// race_anomaly_knowledge are the race's own study yield;
// min_containment_strength is the def's StatDefOf.MinimumContainmentStrength
// base value (absent when the def declares none); the blocks mirror the
// def's comp properties and are absent when the def has no such comp.
message AnomalyThingRow {
  optional string def_name = 1; optional string label = 2; optional string codex_entry = 3; optional bool entity = 4;
  optional string race_knowledge_category = 5; optional int32 race_anomaly_knowledge = 6; optional double min_containment_strength = 7;
  StudiableProps studiable = 8; HoldingTargetProps holding_target = 9; EntityHolderProps holder = 10;
}
// CompProperties_Studiable: comp is the properties' class name (the monolith
// has its own); anomaly_knowledge and knowledge_category are the comp's own
// values, absent when the def leaves them to the race.
message StudiableProps {
  optional string comp = 1; optional int32 frequency_ticks = 2; optional double study_amount_to_complete = 3; optional bool show_toggle_gizmo = 4;
  optional bool study_enabled_by_default = 5; optional bool can_be_activity_deactivated = 6; optional double anomaly_knowledge = 7;
  optional string knowledge_category = 8; optional double knowledge_factor_outdoors = 9; optional int32 min_monolith_level_for_study = 10;
  optional bool requires_holding_platform = 11; optional bool requires_imprisonment = 12;
}
// CompProperties_HoldingPlatformTarget: held_pawn_kind is a PawnKindDef name.
message HoldingTargetProps {
  optional string held_pawn_kind = 1; optional double base_escape_interval_mtb_days = 2; optional bool look_for_target_on_escape = 3;
  optional bool can_be_executed = 4; optional bool gets_cold_containment_bonus = 5;
}
// CompProperties_EntityHolder: comp is the properties' class name (a holding
// platform has its own); containment_factor scales the containment strength
// the holder provides.
message EntityHolderProps { optional string comp = 1; optional double containment_factor = 2; }
// An IncidentDef the game marks IsAnomalyIncident. category is the
// IncidentCategoryDef name; threat is true for the ThreatSmall and ThreatBig
// categories; worker is the IncidentWorker class name and codex_entry the
// entity the incident discovers.
message AnomalyIncidentRow {
  optional string def_name = 1; optional string label = 2; optional string category = 3; optional bool threat = 4; optional string worker = 5;
  repeated string target_tags = 6; optional double base_chance = 7; optional int32 earliest_day = 8; optional bool points_scaleable = 9;
  optional double min_threat_points = 10; optional int32 min_anomaly_threat_level = 11; optional string codex_entry = 12;
}
// EntityContainmentMode: what the player has ordered done with a held entity.
enum EntityContainmentModeKind {
  ENTITY_CONTAINMENT_MODE_KIND_UNSPECIFIED = 0; ENTITY_CONTAINMENT_MODE_KIND_MAINTAIN_ONLY = 1; ENTITY_CONTAINMENT_MODE_KIND_STUDY = 2;
  ENTITY_CONTAINMENT_MODE_KIND_RELEASE = 3; ENTITY_CONTAINMENT_MODE_KIND_EXECUTE = 4;
}
// Anomaly facts of one pawn row (#1737). entity is Pawn.IsEntity, mutant
// Pawn.IsMutant and shambler Pawn.IsShambler (hostility is PawnState.hostile).
// min_containment_strength is the pawn's StatDefOf.MinimumContainmentStrength.
// held is set for a pawn with a CompHoldingPlatformTarget, study for one with
// a CompStudiable. A scalar absent is unknown; a failed sub-read leaves its
// block absent and adds a ReadIssue named entity, held or study; a failed threat fact is absent with a ReadIssue named for it.
// Threat facts for defense tactics (#1739), the combat group: hidden_from_player
// is InvisibilityUtility.IsHiddenFromPlayer (the player cannot see or target the
// pawn); psychic_ritual_invoker is a pawn whose role in its lord's psychic ritual
// is the ritual def's invoker role (the caster); melee_only is a pawn whose
// CurrentEffectiveVerb is a melee attack and who has no ability its def marks
// ai_IsOffensive.
message PawnAnomaly {
  optional bool entity = 1; optional bool mutant = 2; optional bool shambler = 3; optional double min_containment_strength = 4;
  HeldState held = 5; StudyState study = 6; repeated ReadIssue issues = 7;
  optional bool hidden_from_player = 8; optional bool psychic_ritual_invoker = 9; optional bool melee_only = 10;
  CreepJoinerState creepjoiner = 11;
}
// A creepjoiner's facts (#1740), set for a pawn with a creepjoiner tracker
// (a failed read leaves it absent with a ReadIssue named creepjoiner). form and
// benefit are CreepJoinerFormKindDef and CreepJoinerBenefitDef names, which a
// player sees in the offer letter. downside_triggered is the tracker's
// triggeredDownside, true once the game has shown the downside; the downside
// def itself is hidden information and is never read.
message CreepJoinerState { optional string form = 1; optional string benefit = 2; optional bool downside_triggered = 3; }
// CompHoldingPlatformTarget: held is CurrentlyHeldOnPlatform and platform the
// Building_HoldingPlatform holding the pawn; mode the ordered containment
// mode; escaping the pawn has begun to escape; can_be_captured whether the
// game lets the player capture it. needs_tend is Pawn.health
// HasHediffsNeedingTend and bleeding a positive BleedRateTotal (#1743): a
// held entity is tended like any patient or bleeds out.
message HeldState {
  optional bool held = 1; rimgovernor.common.v1.Ref platform = 2; optional EntityContainmentModeKind mode = 3; optional bool escaping = 4;
  optional bool extract_bioferrite = 5; optional bool can_be_captured = 6;
  optional bool needs_tend = 7; optional bool bleeding = 8;
}
// CompStudiable: progress_percent is 0..1; knowledge_category and
// anomaly_knowledge are the values the game resolves for this thing;
// anomaly_knowledge_gained is what its study has already yielded.
message StudyState {
  optional bool study_enabled = 1; optional bool completed = 2; optional double progress_percent = 3; optional double study_points = 4;
  optional double anomaly_knowledge_gained = 5; optional int32 study_interactions = 6; optional bool ever_studiable = 7; optional bool currently_studiable = 8;
  optional string knowledge_category = 9; optional double anomaly_knowledge = 10;
}
// Anomaly facts of one building row (#1737): holder is a CompEntityHolder
// (a holding platform), study a CompStudiable. A failed sub-read leaves its
// block absent and adds a ReadIssue named holder or study.
message AnomalyBuilding { EntityHolderState holder = 1; StudyState study = 2; repeated ReadIssue issues = 3; }
// CompEntityHolder: containment_strength is the strength the holder's room
// provides now (CompEntityHolder.ContainmentStrength), available whether it can take
// a pawn, held_pawn the pawn it holds. doors are the Building_Door things the
// game counts for the holder's room (StatWorker_ContainmentStrength
// CalculateDoorStats: the doors in its boundary), read in their own try: a
// failed read leaves them empty with a ReadIssue named doors (#1743).
message EntityHolderState { optional double containment_strength = 1; optional bool available = 2; rimgovernor.common.v1.Ref held_pawn = 3; repeated AnomalyDoor doors = 4; }
// One door of a holder's room: its cell, Building_Door.Open and HoldOpen,
// ContainmentBreached (open for 600 or more ticks, Building_Door
// TicksOpenToBreach, which zeroes the room's door strength) and
// BlockedOpenMomentary (a thing or pawn stands in the doorway, or the door is
// stuck open, so it cannot close).
message AnomalyDoor { rimgovernor.common.v1.Cell cell = 1; optional bool open = 2; optional bool hold_open = 3; optional bool containment_breached = 4; optional bool blocked_open = 5; }
message DefinitionCatalogRequest { ReadScope scope = 1; }
message DefinitionCatalogReply { oneof outcome { DefinitionCatalog observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message SnapshotStreamOpened {
  string name = 1;       // mapping name; the ready event is name + "-ready"
  uint32 slots = 2;
  uint32 slot_bytes = 3;
}
message SnapshotStreamReply { oneof outcome { SnapshotStreamOpened opened = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Makes the next frame capture if any applied write is uncaptured (#1274);
// the reply does not wait for the capture.
message FlushSnapshotRequest {}
message FlushSnapshotReply { oneof outcome { bool flushed = 1; rimgovernor.common.v1.Failure failure = 2; } }

service Observations {
  rpc GetClearanceTargets(ClearanceTargetsRequest) returns (ClearanceTargetsReply);
  rpc GetAncientShrines(AncientShrinesRequest) returns (AncientShrinesReply);
  rpc ListArchitectCategories(ArchitectCategoriesRequest) returns (ArchitectCategoriesReply);
  rpc ListArchitectDesignators(ArchitectDesignatorsRequest) returns (ArchitectDesignatorsReply);
  rpc ReadStatus(StatusRequest) returns (StatusReply);
  rpc ReadObservationBatch(ObservationBatchRequest) returns (ObservationBatchReply);
  rpc OpenSnapshotStream(SnapshotStreamRequest) returns (SnapshotStreamReply);
  rpc FlushSnapshot(FlushSnapshotRequest) returns (FlushSnapshotReply);
  rpc ListPawns(ListPawnsRequest) returns (ListPawnsReply);
  rpc ListSupplies(ListSuppliesRequest) returns (ListSuppliesReply);
  rpc ListBuildings(ListBuildingsRequest) returns (ListBuildingsReply);
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsReply);
  rpc ListZones(ListZonesRequest) returns (ListZonesReply);
  rpc GetCells(GetCellsRequest) returns (GetCellsReply);
  rpc ReadResearch(ResearchRequest) returns (ResearchReply);
  rpc ReadDefinitionCatalog(DefinitionCatalogRequest) returns (DefinitionCatalogReply);
  rpc ReadColonyFacts(ColonyFactsRequest) returns (ColonyFactsReply);
  rpc ReadSpatialAccess(SpatialAccessRequest) returns (SpatialAccessReply);
  rpc ReadRoofSupport(RoofSupportRequest) returns (RoofSupportReply);
  rpc ReadExcavationSite(ExcavationSiteRequest) returns (ExcavationSiteReply);
  rpc ReadPlantCutCensus(PlantCutCensusRequest) returns (PlantCutCensusReply);
  rpc ReadDefenseSite(DefenseSiteRequest) returns (DefenseSiteReply);
  rpc ReadLinesOfFire(LinesOfFireRequest) returns (LinesOfFireReply);
  rpc ListWallUpgradeSites(WallUpgradeSitesRequest) returns (WallUpgradeSitesReply);
  rpc ListResourceSources(ResourceSourcesRequest) returns (ResourceSourcesReply);
  rpc ReadHusbandry(HusbandryRequest) returns (HusbandryReply);
  rpc ReadRecovery(RecoveryRequest) returns (RecoveryReply);
  rpc ReadPopulation(PopulationRequest) returns (PopulationReply);
  rpc ReadWorld(WorldRequest) returns (WorldReply);
  rpc ReadWorldProgression(WorldProgressionRequest) returns (WorldProgressionReply);
  rpc ReadBills(BillsRequest) returns (BillsReply);
  rpc ReadRecipes(RecipesRequest) returns (RecipesReply);
  rpc ReadBuildingSettings(BuildingSettingsRequest) returns (BuildingSettingsReply);
  rpc ReadPawnSettings(PawnSettingsRequest) returns (PawnSettingsReply);
  rpc ResolveTarget(ResolveTargetRequest) returns (ResolveTargetReply);
  rpc ReadGear(GearRequest) returns (GearReply);
  // ReadMedicalCatalog retired (#1161): surgery facts ride on PawnHealth.
  rpc ListTraders(TradersRequest) returns (TradersReply);
  rpc ReadTradeSheet(TradeSheetRequest) returns (TradeSheetReply);
  rpc ReadTradeSession(TradeSessionRequest) returns (TradeSessionReply);
}

// Native definition classification for bounded food purchases and crop exports.
message TradeFoodFacts { double nutrition = 1; }

// The pawn's current food policy: its load id and allowed definitions.
message FoodRestriction {
  optional string policy_id = 1;
  repeated string allowed_defs = 2;
}

message ApparelPolicyState { optional string token = 1; optional string name = 3; repeated string allowed_defs = 4; optional float min_hit_points = 5; optional float max_hit_points = 6; optional int32 min_quality = 7; optional int32 max_quality = 8; optional bool excludes_tainted = 9; optional bool child = 11; optional bool slave = 12; optional bool incapable_of_violence = 13; repeated WorkSetting work = 14; optional bool drafted = 15; repeated Skill skills = 16;
  // The pawn's short name (its outfit's label), the load id of its current
  // outfit, the definitions its royal title, ideoligion role and
  // ideoligion apparel precepts require, and whether it goes nude (nudist
  // trait or mandatory nudity precept).
  optional string pawn_name = 17; optional string policy_id = 18; repeated string required_defs = 19; optional bool nude = 20; }
