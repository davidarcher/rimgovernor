message IngredientRequirement { repeated string allowed_def_names = 1; optional double required = 2; optional double available = 3; optional double missing = 4; optional bool complete = 5; repeated ReadIssue issues = 6; repeated Quantity alternatives = 7; } // alternatives: required units per allowed definition when the count depends on the material chosen.
message FilterSpecialRule { optional string def_name = 1; optional bool allowed = 2; }
message StockpileFilter {
  repeated string allowed_def_names = 1; repeated FilterSpecialRule special_rules = 2;
  optional double hit_points_min = 3; optional double hit_points_max = 4; optional string quality_min = 5; optional string quality_max = 6;
  optional bool allow_fresh = 7; optional bool allow_rotten = 8;
}
message BillState {
  optional bool default_ingredients = 25; // Filter matches a new Auto bill, including food routing and special filters.
  optional bool unrestricted_worker = 26; // No skill or worker-category restriction; worker_id separately records a pinned pawn.
  optional bool managed_unchanged = 24; // Current-load controller bill with unchanged player settings.
  optional string id = 1; DefinitionRef recipe = 3; optional string bill_class = 4;
  optional rimgovernor.operations.v1.RepeatMode repeat_mode = 5; optional int32 repeat_count = 6; optional int32 target_count = 7; optional int32 unpause_below = 8;
  optional bool pause_when_satisfied = 9; optional bool paused = 10; optional bool suspended = 11; optional bool finished = 12;
  rimgovernor.common.v1.Ref worker = 13; optional int32 skill_min = 14; optional int32 skill_max = 15; optional double ingredient_radius = 16;
  StockpileFilter ingredient_filter = 17; optional rimgovernor.operations.v1.StoreMode store_mode = 18; rimgovernor.common.v1.Ref store_zone = 19;
  optional bool can_run_now = 20; repeated string blockers = 21; repeated IngredientRequirement ingredients = 22; repeated ReadIssue issues = 23;
  // Live bill jobs' promised ingredients (#1354): one row per spawned pawn
