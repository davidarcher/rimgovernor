// Native definition classification for bounded food purchases and crop exports.
message TradeFoodFacts { double nutrition = 1; FoodIngredientClass ingredient_class = 2; bool prepared = 3; bool non_perishable = 4; bool crop = 5; }

// Native eligibility without the saved definition whitelist. Special filters
// and condition ranges remain part of the exact settings snapshot.
message FoodRestriction {
  optional string policy_id = 1;
  repeated string allowed_defs = 2;
  repeated string eligible_defs = 3;
}

message ApparelPolicyDefinition { optional string def_name = 1; optional bool armor = 2; optional bool child = 3; optional bool adult = 4; }
message ApparelPolicyState { optional string token = 1; reserved 2; optional string name = 3; repeated string allowed_defs = 4; optional float min_hit_points = 5; optional float max_hit_points = 6; optional int32 min_quality = 7; optional int32 max_quality = 8; optional bool excludes_tainted = 9; repeated ApparelPolicyDefinition definitions = 10; optional bool child = 11; optional bool slave = 12; optional bool incapable_of_violence = 13; repeated WorkSetting work = 14; optional bool drafted = 15; }
