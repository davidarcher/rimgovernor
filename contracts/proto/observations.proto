message ResourceSource {
  rimgovernor.common.v1.Ref source = 1; optional string method = 2; optional double yield = 3; optional bool reachable = 4;
  optional bool designated = 5; optional string risk = 6; optional string safety = 7; optional string blocker = 8;
  optional double distance = 9; optional bool depleted = 10; optional int64 remaining = 11; optional int64 pending_yield = 12;
  optional int64 designated_tick = 13; optional bool taken = 14;
  // buried: a supported mine deposit no colonist can reach (usually fogged); a corridor excavation must reach it first (#1072).
  optional bool buried = 15;
  // A mine source's CAS token and cell (#1342): rocks are in no frame's things table.
  SnapshotRef source_snapshot = 16; rimgovernor.common.v1.Cell cell = 17;
}
message StorageCapacity { optional string resource = 1; optional int64 capacity = 2; optional int64 stored = 3; optional int32 stack_limit = 4; repeated rimgovernor.common.v1.Ref haulers = 5; repeated string blockers = 6; repeated ReadIssue issues = 7; repeated rimgovernor.common.v1.Cell candidates = 8; }
message ExtractionWorkType { DefinitionRef definition = 1; repeated DefinitionRef work_givers = 2; }
message ExtractionSite { SnapshotRef snapshot = 1; optional string def_name = 2; rimgovernor.common.v1.Cell cell = 3; optional rimgovernor.placement.v1.Rotation rotation = 4; optional string resource = 5; optional bool eligible = 6; optional double power_w = 7; optional double spare_power_w = 8; repeated ExtractionWorkType work_types = 9; }
message OwnedDrill { SnapshotRef snapshot = 1; optional string def_name = 2; optional string thing_id = 3; optional string pending_id = 4; rimgovernor.common.v1.Cell cell = 5; optional string resource = 6; optional int64 recovered = 7; optional int64 stock_target = 8; optional bool missing = 9; optional bool depleted = 10; }
message ExtractionDevelopment { reserved 1, 2, 10; reserved "scanners", "drills", "drill_state"; repeated ResourceSource deposits = 3; repeated DefinitionRef definitions = 4; repeated Quantity costs = 5; repeated string research = 6; reserved 7; repeated ExtractionSite sites = 8; repeated OwnedDrill owned = 9; optional bool scanners_active = 11; ExtractionWorkType flick_work_type = 12; }
message ResourceSourcesSnapshot { rimgovernor.common.v1.ObservationContext context = 1; optional string resource = 2; repeated ResourceSource sources = 3; StorageCapacity storage = 4; ExtractionDevelopment development = 5; Completeness completeness = 6; }
message ResourceSourcesRequest { ReadScope scope = 1; optional string resource = 2; optional bool include_development = 3; reserved 4; }
message ResourceSourcesReply { oneof outcome { ResourceSourcesSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message HandlerState { rimgovernor.common.v1.Ref pawn = 1; optional int32 skill = 2; optional int32 priority = 3; optional bool eligible = 4; optional string reason = 5; }
message HusbandryAnimal { reserved 1; rimgovernor.common.v1.Ref pawn = 6; AnimalState animal = 3; repeated HandlerState handlers = 4; reserved 2, 5; reserved "settings_snapshot", "census_snapshot"; }
message HusbandrySnapshot { rimgovernor.common.v1.ObservationContext context = 1; SnapshotRef census = 2; repeated HusbandryAnimal animals = 3; reserved 4; }
message HusbandryRequest { ReadScope scope = 1; optional bool include_wild = 3; reserved 2; }
