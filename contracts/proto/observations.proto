message HusbandrySnapshot { rimgovernor.common.v1.ObservationContext context = 1; SnapshotRef census = 2; repeated HusbandryAnimal animals = 3; }
message HusbandryRequest { ReadScope scope = 1; optional bool include_wild = 3; }
