enum WasteLocation { WASTE_LOCATION_UNSPECIFIED = 0; WASTE_LOCATION_EXPOSED = 1; WASTE_LOCATION_RELOCATED = 2; WASTE_LOCATION_BURIED = 3; }
message WasteItem { rimgovernor.common.v1.Ref thing = 1; optional int64 count = 2; optional WasteLocation state = 3; rimgovernor.common.v1.Ref zone = 4; rimgovernor.common.v1.Ref grave = 5; optional RotStage rot_stage = 6; optional WasteKind kind = 7; optional bool eligible = 8; optional string protected_reason = 9;
  reserved 10; reserved "corpse_of";
  // A corpse's inner pawn; unset for non-corpses.
  optional rimgovernor.common.v1.CorpseClass corpse_class = 11; }
message WasteSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated WasteItem items = 2; reserved 3; }
message WasteRequest { ReadScope scope = 1; repeated string unwanted_ids = 2; repeated string bury_ids = 3; reserved 4; }
message WasteReply { oneof outcome { WasteSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
