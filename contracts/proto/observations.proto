message ConstructionState { optional double total_work = 1; optional double work_left = 2; optional double percent_complete = 3; repeated MaterialDeficit resources = 4; optional bool resources_complete = 5; optional bool completable_ever = 6; repeated ReadIssue issues = 7; }
message ThermalSide { optional string side = 1; rimgovernor.common.v1.Cell position = 2; rimgovernor.common.v1.Ref room = 3; optional bool outdoors = 4; optional double temperature_c = 5; optional bool fogged = 6; optional bool impassable = 7; repeated ReadIssue issues = 8; }
message BuildingServiceState {
  optional bool connected = 1; optional bool power_on = 2; optional double power_output_w = 3; optional bool switched_on = 4;
  optional double fuel = 5; optional double target_fuel = 6; optional bool out_of_fuel = 7; optional bool broken_down = 8;
  repeated string allowed_fuel_defs = 9; optional string power_net_id = 10; repeated ReadIssue issues = 11;
