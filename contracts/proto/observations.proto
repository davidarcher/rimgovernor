syntax = "proto3";
package rimgovernor.observations.v1;
option csharp_namespace = "RimGovernor.Protocol.Observations";
option go_package = "github.com/davidarcher/RimGovernor/go/internal/wire/observationspb;observationspb";
import "common.proto";
import "clock.proto";
import "mirror.proto";
import "placement.proto";
import "operations.proto";
import "receipts.proto";

// All requests are read-only; previews/admission and UI/media have other owners.
// Validators require context, selected outcome, finite numbers and exact IDs.
// Every list is complete in one reply: no page size, collection cap or
// whole-reply size cap. Never silently sample.
// Native definition/enum names remain open strings, resolved by the game.
// Reconciliation survives tick advancement and authority revocation.
message ReadScope { rimgovernor.common.v1.Identity expected_identity = 1; }
message SnapshotRef {
  rimgovernor.common.v1.ObservationContext context = 1;
  optional string entity_id = 2;
  optional string token = 3; // Opaque exact entity+settings snapshot CAS token.
}
// Rows the query's filters excluded from the scanned set. Replies carry
// every matching row; there is no paging or per-list cap. Only replies
// whose query has a filter that can exclude rows carry it.
message Completeness {
  reserved 1, 2, 3, 5, 6;
  optional uint64 filtered = 4;
}
message ReadIssue { optional string field = 1; rimgovernor.common.v1.Unavailable unavailable = 2; }
message Rectangle { rimgovernor.common.v1.Cell minimum = 1; rimgovernor.common.v1.Cell maximum = 2; }

// Complete census of visible, deconstructible non-player buildings touching Home.
// Absence of faction means no faction; absence of roof_blocker means safe removal.
enum ClearanceClass {
  CLEARANCE_CLASS_UNSPECIFIED = 0;
  CLEARANCE_CLASS_ANCIENT_WALL_DOOR = 1;
  CLEARANCE_CLASS_SHIP_CHUNK = 2;
  CLEARANCE_CLASS_ANCIENT_CASKET = 3;
  CLEARANCE_CLASS_OTHER = 4;
}
message ClearanceTarget {
  optional string entity_id = 1;
  optional string def_name = 2;
  Rectangle occupied = 3;
  optional string faction = 4;
  optional bool deconstructible = 5;
  ClearanceClass class = 6;
  optional bool in_home = 7; // Every occupied cell, not just the origin.
  optional string roof_blocker = 8;
  optional bool ancient_danger = 9;
  optional bool designated = 10; // A standing Deconstruct designation; the controller adopts it (no ownership ledger).
  reserved 11;
  SalvageEvidence salvage = 12;
  // Player-faction rows only (planned ground): the building is a wall or door
  // on the boundary of a room that is not outdoors.
  optional bool encloses_room = 13;
}
// A constructed floor on planned ground: vanilla's foundation-free floor
// layer (TerrainGrid.CanRemoveTopLayerAt), one row per cell. designated is a
// standing RemoveFloor designation.
message ClearanceFloor {
  rimgovernor.common.v1.Cell cell = 1;
  optional string def_name = 2;
  optional bool designated = 3;
}
message SalvageYield {
  string def_name = 1;
  int64 count = 2;
  double unit_value = 3;
  int64 storage_headroom = 4;
}
message SalvageEvidence {
  bool safe = 1;
  double path_length = 2;
  double labor = 3;
  repeated SalvageYield yields = 4;
}
// A rock or slag chunk stack standing on a Home cell: a haul, never a
// deconstruction. stored is vanilla's IsInValidStorage; destination is
// whether ordinary hauling already has a better store cell for it.
message ClearanceChunk {
  optional string entity_id = 1;
  optional string def_name = 2;
  rimgovernor.common.v1.Cell cell = 3;
  optional bool forbidden = 4;
  optional bool stored = 5;
  optional bool destination = 6;
}
// include_salvage asks for salvage evidence on the rows outside Home; a
// caller that never reads salvage leaves it false and the native read skips
// the salvage route and storage searches (#984).
// planned_ground (#1365) widens the census on those cells only: player-faction
// buildings touching them become targets (with encloses_room) and their
// constructed floors are reported per cell. Empty keeps the non-player census.
message ClearanceTargetsRequest {
  ReadScope scope = 1;
  bool include_salvage = 2;
  repeated Rectangle planned_ground = 3;
}
// dump_sites is a bounded connected footprint of free, outdoor, unzoned,
// hauler-reachable Home cells near the chunks lacking a destination on which
// a dumping stockpile could be made; empty when no such chunk exists, no
// hauler exists or no cell qualifies.
message ClearanceTargetsSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1;
  repeated ClearanceTarget targets = 2;
  reserved 3;
  repeated ClearanceChunk chunks = 4;
  repeated rimgovernor.common.v1.Cell dump_sites = 5;
  repeated ClearanceFloor floors = 6; // Only cells inside the request's planned_ground.
}
message ClearanceTargetsReply { oneof outcome {
  ClearanceTargetsSnapshot observed = 1;
  rimgovernor.common.v1.Unavailable unavailable = 2;
  rimgovernor.common.v1.Failure failure = 3;
} }

// Ancient shrines (#456): each sealed or opened ancient-danger room as one
// unit. Caskets report native hit points and HasAnyContents; the occupant
// stays unknown until opened. Guards are the hostile pawns and hives inside
// the room rectangle and are complete only once the interior is unfogged.
// Breach walls are the perimeter walls the player may deconstruct without
// a roof-support blocker, each with the adjacent cell outside the room.
enum ShrineGuardKind {
  SHRINE_GUARD_KIND_UNSPECIFIED = 0;
  SHRINE_GUARD_KIND_MECHANOID = 1;
  SHRINE_GUARD_KIND_INSECTOID = 2;
  SHRINE_GUARD_KIND_FLESHBEAST = 3;
  SHRINE_GUARD_KIND_HUMAN = 4;
  SHRINE_GUARD_KIND_HIVE = 5;
  SHRINE_GUARD_KIND_OTHER = 6;
}
message ShrineCasket {
  optional string entity_id = 1;
  rimgovernor.common.v1.Cell cell = 2;
  optional uint32 hit_points = 3;
  optional uint32 max_hit_points = 4;
  optional bool has_contents = 5;
  optional bool player_claimed = 6;
  rimgovernor.common.v1.Cell interaction_cell = 7; // Where a pawn stands to open it; ejected contents drop near it.
}
message ShrineGuard {
  optional string entity_id = 1;
  ShrineGuardKind kind = 2;
  optional bool downed = 3;
  optional bool dead = 4;
}
// ShrineOccupant is a humanlike the caskets released, or a corpse of one: any
// non-player humanlike pawn or corpse inside the room (#460).
message ShrineOccupant {
  optional string entity_id = 1;
  optional bool hostile = 2;
  optional bool downed = 3;
  optional bool dead = 4;
  optional bool prisoner = 5; // Already the colony's prisoner.
  optional string faction = 6; // Faction def name; empty when factionless.
}
message ShrineBreachWall {
  optional string entity_id = 1;
  rimgovernor.common.v1.Cell cell = 2;
  rimgovernor.common.v1.Cell outside = 3; // Adjacent cell outside the room.
  optional string def_name = 4; // The wall's ThingDef, the breach designation's definition.
}
message AncientShrine {
  optional string shrine_id = 1;
  Rectangle room = 2;
  optional bool sealed = 3; // Interior fogged, no open roof, no map edge.
  optional bool in_home = 4; // Any room cell in Home.
  optional bool guards_known = 5; // False while the interior is fogged.
  repeated ShrineCasket caskets = 6;
  repeated ShrineGuard guards = 7;
  repeated ShrineBreachWall breach_walls = 8;
  repeated ShrineOccupant occupants = 9;
  reserved 10; // heat: the shrine heat fallback's reading, removed (#875).
}
message AncientShrinesRequest { ReadScope scope = 1; }
message AncientShrinesSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1;
  repeated AncientShrine shrines = 2;
  reserved 3;
}
message AncientShrinesReply { oneof outcome {
  AncientShrinesSnapshot observed = 1;
  rimgovernor.common.v1.Unavailable unavailable = 2;
  rimgovernor.common.v1.Failure failure = 3;
} }
message MapSize { optional uint32 width = 1; optional uint32 height = 2; }
message DefinitionRef { optional string def_name = 1; optional string label = 2; }
message EntityRef {
  optional string id = 1;
  optional string def_name = 2;
  optional string label = 3;
  optional int32 map_id = 4;
  rimgovernor.common.v1.Cell position = 5;
  reserved 6 to 10; reserved "snapshot", "inner_id", "inner_def_name", "quality", "market_value";
}
message TargetRef { oneof target { rimgovernor.common.v1.Ref entity = 1; rimgovernor.common.v1.Cell cell = 2; rimgovernor.common.v1.Unavailable unavailable = 3; } }
message Quantity { optional string def_name = 1; optional int64 units = 2; }
message Amount { optional string def_name = 1; optional double amount = 2; }
message SkillRequirement { optional string def_name = 1; optional int32 minimum = 2; optional int32 maximum = 3; }
message JobEvidence {
  optional string def_name = 1;
  optional string load_id = 2;
  optional bool player_forced = 3;
  optional string report = 4;
  TargetRef target_a = 5;
  optional uint64 order_generation = 6;
  optional uint32 queued_jobs = 7;
  optional bool interruptible = 8;
  optional double native_priority = 9;
  repeated ReadIssue issues = 10;
  // work_type_def_name: the WorkTypeDef of the job's work giver, absent for
  // a job no work giver issued (a forced order, rest, a meal, wandering).
  optional string work_type_def_name = 11;
  // target_a_cell: a spawned thing target's cell when the job was read
  // (#1342); target_a carries the thing's Ref.
  rimgovernor.common.v1.Cell target_a_cell = 12;
}
message PawnNeeds {
  optional double food = 1; optional double rest = 2; optional double mood = 3; optional double joy = 4;
  optional HungerCategory hunger_category = 5; optional BreakRisk break_risk = 6;
  optional double break_threshold_minor = 7; optional double break_threshold_major = 8; optional double break_threshold_extreme = 9;
  repeated ReadIssue issues = 10;
  // Psyfocus (#1313): Pawn_PsychicEntropyTracker CurrentPsyfocus and
  // TargetPsyfocus (0-1) and Pawn.GetPsylinkLevel(); all three are absent
  // when Royalty is inactive or the pawn has no psylink.
  optional double psyfocus = 11; optional double psyfocus_target = 12; optional int32 psylink_level = 13;
}
message Hediff {
  DefinitionRef definition = 1; optional string part_def_name = 2; optional string part_label = 3; optional int32 part_index = 4;
  optional double severity = 5; optional string severity_label = 6; optional bool visible = 7; optional bool bad = 8;
  optional bool permanent = 9; optional bool life_threatening = 10; optional bool tendable_now = 11;
  optional bool tended = 12; optional double tend_quality = 13; optional int64 tend_expires_in_ticks = 14;
  optional int64 next_tend_in_ticks = 15; optional bool immunizable = 16; optional double immunity = 17; optional bool fully_immune = 18;
  // Instantaneous native rates per 60000 game ticks; absent when unavailable.
  optional double severity_per_day = 19; optional double immunity_per_day = 20;
}
message Capacity { optional string def_name = 1; optional double level = 2; rimgovernor.common.v1.Unavailable unavailable = 3; }
message SurgeryBill { optional string id = 1; optional string recipe = 2; optional int32 part_index = 3; optional bool suspended = 4; }
message PawnHealth {
  optional double summary_fraction = 1; optional bool needs_tend = 2; optional bool bleeding = 3;
  optional double bleed_rate_per_day = 4; optional double pain = 5; optional double blood_loss = 6;
  optional double hours_until_death_from_blood_loss = 7; optional bool life_threatening = 8;
  repeated Capacity capacities = 9; repeated Hediff hediffs = 10; Completeness hediff_completeness = 11;
  optional uint32 hidden_hediffs = 12; optional bool stable_rest_eligible = 13; optional bool should_seek_medical_rest = 14;
  optional bool urgent_medical_rest = 15; optional string bed_id = 16; repeated SurgeryBill surgery_bills = 17;
  repeated ReadIssue issues = 18;
  SnapshotRef snapshot = 19;
  // Surgery facts (#1161). Native computes every value through vanilla; Go
  // never recomputes them. Absent lists with a read issue are unknown.
  repeated MissingBodyPart missing_parts = 20; repeated SurgeryOperation operations = 21;
}
// A missing or destroyed part at its common missing ancestor; descendants are implied.
message MissingBodyPart { optional int32 part_index = 1; optional string part_def_name = 2; optional int32 parent_index = 3; optional string parent_def_name = 4; optional bool vital = 5; }
enum SurgeryKind {
  SURGERY_KIND_UNSPECIFIED = 0;
  SURGERY_KIND_RESTORE = 1; // Installs a part where the body part is missing.
  SURGERY_KIND_CURE = 2; // Removes a condition.
  SURGERY_KIND_AMPUTATE = 3; // Removes a damaged or artificial part.
  SURGERY_KIND_INSTALL = 4; // Installs over a present part, or an implant.
  SURGERY_KIND_HARVEST = 5; // Removes a clean natural part.
  SURGERY_KIND_OTHER = 6; // Any other medical recipe (administer, execute).
}
// One available operation on one part. success_chance is vanilla's
// SurgeryOutcomeEffectDef quality with the best eligible doctor, the best
// colony medical bed (or the current bed) and the best permitted medicine on
// the map; absent when no doctor is eligible or the recipe has no outcome effect.
message SurgeryOperation {
  DefinitionRef recipe = 1; optional int32 part_index = 2; optional string part_def_name = 3; SurgeryKind kind = 4;
  optional double success_chance = 5; optional uint32 eligible_doctors = 6; optional bool ingredients_on_map = 7;
  optional bool violation = 8; optional bool lethal = 9;
  // A harvest's yield (#1169), or an added part's on removal (#1232):
  // BaseMarketValue of the spawnThingOnRemoved; absent otherwise.
  optional double yield_market_value = 10;
  // Artificial part removal (#1232): the removed Hediff_AddedPart's def and
  // the thing it spawns; absent unless the target part carries an added part.
  optional string added_part_hediff = 11; optional string yield_thing_def = 12;
  // BaseMarketValue x count of the medicine the operation would use (the
  // best permitted on the map); absent when it uses none or none is stocked.
  optional double medicine_market_value = 13;
  // The best eligible doctor's chance with an ideal bed and room (#1240):
  // success_chance with the bed factor replaced by a clean, roofed Bed's;
  // absent exactly when success_chance is.
  optional double doctor_success_chance = 14;
  // True when medicine the recipe accepts is on the map but the patient's
  // medical care level forbids all of it (#1239); ingredients_on_map is
  // then false.
  optional bool medicine_care_limited = 15;
  // Each eligible doctor's chance on this operation, the same score as
  // success_chance, keyed by pawn id (#1253); empty when success_chance is
  // absent.
  map<string, double> doctor_chances = 16;
}
// Quality is the vanilla QualityCategory.
enum Quality { QUALITY_UNSPECIFIED = 0; QUALITY_AWFUL = 1; QUALITY_POOR = 2; QUALITY_NORMAL = 3; QUALITY_GOOD = 4; QUALITY_EXCELLENT = 5; QUALITY_MASTERWORK = 6; QUALITY_LEGENDARY = 7; }
message GearItem {
  rimgovernor.common.v1.Ref thing = 1; optional string stuff = 2; optional Quality quality = 3; optional int32 hit_points = 4; optional int32 max_hit_points = 5;
  optional double condition_fraction = 6; repeated string apparel_layers = 7; repeated string body_part_groups = 8;
  optional bool weapon = 9; optional bool apparel = 10; optional bool ranged = 11; optional bool melee = 12;
  optional bool forced = 13; optional bool locked = 14; optional double armor_sharp = 15; optional double armor_blunt = 16;
  optional double insulation_cold = 17; optional double insulation_heat = 18;
  optional double range = 19; // Ranged primary verb range in cells; absent for melee or unknown.
  optional string biocoded_to = 20; // Native pawn ID, only when the coded owner still exists.
  optional bool biocoded = 21; // True also when the coded owner reference was lost; absent on older producers.
  // A loose candidate's supply CAS token (#1342).
  SnapshotRef thing_snapshot = 22;
}
message PawnEquipment {
  optional string primary_id = 1; repeated GearItem equipped = 2; repeated GearItem apparel = 3;
  repeated GearItem inventory_weapons = 4; optional string carried_thing_id = 5; optional uint32 inventory_item_count = 6;
  optional bool armed = 7; repeated ReadIssue issues = 8;
  // Defense capacity (#1188): the primary ranged verb's damage per second
  // (projectile damage x burst over aim-adjusted warmup, cooldown and burst
  // gaps; 0 without a ranged primary) and the pawn's MeleeDPS stat.
  optional double ranged_dps = 9; optional double melee_dps = 10;
}
// Passion is a skill's vanilla passion level.
enum Passion { PASSION_UNSPECIFIED = 0; PASSION_NONE = 1; PASSION_MINOR = 2; PASSION_MAJOR = 3; }
message Skill { DefinitionRef definition = 1; optional int32 level = 2; optional double stored_level = 3; optional Passion passion = 4; optional bool disabled = 5; }
message Trait { optional string def_name = 1; optional int32 degree = 2; }
message WorkSetting { optional string def_name = 1; optional int32 priority = 2; optional bool disabled = 3; }
message TimetableSlot { optional uint32 hour = 1; optional string assignment_def_name = 2; }
message PawnBiography {
  optional double biological_age_years = 1; optional double chronological_age_years = 2;
  DefinitionRef childhood = 3; DefinitionRef adulthood = 4; optional string title = 5; optional string title_source = 6;
  repeated Skill skills = 7; repeated Trait traits = 8; repeated string incapable_work_types = 9;
  repeated string incapable_sources = 10; repeated string disabled_work_tags = 11; repeated ReadIssue issues = 12;
}
message Thought { optional string def_name = 1; optional string label = 2; optional uint32 count = 3; optional double mood_offset_each = 4; optional double mood_offset_total = 5; }
message Relation { rimgovernor.common.v1.Ref other = 1; optional string relation_def_name = 2; optional int32 opinion = 3; optional bool opinion_reconstructed = 4; }
message PawnSocial { optional bool high_expectations = 6; repeated Thought memories = 1; repeated Thought situational = 2; repeated Relation relations = 3; optional bool situational_cache_stale = 4; repeated ReadIssue issues = 5; }
message PawnSettings {
  reserved 1; reserved "snapshot"; optional rimgovernor.operations.v1.MedicalCare medical_care = 2; optional bool self_tend = 3; optional rimgovernor.operations.v1.HostilityResponse hostility_response = 4;
  optional string allowed_area_id = 5; optional string master_id = 6; optional bool follow_drafted = 7; optional bool follow_fieldwork = 8;
  repeated WorkSetting work = 9; repeated TimetableSlot schedule = 10; repeated DefinitionRef allowed_areas = 11;
  repeated rimgovernor.operations.v1.MedicalCare medical_care_options = 12; repeated rimgovernor.operations.v1.HostilityResponse hostility_response_options = 13; repeated ReadIssue issues = 14;
  optional bool work_applies = 15; optional bool manual_work_priorities = 16;
  FoodRestriction food_restriction = 17;
  reserved 18, 19; reserved "drug_policy_writable", "drug_policy_name";
  // Per-pawn policy planner inputs (#1297), read with work detail.
  PawnPolicyInputs policy_inputs = 20;
}
// The inputs per-pawn outfit/drug/food/reading planners compose from
// (#1297). Traits, mood and break thresholds (biography, needs) and animal
// bonds (social relations, relation_def_name "Bond") are observed elsewhere.
// Policy ids are Policy.GetUniqueLoadID(); absent when the pawn has no
// tracker for that policy kind. A field the pawn has no source for (no
// Royalty title, no ideoligion, not a guest) is absent or empty, never an
// issue.
message PawnPolicyInputs {
  optional string outfit_policy_id = 1; optional string drug_policy_id = 2; optional string reading_policy_id = 3;
  // Pawn_InventoryStockTracker entries (medicine carry): group def, chosen
  // thing def and desired count.
  repeated InventoryStockSetting inventory_stock = 4;
  // One row per ChemicalDef with an addiction or tolerance hediff.
  repeated ChemicalState chemicals = 5;
  // ChemicalDef defNames of the pawn's Gene_ChemicalDependency genes.
  repeated string dependency_chemicals = 6;
  // Most senior royal title's defName and its requiredApparel.
  optional string royal_title = 7; repeated ApparelRequirementFact title_apparel = 8;
  // Ideo.GetUniqueLoadID(), the ideo's precept defNames (diet, apparel and
  // every other issue), the pawn's Precept_Role defName with its apparel
  // requirements, and the apparelDef of each Precept_Apparel.
  optional string ideo_id = 9; repeated string precepts = 10; optional string ideo_role = 11;
  repeated ApparelRequirementFact role_apparel = 12; repeated string precept_apparel = 13;
  // GuestStatus name (Guest, Prisoner, Slave) and the prisoner/slave
  // interaction mode defNames; absent for a pawn that is no guest.
  optional string guest_status = 14; optional string prisoner_interaction = 15; optional string slave_interaction = 16;
  // StatDefOf.MedicalTendQuality of the pawn as a doctor, before vanilla's
  // 0.7 self-tend factor (#1305); absent for a pawn that cannot doctor.
  optional double medical_tend_quality = 17;
}
message InventoryStockSetting { optional string group = 1; optional string thing_def = 2; optional int32 count = 3; }
// addiction: Hediff_Addiction severity, absent without one; withdrawal: the
// addiction is in its withdrawal stage; tolerance: the tolerance hediff's
// severity, absent without one.
message ChemicalState { optional string chemical = 1; optional double addiction = 2; optional bool withdrawal = 3; optional double tolerance = 4; }
message ApparelRequirementFact { repeated string body_part_groups = 1; repeated string required_defs = 2; repeated string required_tags = 3; repeated string allowed_tags = 4; }
message TrainingEntry { optional string def_name = 1; optional bool learned = 2; optional bool wanted = 3; optional bool available = 4; optional string reason = 5; }
message AnimalState {
  optional string gender = 1; optional double age_years = 2; optional bool fertile_adult = 3; optional bool pregnant = 4;
  optional double gestation = 5; optional double milk_fullness = 6; optional double wool_fullness = 7;
  optional string pen_id = 8; optional bool contained = 9; repeated string parent_ids = 10;
  repeated TrainingEntry training = 11; optional bool release = 12; optional bool slaughter = 13;
  optional bool safe_to_slaughter = 14; optional int32 minimum_handling_skill = 15; repeated ReadIssue issues = 16;
  optional double body_size = 17; optional bool tameable = 18; optional bool tame = 19; optional bool safe_to_release = 20;
  // Player-animal settings the SetAnimalArea/Master/Following writes target:
  // the current allowed area and master (empty when unassigned), the follow
  // flags, whether Obedience is learned (master/follow eligibility) and
  // whether native lets this animal carry an allowed area at all.
  optional string allowed_area_id = 21; optional string master_id = 22; optional bool follow_drafted = 23; optional bool follow_fieldwork = 24;
  optional bool obedient = 25; optional bool supports_allowed_areas = 26;
  // Herd sizing facts (#875): RaceProps.lifeExpectancy in years, any hediff
  // that makes colonists feel sick, the player ideo bars slaughter by precept
  // or venerates this race, RaceProps.manhunterOnTameFailChance, and adult age stage.
  optional double life_expectancy_years = 27; optional bool sick = 28; optional bool slaughter_barred = 29;
  optional bool venerated = 30; optional double manhunter_on_tame_fail = 31; optional bool adult = 32;
  // Medical care cap inputs (#1301), for a player animal: its
  // MedicalCareCategory name, a Bond relation to any living pawn, and the
  // same conditions block PopulationPerson.conditions carries.
  optional rimgovernor.operations.v1.MedicalCare medical_care = 33; optional bool bonded = 34; PawnHealth conditions = 35;
}
message PawnState {
  EntityRef pawn = 1; optional string kind_def_name = 2; rimgovernor.common.v1.Ref faction = 3;
  optional bool colonist = 4; optional bool free_colonist = 5; optional bool prisoner = 6; optional bool humanlike = 7;
  optional bool animal = 8; optional bool mechanoid = 9; optional bool tame = 10; optional bool wild = 11;
  optional bool dead = 12; optional bool downed = 13; optional bool drafted = 14; optional bool hostile = 15;
  optional string hostile_reason = 16; optional string mental_state = 17; optional bool in_bed = 18;
  optional bool burning = 19; optional bool player_controlled = 20; JobEvidence job = 21;
  PawnNeeds needs = 22; PawnHealth health = 23; PawnEquipment equipment = 24; PawnBiography biography = 25;
  PawnSettings settings = 26; PawnSocial social = 27; AnimalState animal_state = 28;
  optional bool predator = 29; optional double manhunter_on_damage_chance = 30; rimgovernor.common.v1.Ref nearest_colonist = 31;
  optional double nearest_colonist_distance = 32; repeated ReadIssue issues = 33;
  // Native draft claims were removed (#939): drafts are plan-owned.
  reserved 34; reserved "draft_claim";
  rimgovernor.common.v1.Ref owned_bed = 35;
  SnapshotRef snapshot = 36;
  // Native lord evidence for hostile groups: the LordJob and current LordToil
  // class names (e.g. LordJob_AssaultColony / LordToil_AssaultColonySappers,
  // LordJob_Siege). Absent when the pawn has no lord; never inferred.
  optional string lord_job_class = 37; optional string lord_toil_class = 38;
  // Active MentalStateDef.IsAggro and MentalState.Age (native ticks, 30-tick granularity).
  // Absent without an active state or on older producers; mental_state is its defName.
  optional bool mental_state_is_aggro = 39; optional int32 mental_state_ticks = 40;
  // Mean of each active spawned hostile's highest natural/worn sharp armor rating.
  // Equipment detail only; absent when there are no live, standing hostiles.
  optional double raid_armor = 41;
  // Doctor-side tend gates, mirroring NativeTendOperations.Prepare so the
  // controller never proposes a pair the native gate refuses (#657). Present
  // only when PawnDetails.tend is requested.
  PawnTendDoctor tend_doctor = 42;
  // Verse.IntVec3.Fogged: the pawn stands in fog the colony has not
  // discovered. A fogged hostile is undiscovered, unreachable and no
  // emergency -- the ancient-danger mechanoid behind a sealed wall held
  // every window and deselected every development goal for good (#659).
  optional bool fogged = 43;
  // Current InspirationDef defName (#1187): empty when the pawn has no
  // inspiration; absent from producers that do not read it (unknown).
  optional string inspiration = 44;
  // The pawn control CAS token, on reads that admit a pawn order (#1342).
  SnapshotRef pawn_snapshot = 45;
}
message PawnTendDoctor {
  // NativePawnControlState eligibility: a drafter exists, the pawn is spawned,
  // alive, not downed, not in a mental state and player-controlled. This is
  // the gate whose native refusal reads "Tend requires an eligible doctor".
  optional bool control_eligible = 1;
  optional bool spawned = 2; optional bool has_drafter = 3;
  // WorkGiver_Tend.MissingRequiredCapacity(pawn) == null; missing_capacity
  // names the failing PawnCapacityDef when it does not.
  optional bool capacities_ok = 4; optional string missing_capacity = 5;
  // WorkTypeIsDisabled(Doctor): the same gate the work settings report, read
  // here from the pawn so a doctor row carries it without PawnDetails.work.
  optional bool work_type_disabled = 6;
  // Pawn IDs from this same reply this pawn can reach
  // (CanReach ClosestTouch, Danger.Deadly); self is excluded. The list is
  // exhaustive over the reply's other rows unless an issue names
  // reachable_pawn_ids.
  repeated string reachable_pawn_ids = 7;
  repeated ReadIssue issues = 8;
}
message PawnFilter {
  repeated string ids = 1; optional string name_contains = 2; optional bool colonist = 3; optional bool prisoner = 4;
  optional bool animal = 5; optional bool humanlike = 6; optional bool mechanoid = 7; optional bool tame = 8;
  optional bool wild = 9; optional bool hostile = 10; optional bool downed = 11; optional bool drafted = 12;
  optional bool include_dead = 13; optional double within_colonist_distance = 14;
}
message PawnDetails {
  optional bool needs = 1; optional bool health = 2; optional bool equipment = 3; optional bool biography = 4; optional bool settings = 5;
  optional bool social = 6; optional bool animals = 7; optional bool visible_hediffs_only = 8; optional bool work = 9;
  // schedule projects PawnSettings.schedule (the 24 TimetableSlot rows) on its own, independent of settings (care policy) and work (priorities).
  optional bool schedule = 10;
  // tend projects PawnState.tend_doctor: the native tend gates plus pairwise
  // reachability across the rows this query returns. Opt-in; reachability is
  // quadratic in the page and is bounded to 64 rows.
  optional bool tend = 11;
}
message PawnSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated PawnState pawns = 2; Completeness completeness = 3; reserved 4;
  // Colony fact (#1313): the Meditate TimeAssignmentDef exists
  // (DefDatabase<TimeAssignmentDef>.GetNamedSilentFail("Meditate")); false on Core only.
  optional bool meditate_assignment_available = 5; }
message ListPawnsRequest { ReadScope scope = 1; PawnFilter filter = 2; PawnDetails details = 3; reserved 4, 5; }
message ListPawnsReply { oneof outcome { PawnSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }

// Closed vanilla value sets read off pawns, stock and bills (#1341).
enum HungerCategory { HUNGER_CATEGORY_UNSPECIFIED = 0; HUNGER_CATEGORY_FED = 1; HUNGER_CATEGORY_HUNGRY = 2; HUNGER_CATEGORY_URGENTLY_HUNGRY = 3; HUNGER_CATEGORY_STARVING = 4; }
// BreakRisk is the mental-break band the mood sits in.
enum BreakRisk { BREAK_RISK_UNSPECIFIED = 0; BREAK_RISK_NONE = 1; BREAK_RISK_MINOR = 2; BREAK_RISK_MAJOR = 3; BREAK_RISK_EXTREME = 4; }
// HolderKind is what holds a held stack: a building container, a corpse's
// inventory, a living pawn's inventory or its carry tracker.
enum HolderKind { HOLDER_KIND_UNSPECIFIED = 0; HOLDER_KIND_CONTAINER = 1; HOLDER_KIND_CORPSE = 2; HOLDER_KIND_PAWN_INVENTORY = 3; HOLDER_KIND_CARRIED = 4; }
enum RotStage { ROT_STAGE_UNSPECIFIED = 0; ROT_STAGE_FRESH = 1; ROT_STAGE_ROTTING = 2; ROT_STAGE_DESSICATED = 3; }
// WasteKind is why an item is waste: a rotten corpse, spoiled food, or an
// item the caller named unwanted.
enum WasteKind { WASTE_KIND_UNSPECIFIED = 0; WASTE_KIND_CORPSE = 1; WASTE_KIND_SPOILED = 2; WASTE_KIND_UNWANTED = 3; }
// BenchUnusableReason is why a bench takes no bills.
enum BenchUnusableReason { BENCH_UNUSABLE_REASON_UNSPECIFIED = 0; BENCH_UNUSABLE_REASON_NOT_PLAYER_OWNED = 1; BENCH_UNUSABLE_REASON_FORBIDDEN = 2; BENCH_UNUSABLE_REASON_BURNING = 3; BENCH_UNUSABLE_REASON_NOT_USABLE_FOR_BILLS = 4; BENCH_UNUSABLE_REASON_OTHER = 5; }
// One stack a stock row counts (#1342): the thing, the cell its units are
// at (its holder's when held), its supply CAS token when it is allowable,
// and for a packed (minified) item the building inside it, for a
// RelocateIntent install, with that building's quality (QualityCategory
// ordinal, 0 Awful .. 6 Legendary; absent without one) and the packed
// item's market value (#1194).
message StockItem {
  rimgovernor.common.v1.Ref item = 1; rimgovernor.common.v1.Cell cell = 2; SnapshotRef snapshot = 3;
  rimgovernor.common.v1.Ref inner = 4; optional string inner_def_name = 5; optional int32 quality = 6; optional double market_value = 7;
}
message HeldStock { rimgovernor.common.v1.Ref holder = 1; optional HolderKind holder_kind = 2; optional int64 units = 3; }
message CorpseState { rimgovernor.common.v1.Ref corpse = 1; rimgovernor.common.v1.Ref inner_pawn = 2; optional string race = 3; optional bool humanlike = 4; optional bool was_colonist = 5; optional RotStage rot_stage = 6; }
message ResourceStock {
  DefinitionRef definition = 1; optional int64 units = 2; optional int64 stacks = 3; optional int64 spawned = 4;
  optional int64 carried = 5; optional int64 in_container = 6; optional int64 ours = 7; optional int64 ours_unforbidden = 8;
  optional int64 forbidden = 9; optional int64 player_faction = 10; optional int64 other_faction = 11;
  optional int64 trader_stock = 12; optional int64 fogged = 13; optional int64 reserved = 14;
  optional int64 in_stockpile = 15; optional int64 in_home_area = 16; reserved 17; repeated StockItem items = 29;
  repeated HeldStock holders = 18; repeated CorpseState corpses = 19; reserved 20;
  reserved 21; reserved 22; repeated ReadIssue issues = 23;
  SnapshotRef snapshot = 24;
  // Weapon class of the row's definition: ranged/melee are ThingDef.IsRangedWeapon/IsMeleeWeapon, which cover every equippable
  // (a wood log and a beer are melee weapons); weapon_by_trade is membership in the Weapons thing category (what a stockpile calls a weapon).
  optional bool weapon_by_trade = 25; optional bool ranged = 26; optional bool melee = 27;
  // Biocode facts keyed by items' exact identities.
  // Only weapon rows carry these; older producers omit them.
  repeated GearItem weapon_items = 28;
}
// StockCategory and StockOwnership scope a supplies read; absent means HAULABLE and OURS.
enum StockCategory { STOCK_CATEGORY_UNSPECIFIED = 0; STOCK_CATEGORY_HAULABLE = 1; STOCK_CATEGORY_FOOD = 2; STOCK_CATEGORY_WEAPONS = 3; STOCK_CATEGORY_BUILDINGS = 4; STOCK_CATEGORY_ALL = 5; }
enum StockOwnership { STOCK_OWNERSHIP_UNSPECIFIED = 0; STOCK_OWNERSHIP_OURS = 1; STOCK_OWNERSHIP_ALL = 2; }
message StockFilter { repeated string def_names = 1; optional StockCategory category = 2; optional StockOwnership ownership = 3; optional bool include_held = 4; optional bool forbidden_only = 5; optional bool exclude_chunks = 6; optional bool corpses = 7; Rectangle region = 8; }
message SuppliesSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated ResourceStock stocks = 2; Completeness completeness = 3; }
message ListSuppliesRequest { ReadScope scope = 1; StockFilter filter = 2; reserved 3; }
message ListSuppliesReply { oneof outcome { SuppliesSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message IngredientRequirement { repeated string allowed_def_names = 1; optional double required = 2; optional double available = 3; optional double missing = 4; optional bool complete = 5; repeated ReadIssue issues = 6; repeated Quantity alternatives = 7; } // alternatives: required units per allowed definition when the count depends on the material chosen.
message FilterSpecialRule { optional string def_name = 1; optional bool allowed = 2; }
message StockpileFilter {
  repeated string allowed_def_names = 1; repeated FilterSpecialRule special_rules = 2;
  optional double hit_points_min = 3; optional double hit_points_max = 4; optional string quality_min = 5; optional string quality_max = 6;
  optional bool allow_fresh = 7; optional bool allow_rotten = 8; reserved 9;
}
message BillState {
  optional bool default_ingredients = 25; // Filter matches a new Auto bill, including food routing and special filters.
  optional bool unrestricted_worker = 26; // No skill or worker-category restriction; worker_id separately records a pinned pawn.
  optional bool managed_unchanged = 24; // Current-load controller bill with unchanged player settings.
  optional string id = 1; reserved 2; reserved "index"; DefinitionRef recipe = 3; optional string bill_class = 4;
  optional rimgovernor.operations.v1.RepeatMode repeat_mode = 5; optional int32 repeat_count = 6; optional int32 target_count = 7; optional int32 unpause_below = 8;
  optional bool pause_when_satisfied = 9; optional bool paused = 10; optional bool suspended = 11; optional bool finished = 12;
  rimgovernor.common.v1.Ref worker = 13; optional int32 skill_min = 14; optional int32 skill_max = 15; optional double ingredient_radius = 16;
  StockpileFilter ingredient_filter = 17; optional rimgovernor.operations.v1.StoreMode store_mode = 18; rimgovernor.common.v1.Ref store_zone = 19;
  optional bool can_run_now = 20; repeated string blockers = 21; repeated IngredientRequirement ingredients = 22; repeated ReadIssue issues = 23;
  // Live bill jobs' promised ingredients (#1354): one row per spawned pawn
  // whose current job works this bill, the spawned things it has queued or
  // placed. Go's material budget subtracts them from free stock.
  repeated IngredientReservation reservations = 27;
}
message IngredientReservation { optional string pawn_id = 1; repeated Quantity items = 2; }
message BillStack { SnapshotRef snapshot = 1; rimgovernor.common.v1.Ref bench = 2; optional bool usable = 3; optional BenchUnusableReason unusable_reason = 4; optional uint32 capacity = 5; repeated BillState bills = 6; reserved 7; }
message RecipeState {
  DefinitionRef recipe = 1; optional bool available_now = 2; optional bool available_on_bench = 3; optional double work_amount = 4; optional string work_skill = 5;
  repeated SkillRequirement skills = 6; repeated IngredientRequirement ingredients = 7; repeated Quantity products = 8; StockpileFilter default_filter = 9;
  optional string work_type = 10; // WorkTypeDef whose DoBill giver serves the recipe's bench; the type a worker must enable.
  repeated string bench_defs = 11; // Player-buildable bench definitions hosting the recipe (catalog reads without bench_id).
  repeated string research_prerequisites = 12; // ResearchProjectDefs the recipe itself requires; empty when only its bench gates it.
  optional double mood = 13; // Base product taste thought; pawn traits/precepts can override it.
  RecipeIngredientClasses ingredient_classes = 14; // Each slot is required; classes within a slot are alternatives.
  optional double nutrient_efficiency = 15; // Total product nutrition / input nutrition, including batch size.
  optional double work_per_nutrition = 16; // Native work units / total product nutrition.
  optional bool needs_power = 17; // This bench's power requirement, not its current power state.
}
enum FoodIngredientClass {
  FOOD_INGREDIENT_CLASS_UNSPECIFIED = 0;
  FOOD_INGREDIENT_CLASS_MEAT = 1;
  FOOD_INGREDIENT_CLASS_VEGETABLE = 2;
  FOOD_INGREDIENT_CLASS_ANIMAL_PRODUCT = 3;
  FOOD_INGREDIENT_CLASS_ANY = 4;
}
message FoodIngredientSlot { repeated FoodIngredientClass alternatives = 1; }
message RecipeIngredientClasses { repeated FoodIngredientSlot slots = 1; }
message BuildingSettings {
  SnapshotRef snapshot = 1; optional bool forbidden = 2; optional bool flickable = 3; optional bool desired_switch_on = 4;
  optional bool switch_on = 5; optional bool flick_designated = 6; optional bool connected = 7; optional bool powered = 8;
  optional double target_temperature_c = 9; optional bool medical = 10; optional bool for_prisoners = 11; reserved 12;
  repeated rimgovernor.common.v1.Ref assigned_pawns = 13; optional uint32 maximum_assigned_pawns = 14; repeated rimgovernor.common.v1.Ref assigning_candidates = 15;
  optional bool room_can_be_prison_cell = 16; repeated ReadIssue issues = 17;
  // crop_def_name is a plant grower's current crop beside its own CAS snapshot (BuildingPatchIntent.plant_def).
  optional string crop_def_name = 18;
  // player_owned is a claimable building's faction reading beside its own CAS snapshot (BuildingPatchIntent.claim, #459).
  optional bool player_owned = 19;
}
message MaterialDeficit { optional string def_name = 1; optional int64 need = 2; optional int64 have = 3; optional int64 still_needed = 4; }
message ConstructionState { optional double total_work = 1; optional double work_left = 2; optional double percent_complete = 3; repeated MaterialDeficit resources = 4; optional bool resources_complete = 5; optional bool completable_ever = 6; repeated ReadIssue issues = 7; }
message ThermalSide { optional string side = 1; rimgovernor.common.v1.Cell position = 2; rimgovernor.common.v1.Ref room = 3; optional bool outdoors = 4; optional double temperature_c = 5; optional bool fogged = 6; optional bool impassable = 7; repeated ReadIssue issues = 8; }
message BuildingServiceState {
  optional bool connected = 1; optional bool power_on = 2; optional double power_output_w = 3; optional bool switched_on = 4;
  optional double fuel = 5; optional double target_fuel = 6; optional bool out_of_fuel = 7; optional bool broken_down = 8;
  repeated string allowed_fuel_defs = 9; optional string power_net_id = 10; repeated ReadIssue issues = 11;
}
// BuildingStatus is the native construction stage of a building row.
enum BuildingStatus { BUILDING_STATUS_UNSPECIFIED = 0; BUILDING_STATUS_BLUEPRINT = 1; BUILDING_STATUS_FRAME = 2; BUILDING_STATUS_BUILT = 3; }
// BuildingState is the canonical building row (#1343), built by one native
// builder: only the bundle's building table and the list read carry it;
// every other message points at a building by Ref (#1342), which the
// reader resolves against the table. service and settings.forbidden are set on
// every row.
message BuildingState {
  EntityRef building = 1; optional rimgovernor.placement.v1.Rotation rotation = 2; optional string stuff = 3; rimgovernor.common.v1.Ref faction = 4;
  optional BuildingStatus status = 5; optional string build_def_name = 6; optional string install_of_def_name = 7;
  optional int32 hit_points = 8; optional int32 max_hit_points = 9; reserved 10; reserved "occupied_cells";
  ConstructionState construction = 11; BuildingServiceState service = 12; BuildingSettings settings = 13;
  repeated ThermalSide thermal_sides = 14; BillStack bills = 15; optional string inspect_text = 16;
  optional bool burning = 17; optional bool uses_hit_points = 18; repeated ReadIssue issues = 19;
  SnapshotRef snapshot = 20;
  reserved 21;
  // The building's occupied rect, inclusive (#1346).
  Rectangle occupied = 22;
}
message PowerNetwork {
  optional string id = 1; optional uint32 producers = 2; optional uint32 consumers = 3; optional uint32 batteries = 4;
  optional uint32 transmitters = 5; optional uint32 connectors = 6; optional double generation_w = 7; optional double consumption_w = 8;
  optional double net_w = 9; optional double stored_watt_days = 10; optional double capacity_watt_days = 11;
  optional bool has_source = 12; optional bool has_active_source = 13; repeated string flags = 14;
  repeated string member_ids = 15; reserved 16;
}
message BuildingsSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated BuildingState buildings = 2; repeated PowerNetwork power_networks = 3; Completeness completeness = 4; reserved 5; reserved 6, 7, 8, 9; }
message ListBuildingsRequest { ReadScope scope = 1; repeated string ids = 2; repeated string def_names = 3; repeated string statuses = 4; optional string category = 5; optional bool player_only = 6; optional double damaged_below_fraction = 7; Rectangle region = 8; optional bool inspect = 9; optional bool bill_ingredients = 10; reserved 11, 12; }
message ListBuildingsReply { oneof outcome { BuildingsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message RoomStat { optional string def_name = 1; optional double value = 2; optional string display = 3; optional string unit = 4; optional string cost = 5; rimgovernor.common.v1.Unavailable unavailable = 6; }
message RoomBedMembership { reserved 1; rimgovernor.common.v1.Ref building = 5; repeated rimgovernor.common.v1.Ref owners = 2; repeated rimgovernor.common.v1.Ref users = 3; repeated rimgovernor.common.v1.Ref accessible_to = 4; }
message StockpileMembership { rimgovernor.common.v1.Ref zone = 1; repeated ResourceStock contents = 2; reserved 3; }
message RoomState {
  optional string id = 1; optional string role = 2; optional string label = 3; optional bool proper_room = 4; optional bool doorway = 5;
  optional bool outdoors = 6; optional bool psychologically_outdoors = 7; optional bool touches_map_edge = 8; optional bool fogged = 9;
  optional double temperature_c = 10; optional uint32 open_roof_count = 11; optional uint32 cell_count = 12;
  Rectangle extents = 13; rimgovernor.common.v1.Cell center = 14;
  reserved 15, 16; reserved "cells"; repeated RoomStat stats = 17; repeated rimgovernor.common.v1.Ref pawns = 18;
  reserved 19; repeated rimgovernor.common.v1.Ref beds = 28; repeated rimgovernor.common.v1.Ref stockpile_zones = 20; repeated Quantity contents = 21;
  reserved 22; repeated ReadIssue issues = 23;
  SnapshotRef snapshot = 24; repeated RoomBedMembership bed_memberships = 25; repeated StockpileMembership stockpile_memberships = 26;
  repeated RoomDoor doors = 27; // Doors in the room's boundary: door cell, the cell it opens onto, and whether that side is outdoors.
  // The room's key in the whole-map cell grid (CellGrid.room, #1346): the
  // row-major map index of its first unfogged cell; its cells are the grid
  // cells carrying it. Absent when every cell is fogged.
  optional string grid_room = 29;
}
message RoomDoor { rimgovernor.common.v1.Cell cell = 1; rimgovernor.common.v1.Cell outside = 2; optional bool outdoors = 3; }
message RoomsSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated RoomState rooms = 2; Completeness completeness = 3; }
message ListRoomsRequest { ReadScope scope = 1; Rectangle region = 2; optional bool include_outdoors = 3; optional bool include_boundary = 4; reserved 5; reserved "include_cells"; repeated string room_ids = 6; reserved 7; }
message ListRoomsReply { oneof outcome { RoomsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message ZoneState {
  reserved 1; reserved "snapshot"; optional string id = 2; optional string label = 3; optional string type = 4; Rectangle bounds = 5;
  optional string priority = 6; optional string crop_def_name = 7; optional bool explicitly_set_crop = 8;
  optional bool allow_sow = 9; optional bool allow_cut = 10; StockpileFilter filter = 11;
  reserved 12, 13; reserved "listed_cells", "grid_cells";
  optional uint32 slot_group_cells = 14; optional uint32 haul_grid_cells = 15; optional bool consistent = 16;
  optional bool contiguous = 17; reserved 18; repeated Quantity contents = 19;
  optional uint32 free_cells = 20; optional uint32 blocked_cells = 21; optional uint32 impassable_cells = 22;
  optional uint32 crop_plants_in_listed_cells = 23; optional uint32 crop_plants_in_grid_cells = 24;
  reserved 25; reserved 26; repeated ReadIssue issues = 27;
  FarmFacts farm = 28; optional bool food_storage = 29;
}
message ZonesSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated ZoneState zones = 2; Completeness completeness = 3; reserved 4, 5, 6, 7; reserved "map_snapshot"; }
message ListZonesRequest { ReadScope scope = 1; repeated string ids = 2; optional string name_contains = 3; Rectangle region = 4; reserved 5; reserved "include_cells"; optional bool include_contents = 6; optional bool include_filter = 7; reserved 8, 9; }
message ListZonesReply { oneof outcome { ZonesSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// A thing's canonical row (#1343), from one native builder: the cells
// read's things and the bundle's things table. thing.snapshot is the
// thing's own CAS token. The food facts (14-27) are set for an ingestible
// item or a corpse: rot_ticks at the current ambient temperature,
// temperature_c that ambient temperature, roofed and room_id where a
// spawned thing stands; a corpse adds forbidden, its meat yield
// (meat_amount), body size, a one-cell footprint and whether it is
// humanlike.
message Thing { EntityRef thing = 1; optional string class_name = 2; optional int64 stack_count = 3; optional string stuff = 4; optional int32 hit_points = 5; optional bool forbidden = 6; repeated rimgovernor.common.v1.Ref owners = 7; optional bool medical = 8; optional double growth = 9; optional bool harvestable_now = 10; optional string build_def_name = 11; optional bool blueprint = 12; optional bool frame = 13;
  optional bool perishable = 14; optional int64 rot_ticks = 15; optional double temperature_c = 16; optional bool roofed = 17; rimgovernor.common.v1.Ref room = 18;
  optional bool corpse = 19; optional double meat_amount = 20; optional double body_size = 21; optional int64 tile_footprint = 22;
  optional bool is_human_meat = 23; optional bool is_humanlike = 24; optional bool vegetable = 25; optional bool raw_meat = 26; optional FoodIngredientClass raw_class = 27;
  // The thing's own CAS token (#1342).
  SnapshotRef snapshot = 28; }
message ThingsSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated Thing things = 2; }
// One observations_get_cells read (#1346): the map's dimensions and the
// requested rectangle as a CellGrid keyframe (mirror.proto's arrays and
// sentinels: a fogged cell is not held; glow is artificial light only).
// room keys a native room by the whole-map row-major index of its first
// held cell inside the read. foundation, when requested, is one byte per
// grid cell (row-major, 0 on a cell the grid does not hold): bit 0
// supports_heavy (the terrain takes a wall), bit 1 supports_light, bit 2
// resource_rock (mineable ore), bit 3 tree, bit 4 bridgeable, bit 5 dries
// (a moisture pump dries it), each of the natural ground under any
// bridge or floor. things, when requested, are the canonical rows (#1343)
// of the things standing on the grid's held cells, each once, in id
// order, at its own thing.position.
message CellsSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1; MapSize map_size = 2;
  rimgovernor.mirror.v1.CellGrid grid = 11; bytes foundation = 12; repeated Thing things = 13;
  reserved 3 to 10; reserved "region", "cells", "applied_fields", "compact", "map_snapshot";
}
// GetCellsRequest reads the inclusive rectangle, on the map, of at most
// 1048576 cells.
message GetCellsRequest {
  ReadScope scope = 1; Rectangle rectangle = 2; optional bool foundation = 8; optional bool things = 9;
  reserved 3 to 7; reserved "exact_cells", "fields", "compact";
}
message GetCellsReply { oneof outcome { CellsSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message ResearchUnlock { optional string def_name = 1; optional string native_type = 2; optional string label = 3; }
// TechLevel is the vanilla TechLevel.
enum TechLevel { TECH_LEVEL_UNSPECIFIED = 0; TECH_LEVEL_UNDEFINED = 1; TECH_LEVEL_ANIMAL = 2; TECH_LEVEL_NEOLITHIC = 3; TECH_LEVEL_MEDIEVAL = 4; TECH_LEVEL_INDUSTRIAL = 5; TECH_LEVEL_SPACER = 6; TECH_LEVEL_ULTRA = 7; TECH_LEVEL_ARCHOTECH = 8; }
message ResearchProject {
  DefinitionRef project = 1; optional string tab = 2; optional string category = 3; optional TechLevel tech_level = 4;
  optional double base_cost = 5; optional double apparent_cost = 6; optional double cost_factor = 7; optional double progress = 8;
  optional double progress_fraction = 9; optional bool finished = 10; optional bool current = 11; optional bool available = 12;
  optional bool can_start = 13; repeated string prerequisites = 14; repeated string hidden_prerequisites = 15;
  optional uint32 techprints_applied = 16; optional uint32 techprints_needed = 17; optional string required_building = 18;
  repeated string required_facilities = 19; repeated string lock_reasons = 20; optional string lock_detail = 21;
  repeated ResearchUnlock unlocks = 22; reserved 23; repeated ReadIssue issues = 24;
}
message Researcher { rimgovernor.common.v1.Ref pawn = 1; optional double intellectual = 2; optional int32 priority = 3; optional bool disabled = 4; optional bool ever_work = 5; optional bool active = 6; }
message ResearchFacility { DefinitionRef definition = 1; optional bool active = 2; }
message ResearchBench { reserved 1; rimgovernor.common.v1.Ref building = 4; repeated ResearchFacility facilities = 2; repeated ReadIssue issues = 3; }
message ResearchSlot { optional string category = 1; optional string current_project = 2; }
// finished names every finished project, whatever the request filters.
message ResearchSnapshot { rimgovernor.common.v1.ObservationContext context = 1; SnapshotRef snapshot = 2; repeated ResearchSlot slots = 3; repeated ResearchProject projects = 4; repeated ResearchBench benches = 5; repeated Researcher researchers = 6; optional bool anomaly_active = 7; optional string player_tech_level = 8; Completeness completeness = 9; repeated string finished = 10; }
// progress_only (#1340) lists only the current projects, with their lock
// reasons, and the started unfinished ones, each without the static fields
// the definition catalog carries (costs, prerequisites, tab, tech level,
// required bench); the other filters are ignored.
message ResearchRequest { ReadScope scope = 1; optional bool include_locked = 2; optional bool include_finished = 3; optional bool include_unlocks = 4; optional bool include_capability = 5; optional string name_contains = 6; reserved 7; optional bool progress_only = 8; }
message ResearchReply { oneof outcome { ResearchSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }

message AccessTarget { rimgovernor.common.v1.Cell cell = 1; optional bool native_reachable = 2; optional bool projected_reachable = 3; optional uint32 projected_steps = 4; }
message PawnAccess { rimgovernor.common.v1.Ref pawn = 1; optional uint32 current_cells = 2; optional uint32 projected_cells = 3; repeated AccessTarget targets = 6; rimgovernor.common.v1.Cell projected_origin = 7; optional uint32 egress_steps = 8; optional bool loses_access = 10; reserved 4, 5, 9;
  // The pawn's cell when the access was read (#1342).
  rimgovernor.common.v1.Cell position = 11; }
message SpatialAccessSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated PawnAccess pawns = 2; optional uint32 map_cells = 3; optional uint32 observed_walkable_cells = 4; reserved 5; }
message SpatialAccessRequest { ReadScope scope = 1; repeated rimgovernor.common.v1.Cell blocked_cells = 2; repeated rimgovernor.common.v1.Cell target_cells = 3; repeated string pawn_ids = 4; }
message SpatialAccessReply { oneof outcome { SpatialAccessSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Defense site census: bounded terrain, cover and raider-approach facts for
// layout planning. cover_fill is the native edifice/cover fillPercent the
// shooting model uses (0 when open); edge_reachable is native ground
// reachability from the cell to any map edge without opening doors, the
// ordinary walk-in raid approach. Every cell of the requested rectangle.
message DefenseCell {
  rimgovernor.common.v1.Cell cell = 1; optional bool fogged = 2; optional bool walkable = 3; optional bool passable = 4;
  optional double cover_fill = 5; optional bool blocks_sight = 6; optional string edifice_def_name = 7; optional bool player_owned = 8;
  optional bool natural_rock = 9; optional bool edge_reachable = 10; optional bool home_area = 11; optional string terrain = 12;
  optional bool door = 13; repeated ReadIssue issues = 14;
  // The thing whose fillPercent cover_fill reports (GetCover, else the
  // edifice), with the clearance designation ordinary work would need.
  // Absent when the cell is open.
  optional string cover_thing_id = 15; optional string cover_def_name = 16; optional CoverKind cover_kind = 17;
  reserved 18; reserved "cover_token";
  optional bool cover_designated = 19;
  // The cell's foundation (a Bridge) is designated for removal (#954).
  optional bool foundation_removal_designated = 20;
  // The edifice's stuff def (WoodLog, Plasteel), absent for a stuffless one (#1065).
  optional string edifice_stuff_def_name = 21;
  // The cell is under any roof (#1122: a burn-out's seal holds its heat).
  optional bool roofed = 22;
}
// How the game's own designators would remove a cover thing.
enum CoverKind { COVER_KIND_UNSPECIFIED = 0; COVER_KIND_PLANT = 1; COVER_KIND_CHUNK = 2; COVER_KIND_MINEABLE = 3; COVER_KIND_BUILDING = 4; }
// One hostile lord observed on the map since load: where its first pawn was
// seen (ground when on the map edge), and a bounded trail of one of its
// pawns sampled every RaidTrack.SampleInterval ticks, so a census can find
// where the raid crossed its boundary. Session-scoped, like traffic.
message RaidTrack {
  optional string lord_id = 1; optional string faction_def = 2; optional int64 spawn_tick = 3; rimgovernor.common.v1.Cell spawn = 4;
  optional bool ground = 5; repeated rimgovernor.common.v1.Cell trail = 6; optional int64 last_tick = 7;
}
// cover_threshold is the lowest positive fillPercent among loaded defs: the
// floor below which nothing on the map gives CoverUtility a block chance.
message DefenseSiteSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1; MapSize map_size = 2; Rectangle region = 3; repeated DefenseCell cells = 4; reserved 5;
  optional double cover_threshold = 6; repeated RaidTrack raids = 7;
}
message DefenseSiteRequest { ReadScope scope = 1; Rectangle region = 2; }
message DefenseSiteReply { oneof outcome { DefenseSiteSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Lines of fire: native GenSight line of sight and CoverUtility overall block
// chance for every (firing, approach) pair. target_cover is the chance a
// target at `to` is protected from a shooter at `from`; shooter_cover is the
// reverse. At most 64 firing and 64 approach cells (4096 pairs) per read.
message LineOfFire { rimgovernor.common.v1.Cell from = 1; rimgovernor.common.v1.Cell to = 2; optional bool line_of_sight = 3; optional double target_cover = 4; optional double shooter_cover = 5; optional double distance = 6; repeated ReadIssue issues = 7; }
message LinesOfFireSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated LineOfFire lines = 2; reserved 3; }
message LinesOfFireRequest { ReadScope scope = 1; repeated rimgovernor.common.v1.Cell firing_cells = 2; repeated rimgovernor.common.v1.Cell approach_cells = 3; }
message LinesOfFireReply { oneof outcome { LinesOfFireSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
message RoofSupportCell { rimgovernor.common.v1.Cell cell = 1; optional string roof_def_name = 2; optional bool supported_without_target = 3; optional string blocker = 4; }
message RoofSupportSnapshot { rimgovernor.common.v1.ObservationContext context = 1; rimgovernor.common.v1.Ref target = 2; repeated RoofSupportCell roofs = 3; reserved 4; }
message RoofSupportRequest { ReadScope scope = 1; optional string target_id = 2; }
message RoofSupportReply { oneof outcome { RoofSupportSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Excavation reads certify a requested set of rock cells for staged room/corridor
// excavation. Unlike surface mining, roofed cells are admissible; support is a
// counterfactual check that every remaining roof stays within the native support
// radius of a holder after all requested cells are removed. Fogged cells are unknown.
enum ExcavationSupport { EXCAVATION_SUPPORT_UNSPECIFIED = 0; EXCAVATION_SUPPORT_SUPPORTED = 1; EXCAVATION_SUPPORT_UNKNOWN = 2; EXCAVATION_SUPPORT_UNSUPPORTED = 3; }
message ExcavationCell {
  rimgovernor.common.v1.Cell cell = 1; optional bool fogged = 2; optional string mineable_def_name = 3; optional string mineable_id = 4;
  optional int32 hit_points = 5; optional string roof_def_name = 6; optional bool holds_roof = 7; optional bool walkable = 8;
  optional bool mine_designated = 9; optional bool eligible = 10; optional string blocker = 11; reserved 12;
}
message ExcavationSiteSnapshot {
  rimgovernor.common.v1.ObservationContext context = 1; repeated ExcavationCell cells = 2;
  ExcavationSupport support_after_removal = 3; optional uint32 roof_cells_checked = 4; optional string support_blocker = 5;
  optional bool collapse_pending = 6; optional bool worker_available = 7; repeated string worker_ids = 8;
  optional bool access_reachable = 9; reserved 10;
}
message ExcavationSiteRequest { ReadScope scope = 1; repeated rimgovernor.common.v1.Cell cells = 2; rimgovernor.common.v1.Cell access_cell = 3; }
message ExcavationSiteReply { oneof outcome { ExcavationSiteSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// Plant cut census (#1547): for up to 1024 exact cells, the undesignated
// non-crop plants still standing, the plants AreaPlantCutIntent would
// designate. chop_wood marks a harvestable tree (chop-wood). Fogged and
// out-of-bounds cells report nothing.
message PlantCutCensusRequest { ReadScope scope = 1; repeated rimgovernor.common.v1.Cell cells = 2; }
message PlantCutTarget { rimgovernor.common.v1.Ref plant = 1; optional bool chop_wood = 2; rimgovernor.common.v1.Cell cell = 3; }
message PlantCutCensusSnapshot { rimgovernor.common.v1.ObservationContext context = 1; repeated PlantCutTarget plants = 2; }
message PlantCutCensusReply { oneof outcome { PlantCutCensusSnapshot observed = 1; rimgovernor.common.v1.Unavailable unavailable = 2; rimgovernor.common.v1.Failure failure = 3; } }
// One material a stuffed definition may be built from, with the native cost
// list for that material.
message StuffOption { optional string stuff = 1; repeated Quantity costs = 2; }
message WallUpgradeSite {
  rimgovernor.common.v1.Ref target = 1; optional bool target_present = 2; reserved 3;
  repeated rimgovernor.common.v1.Cell backup_cells = 4; repeated Quantity costs = 5;
  repeated ResourceStock materials = 6; repeated rimgovernor.common.v1.Ref workers = 7; optional string blocker = 8;
  optional bool designated = 9; optional string removal_id = 10; optional int64 completed_tick = 11;
  SnapshotRef snapshot = 12; rimgovernor.common.v1.Cell normal = 13;
  reserved 14 to 18;
  rimgovernor.common.v1.Ref original = 22; rimgovernor.common.v1.Ref left_support = 23; rimgovernor.common.v1.Ref right_support = 24;
  repeated rimgovernor.common.v1.Ref completed_backups = 25; rimgovernor.common.v1.Ref replacement = 26;
  // The target's CAS token for the upgrade's guarded operations (#1342).
