message RecoverySnapshot { rimgovernor.common.v1.ObservationContext context = 1; reserved 2, 3; reserved "roof_hazard", "areas"; repeated RecoveryRestriction restrictions = 4; reserved 5, 6; repeated rimgovernor.common.v1.Ref buildings = 7; }
message RecoveryRequest { ReadScope scope = 1; reserved 2; }
