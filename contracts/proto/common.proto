syntax = "proto3";
package rimgovernor.common.v1;
option csharp_namespace = "RimGovernor.Protocol.Common";
option go_package = "github.com/davidarcher/RimGovernor/go/internal/wire/commonpb;commonpb";

// Plain precepts are the exact issue selections; role, ritual and building
// instances are initialized/preserved by the normal game creation/reform path.
message IdeoligionDesign {
  repeated string memes = 1;
  repeated string precepts = 2;
  optional bool fluid = 3;
}

// Presence is significant: map zero and tick zero are valid observations.
message Identity {
  optional string colony_id = 1;
  optional string load_token = 2;
  optional int32 map_id = 3;
}

// A session participant is scoped to the same world as the observation/action.
// Map and ship targets resolve on that map; settlement trades name our caravan.
message TradeTarget {
  oneof kind {
    MapTradeTarget map_trader = 1;
    SettlementTradeTarget settlement = 2;
    OrbitalTradeTarget orbital_ship = 3;
  }
}
message MapTradeTarget { optional string trader_id = 1; }
message SettlementTradeTarget { optional string settlement_id = 1; optional string caravan_id = 2; }
message OrbitalTradeTarget { optional string ship_id = 1; }
enum TradeRequestKind { TRADE_REQUEST_KIND_UNSPECIFIED = 0; TRADE_REQUEST_KIND_CARAVAN = 1; TRADE_REQUEST_KIND_ORBITAL = 2; }

message ObservationContext {
  Identity identity = 1;
  optional int64 tick = 2;
  optional uint64 native_generation = 3;
}

// Attempts are allocated per action, within a durable controller namespace.
message AttemptKey {
  optional string controller_session_id = 1;
  optional string action_id = 2;
  optional uint64 attempt_id = 3;
}

// A pointer at a thing, pawn, building, zone, bill, room or faction by its
// load id. Definition, label and position come from the row it
// resolves to (the frame's tables) and the definition catalog, never from
// the reference.
message Ref {
  optional string id = 1;
}

message Cell {
  optional int32 x = 1;
  optional int32 z = 2;
}

// Whose corpse a thing is: the player faction's humanlike
// (colonists and slaves), any other humanlike, or an animal.
enum CorpseClass { CORPSE_CLASS_UNSPECIFIED = 0; CORPSE_CLASS_COLONIST = 1; CORPSE_CLASS_STRANGER = 2; CORPSE_CLASS_ANIMAL = 3; }

// A rotting thing's stage (Verse RotStage).
enum RotStage { ROT_STAGE_UNSPECIFIED = 0; ROT_STAGE_FRESH = 1; ROT_STAGE_ROTTING = 2; ROT_STAGE_DESSICATED = 3; }

// How RimWorld answers the same request again. Native sets it on a refusal;
// a refusal without one is unknown. PERMANENT: the game refuses it until the
// world changes materially (or never). TRANSIENT: it may succeed once the
// world changes. UNKNOWN: native cannot say; never silently banned.
enum RefusalClass {
  REFUSAL_CLASS_UNSPECIFIED = 0;
  REFUSAL_CLASS_PERMANENT = 1;
  REFUSAL_CLASS_TRANSIENT = 2;
  REFUSAL_CLASS_UNKNOWN = 3;
}

enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  FAILURE_CODE_INVALID_REQUEST = 1;
  FAILURE_CODE_UNAVAILABLE = 2;
  FAILURE_CODE_STALE_IDENTITY = 3;
  FAILURE_CODE_STALE_GENERATION = 4;
  FAILURE_CODE_AUTHORITY_REQUIRED = 5;
  FAILURE_CODE_LEASE_EXPIRED = 6;
  FAILURE_CODE_OWNER_CONFLICT = 7;
  FAILURE_CODE_ATTEMPT_CONFLICT = 8;
  FAILURE_CODE_CAPACITY_EXHAUSTED = 9;
  FAILURE_CODE_NOT_FOUND = 10;
  FAILURE_CODE_UNSUPPORTED = 11;
  FAILURE_CODE_NATIVE_FAILURE = 12;
  FAILURE_CODE_CANCELLED = 13;
  FAILURE_CODE_DEADLINE_EXCEEDED = 14;
  // In-place wall replacement (#2529): no built wall at the cell, vanilla refuses
  // the replacement blueprint, or the swap would drop a roof's last holder.
  FAILURE_CODE_NO_WALL_TO_REPLACE = 15;
  FAILURE_CODE_WALL_REPLACEMENT_REFUSED = 16;
  FAILURE_CODE_WALL_REPLACEMENT_STRANDS_ROOF = 17;
}

// Used before command admission. An uncertain admitted write requires a receipt.
message Failure {
  optional FailureCode code = 1;
  optional string detail = 2;
  ObservationContext observed_context = 3;
  optional RefusalClass refusal_class = 4;
}

enum UnavailableReason {
  UNAVAILABLE_REASON_UNSPECIFIED = 0;
  UNAVAILABLE_REASON_NOT_LOADED = 1;
  UNAVAILABLE_REASON_NOT_OBSERVED = 2;
  UNAVAILABLE_REASON_UNSUPPORTED = 3;
  UNAVAILABLE_REASON_READ_FAILED = 4;
  UNAVAILABLE_REASON_STALE = 5;
  UNAVAILABLE_REASON_LIMIT_EXCEEDED = 6;
  UNAVAILABLE_REASON_NOT_REQUESTED = 7;
  UNAVAILABLE_REASON_NOT_APPLICABLE = 8;
  UNAVAILABLE_REASON_HIDDEN = 9;
  UNAVAILABLE_REASON_NATIVE_COMPONENT_MISSING = 10;
}

message Unavailable {
  optional UnavailableReason reason = 1;
  optional string detail = 2;
}
