syntax = "proto3";
package rimgovernor.mirror.v1;
option csharp_namespace = "RimGovernor.Protocol.Mirror";
option go_package = "github.com/davidarcher/RimGovernor/go/internal/wire/mirrorpb;mirrorpb";
import "common.proto";
import "clock.proto";
import "operations.proto";

// Which side a combat pawn fights on.
enum CombatSide {
  COMBAT_SIDE_UNSPECIFIED = 0;
  COMBAT_SIDE_COLONIST = 1;
  COMBAT_SIDE_HOSTILE = 2;
  COMBAT_SIDE_COLONY_ANIMAL = 3;
  COMBAT_SIDE_PRISONER = 4; // a prisoner of the colony breaking out
  COMBAT_SIDE_WILD_ANIMAL = 5; // a wild predator or large animal near a hostile
}

// What a combat pawn's stance is doing.
enum CombatStance {
  COMBAT_STANCE_UNSPECIFIED = 0;
  COMBAT_STANCE_IDLE = 1;
  COMBAT_STANCE_WARMUP = 2;   // aiming
  COMBAT_STANCE_COOLDOWN = 3; // after a shot or blow
  COMBAT_STANCE_MOVING = 4;
  COMBAT_STANCE_MELEE = 5;    // in a melee job
}

// One combat pawn row (BundleSnapshot.combat_pawns). Numbers are thresholded so a
// row only changes when a decision could: fractions to 0.01, bleed and pain
// to 0.05, move speed to 0.1 cells/s.
message CombatPawn {
  optional string id = 1; // load id
  optional CombatSide side = 2;
  rimgovernor.common.v1.Ref faction = 3;
  optional string lord_id = 4;
  rimgovernor.common.v1.Cell cell = 5;
  optional bool downed = 6;
  optional bool dead = 7;
  optional string mental_state = 8; // def name, absent when none
  optional bool drafted = 9;
  optional rimgovernor.operations.v1.CombatFireMode fire_mode = 10; // drafted colonists
  optional string job = 11;       // current job def
  optional string target_id = 12; // current job's target thing
  optional CombatStance stance = 13;
  optional int32 stance_ticks_left = 14; // warmup or cooldown ticks remaining
  optional double health = 15; // summary health fraction
  optional double bleed_rate = 16; // per day
  optional double pain = 17;
  optional double move_speed = 18; // cells per second
  optional double shield_energy = 19; // fraction of max, absent without a shield
  optional bool shield_broken = 20;
  optional string weapon = 21; // def name, absent when unarmed
  optional int32 weapon_warmup_ticks = 23;
  optional int32 weapon_cooldown_ticks = 24;
  // Colonists: worn sharp armor, the stronger of natural armor and
  // the best worn layer (the raid_armor rule per pawn), to 0.05.
  optional double armor = 29;
  // The watermark of the row's last change: when events concerned the pawn
  // since the last compare, the newest of the highest rank (downing or
  // death, then another combat stop kind, then any), the matching combat_events
  // row's; otherwise the capture's. Not part of the change comparison.
  Watermark changed = 26;
  // Rescuer choice: a worn CompShield apparel (shield belt), and the
  // Medicine skill level (absent without skills).
  optional bool shield_belt = 27;
  optional int32 medical_skill = 28;
  // Melee strength: the MeleeDPS stat, to 0.1.
  optional double melee_power = 30;
  // Enemy drugs: a GoJuiceHigh hediff (the pawn fights on past
  // the pain that would down it) and a LuciferiumAddiction hediff.
  optional bool go_juice_high = 31;
  optional bool luciferium_addicted = 32;
  // EMP timing: the stun's ticks left, rounded up to 30, absent when
  // not stunned.
  optional int32 stun_ticks_left = 33;
  // The job target is a mortar, or a frame that will build one:
  // a turret whose verb fires mortar shells.
  optional bool target_mortar = 34;
  // Present after a complete inventory scan; absent means unknown.
  CarriedDrugs carried_drugs = 35;
}

// Distinct drug ThingDefs with positive stack counts in this pawn's inventory.
// A present empty message establishes that the pawn carries no drugs.
message CarriedDrugs { repeated string defs = 1; }

// A damaged player door (BundleSnapshot.combat_doors): hit points
// below max.
message CombatDoorRow {
  optional string id = 1; // load id
  rimgovernor.common.v1.Cell cell = 2;
  optional int32 hit_points = 3;
  optional int32 max_hit_points = 4;
}

// A player mortar (BundleSnapshot.combat_mortars) and its range.
message CombatMortarRow {
  optional string id = 1; // load id
  rimgovernor.common.v1.Cell cell = 2;
  optional float min_range = 3;
  optional float max_range = 4;
  // The loaded shell's ThingDef; absent when unloaded.
  optional string loaded_shell = 5;
}

// What a combat event row records. The combat stop kinds and the non-stops.
enum CombatLogKind {
  COMBAT_LOG_KIND_UNSPECIFIED = 0;
  COMBAT_LOG_KIND_DOWNED = 1;
  COMBAT_LOG_KIND_KILLED = 2;
  COMBAT_LOG_KIND_DAMAGED = 3; // detail carries the damage
  COMBAT_LOG_KIND_SHIELD_BROKEN = 4;
  COMBAT_LOG_KIND_SHOT_FIRED = 5;
  COMBAT_LOG_KIND_PROJECTILE_LAUNCHED = 6;
  COMBAT_LOG_KIND_EXPLOSION = 7;
  COMBAT_LOG_KIND_FIRE_STARTED = 8;
  COMBAT_LOG_KIND_DOOR_OPENED = 9;
  COMBAT_LOG_KIND_DOOR_CLOSED = 10;
  COMBAT_LOG_KIND_BUILDING_DESTROYED = 11;
  COMBAT_LOG_KIND_LORD_TOIL = 12; // detail "<from> -> <to>", raid_strategy set
  COMBAT_LOG_KIND_MENTAL_STATE = 13;
  COMBAT_LOG_KIND_HOSTILE_ARRIVED = 14;
}

// One combat event row (BundleSnapshot.combat_events).
message CombatEventRow {
  Watermark at = 1; // the event's own mark; the row id is "<tick>.<seq>"
  optional CombatLogKind kind = 2;
  // The combat stop kind this event is, armed or not; unset for non-stops.
  optional rimgovernor.clock.v1.CombatEvent stop = 3;
  optional string thing_id = 4;  // the actor or subject
  optional string target_id = 5; // the victim, target or instigator
  optional string def_name = 6;  // weapon, projectile, building or state def
  rimgovernor.common.v1.Cell cell = 7;
  optional string detail = 8;
  // Lord toil rows: the raid strategy def. Hostile arrived rows from a
  // drop-pod arrival mode: "pods".
  optional string raid_strategy = 9;
  // Drop-pod arrival rows: the tick the last pod opens and the
  // cells the pods land on.
  optional int32 open_tick = 10;
  repeated rimgovernor.common.v1.Cell landing_cells = 11;
}

// rimgovernor/combat_geometry: an on-demand read, not mirrored, that
// answers DecideCombat's geometry questions at a stop by the game's own
// rules. Caps: at most MaxGeometryCells cells and MaxGeometryHostiles
// hostiles (the native's CombatGeometry constants, bridge.CombatGeometry*),
// measured on lab-ranged under the 50 ms main-thread budget.
message CombatGeometryRequest {
  rimgovernor.common.v1.Identity identity = 1; // required
  // 1..cap, distinct, in bounds; 0..cap with propose. Named plus proposed
  // cells together score at most the cells cap.
  repeated rimgovernor.common.v1.Cell cells = 2;
  // 1..cap, distinct pawn load ids; 0..cap for named cells alone (their
  // standability), with no propose and no pawn.
  repeated string hostile_ids = 3;
  optional string pawn_id = 4; // optional: path ticks for this pawn to each cell
  // Optional: the native proposes candidate cells for one role and
  // scores them like named cells, in the same read.
  CombatGeometryPropose propose = 5;
}

// A role and its anchor. Every proposal is a standable, in-bounds
// cell not among the named cells, scored against the request's hostiles,
// ranked best first, at most the cells cap minus the named cells (so a
// propose request names at most cap-1 cells). Anchor cells are in bounds.
message CombatGeometryPropose {
  oneof role {
    CombatCoverBehindLine cover_behind_line = 1;
    CombatAdjacentToChoke adjacent_to_choke = 2;
    CombatFiringCells firing_cells = 3;
    CombatRescuePath rescue_path = 4;
  }
}

// The request pawn's route to `to`, from the game pathfinder
// (TraverseParms.For(pawn, Danger.Deadly), touch end), in walking order,
// start cell excluded; each cell scored and flagged hostile_line_of_fire
// and door. Needs pawn_id. Not ranked and not filtered by standable or the
// named cells; a route longer than the cap is cut, so the last cell is
// then not next to `to`. No path: no proposals.
message CombatRescuePath {
  rimgovernor.common.v1.Cell to = 1; // required: the downed pawn's cell
}

// Cells within one step (8-way) of the line, not on it, whose best cover
// against the named hostiles (CoverUtility) is above zero; ranked by that
// cover, then by distance to the line.
message CombatCoverBehindLine {
  repeated rimgovernor.common.v1.Cell line = 1; // 1..cells cap, distinct
}

// The choke's 8-way neighbours strictly nearer our_side than the choke;
// ranked by distance to our_side.
message CombatAdjacentToChoke {
  rimgovernor.common.v1.Cell choke = 1; // required
  rimgovernor.common.v1.Cell our_side = 2; // required: any cell on our side
}

// Cells within radius of from with line of fire (GenSight) to at least
// one target; ranked by targets in sight, then best cover, then distance
// to from.
message CombatFiringCells {
  repeated rimgovernor.common.v1.Cell targets = 1; // 1..hostiles cap, distinct
  rimgovernor.common.v1.Cell from = 2; // required
  optional int32 radius = 3; // required, 1..12
}

// One (cell, hostile) pair.
message CombatSightLine {
  optional string hostile_id = 1;
  // CoverUtility.CalculateOverallBlockChance at the cell against a shot
  // from the hostile's cell, 0..1.
  optional double cover = 2;
  // A shooter at the cell can hit the hostile (a verb shoot line exists).
  optional bool line_of_fire = 3;
  // A colonist stands on the shoot line between them.
  optional bool colonist_in_path = 4;
  // CoverUtility.CalculateOverallBlockChance at the hostile's cell against
  // a shot from the cell, 0..1: the cover the hostile keeps against a
  // shooter here.
  optional double hostile_cover = 5;
}

message CombatGeometryCell {
  rimgovernor.common.v1.Cell cell = 1;
  repeated CombatSightLine lines = 2; // request hostile order
  // Path ticks for the request's pawn; absent without a pawn or a path.
  optional int32 path_ticks = 3;
  optional bool standable = 4;
  // Any request hostile has line of fire to the cell.
  optional bool hostile_line_of_fire = 5;
  // A player door stands on the cell.
  optional bool door = 6;
}

message CombatGeometry {
  rimgovernor.common.v1.ObservationContext context = 1;
  repeated CombatGeometryCell cells = 2; // request cell order
  optional double main_thread_ms = 3; // the read's own main-thread time
  // The propose block's cells, ranked best first, scored like
  // cells; empty without propose.
  repeated CombatGeometryCell proposed = 4;
}

message CombatGeometryReply {
  oneof outcome {
    CombatGeometry observed = 1;
    rimgovernor.common.v1.Failure failure = 2;
  }
}

// A combat row's watermark: the tick, and the event sequence within it.
message Watermark {
  optional int64 tick = 1;
  optional uint32 seq = 2;
}

// The whole-map cell grid: native sends it in every snapshot frame
// (BundleSnapshot.grid); the Go snapshot recorder stores planning_cells
// section lines in it too.

message CellRect {
  optional int32 x = 1;
  optional int32 z = 2;
  optional int32 width = 3;
  optional int32 height = 4;
}

// One field's array over a CellGrid's rect, row-major (index
// (z - rect.z) * rect.width + x - rect.x). Dense forms hold every cell;
// sparse holds (index, value) pairs over a base: in a keyframe the
// all-sentinel array, in a delta the keyframe's array. The sender picks
// whichever form is smaller.
message FieldArray {
  oneof form {
    bytes codes = 1;           // presence and Fact[bool] fields, one byte per cell
    PackedUint32 indexes = 2;  // string fields: string table indexes
    PackedDouble numbers = 3;  // Fact[float64] fields
    SparseArray sparse = 4;
  }
}

message PackedUint32 { repeated uint32 values = 1; }
message PackedDouble { repeated double values = 1; }

// index ascending and distinct; value in code for code and index fields, in
// number for number fields, one per index.
message SparseArray {
  repeated uint32 index = 1;
  repeated uint32 code = 2;
  repeated double number = 3;
}

// A cell grid: one array per policy.SiteCell field over
// rect. Sentinels mark a cell the grid does not hold (fogged, or outside
// the read) and an unknown fact:
//   cell: 0 not held, 1 held;
//   Fact[bool] codes: 0 unknown, 1 false, 2 true;
//   Fact[float64] numbers: NaN unknown (native values are finite);
//   Fact[string] indexes: 0 unknown, k for strings[k-1].
// A keyframe carries every array; a delta, on the same rect, only the
// arrays that differ from its keyframe's (deltas are cumulative against
// the keyframe, never chained), and never every array: a frame whose grid
// carries every array is a keyframe. strings is this grid's own table.
// glow is artificial light only (GroundGlowAt ignoring the sky); the
// frame's sky_glow is the map's sky light, lighting an unroofed cell to
// max(glow, sky_glow). room keys the native room holding the cell by the
// index of that room's first held cell (row-major), stable across the room
// regeneration an edifice change triggers; it is not the native room id.
message CellGrid {
  CellRect rect = 1;
  repeated string strings = 2;
  FieldArray cell = 3;
  FieldArray walkable = 4;

  FieldArray zone = 6;
  FieldArray roofed = 7;
  FieldArray indoors = 8;
  FieldArray supports_light = 9;
  FieldArray storage_empty = 10;
  FieldArray doorway = 11;
  FieldArray fertility = 12;
  FieldArray polluted = 13;
  FieldArray glow = 14;
  FieldArray roof = 15;
  FieldArray zone_id = 16;

  FieldArray room = 22;
  // Columns 23 on carry the per-cell thing list and tile facts; a keyframe carries every one, things included. A fogged cell
  // (cell code 0) stays unknown, distinct from a held cell with no things.
  FieldArray terrain = 23;               // string: the terrain def
  FieldArray in_home = 24;               // bool codes: inside the home area
  FieldArray foundation_affordances = 25; // string: the terrain affordances a foundation may stand on, comma-joined and sorted
  FieldArray snow_depth = 26;            // numbers
  FieldArray top_layer_removable = 27;   // bool codes: the top terrain layer can be removed
  ThingList things = 28;
}

// What a thing is. Spawned pawns are never listed.
enum ThingCategory {
  THING_CATEGORY_UNSPECIFIED = 0; // refused
  THING_CATEGORY_ITEM = 1;     // state: item
  THING_CATEGORY_BUILDING = 2; // state: building (blueprints and frames too, by flag)
  THING_CATEGORY_PLANT = 3;    // state: plant
  THING_CATEGORY_FILTH = 4;    // state: filth
  THING_CATEGORY_CORPSE = 5;   // state: corpse
  THING_CATEGORY_OTHER = 6;    // no state
}

// Whose a thing is.
enum ThingFaction {
  THING_FACTION_NONE = 0; // unowned
  THING_FACTION_PLAYER = 1;
  THING_FACTION_NEUTRAL = 2;
  THING_FACTION_HOSTILE = 3;
}

// Thing.flags bits (a value is a mask; any other bit is refused).
enum ThingFlag {
  THING_FLAG_NONE = 0;
  THING_FLAG_EDIFICE = 1;
  THING_FLAG_BLUEPRINT = 2;
  THING_FLAG_FRAME = 4;
  THING_FLAG_IMPASSABLE = 8;
  THING_FLAG_HOLDS_ROOF = 16;
  THING_FLAG_DECONSTRUCTIBLE = 32;
  THING_FLAG_MINIFIABLE = 64;
  THING_FLAG_CLAIMABLE = 128;
  THING_FLAG_DESIGNATED = 256;
  THING_FLAG_FORBIDDEN = 512;
  THING_FLAG_HAULABLE = 1024;
  THING_FLAG_ANCIENT_DANGER = 2048;
  THING_FLAG_NATURAL_ROCK = 4096;
}

enum CorpseClass {
  CORPSE_CLASS_OTHER = 0;
  CORPSE_CLASS_HUMANLIKE = 1;
  CORPSE_CLASS_ANIMAL = 2;
}

// The things on a grid's cells, sparse over a base: in a keyframe
// every cell has none, in a delta the keyframe's lists (cumulative, never
// chained). cells lists, ascending and distinct, the cells whose list
// is replaced; offsets (cells.length + 1 prefix sums, from 0, never
// decreasing, ending at things.length) cut things into one list per listed
// cell, an empty list clearing the cell. A delta lists only cells whose list
// differs from the keyframe's.
message ThingList {
  repeated uint32 cells = 1;
  repeated uint32 offsets = 2;
  repeated Thing things = 3;
}

// One thing on a cell. def and the string fields below are string table
// indexes (k for strings[k-1]; 0 is refused). state must match category.
// A blueprint or frame lists the def it builds. A thing spanning cells is listed
// on each, with the same id. Fractions are held to 1/100.
message Thing {
  uint32 def = 1;
  ThingCategory category = 2;
  ThingFaction faction = 3;
  uint32 flags = 4;
  uint64 id = 5;
  uint32 count = 6; // stack count
  oneof state {
    PlantState plant = 7;
    CorpseState corpse = 8;
    FilthState filth = 9;
    BuildingState building = 10;
    ItemState item = 11;
  }
}

message PlantState {
  float growth = 1; // 0..1
  bool blighted = 2;
}

message CorpseState {
  CorpseClass class = 1;
  float rot = 2; // rot progress, 0 fresh .. 1 dessicated
}

message FilthState {
  uint32 thickness = 1;
}

message MaterialNeed {
  uint32 def = 1; // string table index
  uint32 count = 2;
}

message BuildingState {
  uint32 hit_points = 1;
  bool burning = 2;
  repeated MaterialNeed needed = 3; // a blueprint or frame's materials still owed
  repeated uint32 casket = 4;       // def indexes of what a casket holds
  bool reserved = 5;
}

message ItemState {
  float deterioration = 1; // 0 sound .. 1 ruined
}
