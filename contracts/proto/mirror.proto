syntax = "proto3";
package rimgovernor.mirror.v1;
option csharp_namespace = "RimGovernor.Protocol.Mirror";
option go_package = "github.com/davidarcher/RimGovernor/go/internal/wire/mirrorpb;mirrorpb";
import "common.proto";
import "clock.proto";
import "observations.proto";

// rimgovernor/mirror_poll (#795): the long poll that feeds the controller's
// colony mirror. One reply is one main-thread snapshot: every section page,
// the clock journal page and complete_through_tick describe the same read.

// The mirrored sections. Rows are keyed by the entity id the dedicated list
// read keys them by: the building's thing id, the bench's thing id.
enum Section {
  SECTION_UNSPECIFIED = 0;
  SECTION_BUILDINGS = 1; // observations_list_buildings, player artificial buildings
  SECTION_BILLS = 2;     // observations_read_bills, player bench bill stacks
  // The planning window over the ask's window rect, as a CellGrid: the
  // planning fields of observations_get_cells, one array per SiteCell field.
  SECTION_PLANNING_CELLS = 3;
  SECTION_ZONES = 4; // observations_list_zones, the whole census, rows keyed by zone id (#358)
  // The pawn list and colony facts reads the ask names, each answered as its
  // #773 changed-since read answers it: rows keyed by pawn id, and by the
  // colony facts row paths the controller splits the snapshot into.
  SECTION_PAWNS = 5;
  SECTION_COLONY_FACTS = 6;
  // Combat state (#851), served while the map has an active hostile or a
  // combat epoch runs, else empty (every row tombstoned). Rows keyed by
  // pawn load id: every spawned colonist, hostile and colony animal.
  // Hook-dirtied pawns are compared on the next poll; the sampled fields
  // (cell, health, shield, aim/cooldown, move speed) at most every
  // MinCombatCompareTicks of running game.
  SECTION_COMBAT_PAWNS = 7;
  // Combat events (#851), append-only: rows keyed "<tick>.<seq>" at the
  // event's own watermark, never tombstoned. A keyframe is the native's
  // retained ring (the newest 1024 events).
  SECTION_COMBAT_EVENTS = 8;
}

// Which side a combat pawn fights on.
enum CombatSide {
  COMBAT_SIDE_UNSPECIFIED = 0;
  COMBAT_SIDE_COLONIST = 1;
  COMBAT_SIDE_HOSTILE = 2;
  COMBAT_SIDE_COLONY_ANIMAL = 3;
}

// What a combat pawn's stance is doing.
enum CombatStance {
  COMBAT_STANCE_UNSPECIFIED = 0;
  COMBAT_STANCE_IDLE = 1;
  COMBAT_STANCE_WARMUP = 2;   // aiming
  COMBAT_STANCE_COOLDOWN = 3; // after a shot or blow
  COMBAT_STANCE_MOVING = 4;
  COMBAT_STANCE_MELEE = 5;    // in a melee job
}

// One combat pawn row (SECTION_COMBAT_PAWNS). Numbers are thresholded so a
// row only changes when a decision could: fractions to 0.01, bleed and pain
// to 0.05, move speed to 0.1 cells/s.
message CombatPawn {
  optional string id = 1; // load id
  optional CombatSide side = 2;
  optional string faction_id = 3;
  optional string lord_id = 4;
  rimgovernor.common.v1.Cell cell = 5;
  optional bool downed = 6;
  optional bool dead = 7;
  optional string mental_state = 8; // def name, absent when none
  optional bool drafted = 9;
  optional string fire_mode = 10; // "fire_at_will" or "hold_fire" (drafted colonists)
  optional string job = 11;       // current job def
  optional string target_id = 12; // current job's target thing
  optional CombatStance stance = 13;
  optional int32 stance_ticks_left = 14; // warmup or cooldown ticks remaining
  optional double health = 15; // summary health fraction
  optional double bleed_rate = 16; // per day
  optional double pain = 17;
  optional double move_speed = 18; // cells per second
  optional double shield_energy = 19; // fraction of max, absent without a shield
  optional bool shield_broken = 20;
  optional string weapon = 21; // def name, absent when unarmed
  optional double weapon_range = 22;
  optional int32 weapon_warmup_ticks = 23;
  optional int32 weapon_cooldown_ticks = 24;
  optional bool weapon_melee = 25;
  // The watermark of the row's last change: when events concerned the pawn
  // since the last compare, the newest of the highest rank (downing or
  // death, then another #849 stop kind, then any), the matching SECTION_COMBAT_EVENTS
  // row's; otherwise the poll's. Not part of the change comparison.
  Watermark changed = 26;
}

// What a combat event row records. The #849 stop kinds and the non-stops.
enum CombatLogKind {
  COMBAT_LOG_KIND_UNSPECIFIED = 0;
  COMBAT_LOG_KIND_DOWNED = 1;
  COMBAT_LOG_KIND_KILLED = 2;
  COMBAT_LOG_KIND_DAMAGED = 3; // detail carries the damage
  COMBAT_LOG_KIND_SHIELD_BROKEN = 4;
  COMBAT_LOG_KIND_SHOT_FIRED = 5;
  COMBAT_LOG_KIND_PROJECTILE_LAUNCHED = 6;
  COMBAT_LOG_KIND_EXPLOSION = 7;
  COMBAT_LOG_KIND_FIRE_STARTED = 8;
  COMBAT_LOG_KIND_DOOR_OPENED = 9;
  COMBAT_LOG_KIND_DOOR_CLOSED = 10;
  COMBAT_LOG_KIND_BUILDING_DESTROYED = 11;
  COMBAT_LOG_KIND_LORD_TOIL = 12; // detail "<from> -> <to>", raid_strategy set
  COMBAT_LOG_KIND_MENTAL_STATE = 13;
  COMBAT_LOG_KIND_HOSTILE_ARRIVED = 14;
}

// One combat event row (SECTION_COMBAT_EVENTS).
message CombatEventRow {
  Watermark at = 1; // the event's own mark; the row id is "<tick>.<seq>"
  optional CombatLogKind kind = 2;
  // The #849 stop kind this event is, armed or not; unset for non-stops.
  optional rimgovernor.clock.v1.CombatEvent stop = 3;
  optional string thing_id = 4;  // the actor or subject
  optional string target_id = 5; // the victim, target or instigator
  optional string def_name = 6;  // weapon, projectile, building or state def
  rimgovernor.common.v1.Cell cell = 7;
  optional string detail = 8;
  optional string raid_strategy = 9; // lord toil rows: the raid strategy def
}

// rimgovernor/combat_geometry (#851): an on-demand read, not mirrored, that
// answers DecideCombat's geometry questions at a stop by the game's own
// rules. Caps: at most MaxGeometryCells cells and MaxGeometryHostiles
// hostiles (the native's CombatGeometry constants, bridge.CombatGeometry*),
// measured on lab-ranged under the 50 ms main-thread budget.
message CombatGeometryRequest {
  rimgovernor.common.v1.Identity identity = 1; // required
  repeated rimgovernor.common.v1.Cell cells = 2; // 1..cap, distinct, in bounds
  repeated string hostile_ids = 3; // 1..cap, distinct pawn load ids
  optional string pawn_id = 4; // optional: path ticks for this pawn to each cell
}

// One (cell, hostile) pair.
message CombatSightLine {
  optional string hostile_id = 1;
  // CoverUtility.CalculateOverallBlockChance at the cell against a shot
  // from the hostile's cell, 0..1.
  optional double cover = 2;
  // A shooter at the cell can hit the hostile (a verb shoot line exists).
  optional bool line_of_fire = 3;
  // A colonist stands on the shoot line between them.
  optional bool colonist_in_path = 4;
}

message CombatGeometryCell {
  rimgovernor.common.v1.Cell cell = 1;
  repeated CombatSightLine lines = 2; // request hostile order
  // Path ticks for the request's pawn; absent without a pawn or a path.
  optional int32 path_ticks = 3;
  optional bool standable = 4;
}

message CombatGeometry {
  rimgovernor.common.v1.ObservationContext context = 1;
  repeated CombatGeometryCell cells = 2; // request cell order
  optional double main_thread_ms = 3; // the read's own main-thread time
}

message CombatGeometryReply {
  oneof outcome {
    CombatGeometry observed = 1;
    rimgovernor.common.v1.Failure failure = 2;
  }
}

// How far a section is complete: every change through tick, and within tick
// every change up to seq. Monotonic within one epoch.
message Watermark {
  optional int64 tick = 1;
  optional uint32 seq = 2;
}

// The world a mirror's rows belong to. Any difference from the epoch a
// client holds answers every asked section with a keyframe.
message Epoch {
  optional string process = 1; // this game process's instance token
  rimgovernor.common.v1.Identity identity = 2; // colony, load and map
  optional uint64 native_generation = 3; // authority generation
}

message SectionAsk {
  optional Section section = 1;
  Watermark since = 2; // absent or zero asks for a keyframe
  // SECTION_PLANNING_CELLS only, and required there: the window, at most
  // 65536 cells. A window other than the one since was served for is a
  // keyframe.
  CellRect window = 3;
  // SECTION_PAWNS and SECTION_COLONY_FACTS only, and required there (the
  // one matching the section): the read the section answers, identity
  // scoped to the poll's. Its changed_since is the #773 ask; the section's
  // since is unused. An ask the tracker cannot answer is answered whole
  // (stale rule C).
  rimgovernor.observations.v1.ListPawnsRequest pawns = 4;
  rimgovernor.observations.v1.ColonyFactsRequest colony_facts = 5;
  // The drift backstop (#795): beside a delta, the section's keyframe at
  // the same watermark (SectionPage.resync) for the client to compare
  // with what the delta leaves it holding. Entity and planning cell
  // sections; ignored where the page is a keyframe anyway.
  optional bool resync = 6;
}

message CellRect {
  optional int32 x = 1;
  optional int32 z = 2;
  optional int32 width = 3;
  optional int32 height = 4;
}

// One field's array over a CellGrid's rect, row-major (index
// (z - rect.z) * rect.width + x - rect.x). Dense forms hold every cell;
// sparse holds (index, value) pairs over a base: in a keyframe the
// all-sentinel array, in a delta the array the client holds at the delta's
// from. The native sends whichever form is smaller.
message FieldArray {
  oneof form {
    bytes codes = 1;           // presence and Fact[bool] fields, one byte per cell
    PackedUint32 indexes = 2;  // string fields: string table indexes
    PackedDouble numbers = 3;  // Fact[float64] fields
    SparseArray sparse = 4;
  }
}

message PackedUint32 { repeated uint32 values = 1; }
message PackedDouble { repeated double values = 1; }

// index ascending and distinct; value in code for code and index fields, in
// number for number fields, one per index.
message SparseArray {
  repeated uint32 index = 1;
  repeated uint32 code = 2;
  repeated double number = 3;
}

// The planning window as a grid (#795): one array per policy.SiteCell field
// over rect. Sentinels mark a cell the window does not hold (fogged, or
// outside the read) and an unknown fact:
//   cell: 0 not held, 1 held;
//   Fact[bool] codes: 0 unknown, 1 false, 2 true;
//   Fact[float64] numbers: NaN unknown (native values are finite);
//   Fact[string] indexes: 0 unknown, k for strings[k-1];
//   ruin_hold (a plain string): 0 empty, k for strings[k-1].
// A keyframe carries every array; a delta, on the same rect, only the
// arrays that changed. strings is this grid's own table.
message CellGrid {
  CellRect rect = 1;
  repeated string strings = 2;
  FieldArray cell = 3;
  FieldArray walkable = 4;
  FieldArray occupied = 5;
  FieldArray zone = 6;
  FieldArray roofed = 7;
  FieldArray indoors = 8;
  FieldArray supports_light = 9;
  FieldArray storage_empty = 10;
  FieldArray doorway = 11;
  FieldArray fertility = 12;
  FieldArray polluted = 13;
  FieldArray glow = 14;
  FieldArray roof = 15;
  FieldArray zone_id = 16;
  FieldArray natural_rock = 17;
  FieldArray ruin = 18;
  FieldArray player_edifice = 19;
  FieldArray claimable_ruin = 20;
  FieldArray ruin_hold = 21;
}

message MirrorPollRequest {
  // Required. Stale: the StaleIdentity failure, carrying the current
  // context to re-anchor on.
  rimgovernor.common.v1.Identity identity = 1;
  Epoch epoch = 2; // the epoch the client's watermarks belong to
  repeated SectionAsk asks = 3;
  optional uint32 byte_budget = 4; // section rows per page, 1..786432
  optional uint32 wait_ms = 5; // 0..5000
  optional int64 journal_after_cursor = 6; // absent: no journal page
}

// The whole section at `at`.
message Keyframe {
  Watermark at = 1;
  repeated rimgovernor.observations.v1.BuildingState buildings = 2;
  repeated rimgovernor.observations.v1.BillStack bills = 3;
  CellGrid cells = 4; // SECTION_PLANNING_CELLS
  // SECTION_ZONES: the census (context, map snapshot token, every zone).
  rimgovernor.observations.v1.ZonesSnapshot zones = 5;
  // SECTION_PAWNS, SECTION_COLONY_FACTS: the snapshot the ask's read
  // answers, a #773 delta of it when its delta names since.
  rimgovernor.observations.v1.PawnSnapshot pawns = 6;
  rimgovernor.observations.v1.ColonyFactsSnapshot colony_facts = 7;
  repeated CombatPawn combat_pawns = 8; // SECTION_COMBAT_PAWNS
  repeated CombatEventRow combat_events = 9; // SECTION_COMBAT_EVENTS: the retained ring
}

// The rows changed after `from`, through `to`, and the ids removed since.
message Delta {
  Watermark from = 1;
  Watermark to = 2;
  repeated rimgovernor.observations.v1.BuildingState buildings = 3;
  repeated rimgovernor.observations.v1.BillStack bills = 4;
  repeated string tombstones = 5;
  CellGrid cells = 6; // SECTION_PLANNING_CELLS: the changed arrays only
  // SECTION_ZONES: the census header and the changed zones; removed zone
  // ids are tombstones.
  rimgovernor.observations.v1.ZonesSnapshot zones = 7;
  repeated CombatPawn combat_pawns = 8; // SECTION_COMBAT_PAWNS: the changed rows
  repeated CombatEventRow combat_events = 9; // SECTION_COMBAT_EVENTS: the rows after from
}

message SectionPage {
  optional Section section = 1;
  oneof body {
    Keyframe keyframe = 2;
    Delta delta = 3;
  }
  // The section did not fit this page's byte budget and has no body:
  // re-poll with wait_ms 0 from the same watermark.
  optional bool more = 4;
  // The keyframe an ask's resync asked for, beside its delta.
  Keyframe resync = 5;
}

message MirrorPage {
  Epoch epoch = 1;
  // Everything at or before this tick is present in the client's mirror
  // once the page is applied: the least of the served sections' watermarks,
  // the unserved asks' and the journal page's tick.
  optional int64 complete_through_tick = 2;
  repeated SectionPage sections = 3;
  rimgovernor.clock.v1.EventsPage journal = 4;
}

message MirrorPollReply {
  oneof outcome {
    MirrorPage page = 1;
    rimgovernor.common.v1.Failure failure = 2;
  }
}
