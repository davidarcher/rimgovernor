syntax = "proto3";
package rimgovernor.lifecycle.v1;
option csharp_namespace = "RimGovernor.Protocol.Lifecycle";
option go_package = "github.com/davidarcher/RimGovernor/go/internal/wire/lifecyclepb;lifecyclepb";
import "common.proto";

message IdentityRequest {}
enum CapabilitySupport {
  CAPABILITY_SUPPORT_UNSPECIFIED = 0;
  CAPABILITY_SUPPORT_SUPPORTED = 1;
  CAPABILITY_SUPPORT_UNAVAILABLE = 2;
  CAPABILITY_SUPPORT_UNSUPPORTED = 3;
}
// Descriptor names identify a fixed generated method; they are never dispatch arguments.
message Capability {
  optional string full_method_name = 1;
  optional CapabilitySupport support = 2;
  optional string detail = 3;
}
message LoadedIdentity {
  rimgovernor.common.v1.ObservationContext context = 1;
  repeated Capability capabilities = 2;
  optional bool paused = 3;
}
message IdentityReply {
  oneof outcome {
    LoadedIdentity loaded = 1;
    rimgovernor.common.v1.Unavailable unavailable = 2;
    rimgovernor.common.v1.Failure failure = 3;
  }
}
// ReadTick is the bare observation scope: the context and pause state
// ReadIdentity reports, without its capability list, for callers that only
// need the current load, map, tick and generation.
message TickRequest {}
// An open window that force-pauses the game (Window.forcePause).
message PausingWindow {
  optional string native_type = 1;
  optional string title = 2;
}
// paused is TickManager.Paused: the speed control at Paused, or
// force_paused (a window or other native force-pause request). time_speed
// is TickManager.CurTimeSpeed's name.
message LoadedTick {
  rimgovernor.common.v1.ObservationContext context = 1;
  optional bool paused = 2;
  optional bool force_paused = 3;
  optional string time_speed = 4;
  repeated PausingWindow pausing_windows = 5;
}
message TickReply {
  oneof outcome {
    LoadedTick loaded = 1;
    rimgovernor.common.v1.Unavailable unavailable = 2;
    rimgovernor.common.v1.Failure failure = 3;
  }
}

// These requests belong to explicit session lifecycle, outside gameplay/model dispatch.
message PlayerLifecycleContext {
  rimgovernor.common.v1.Identity identity = 1;
  optional uint64 player_direction = 2;
  optional string request_id = 3;
}
message SaveRequest {
  PlayerLifecycleContext player = 1;
  optional string save_name = 2;
  optional int64 expected_tick = 3;
}
message SaveCompleted {
  optional string request_id = 1;
  optional string save_name = 2;
  rimgovernor.common.v1.ObservationContext context = 3;
  optional bool paused = 4;
  optional uint64 player_direction = 5;
  optional uint64 byte_length = 6;
}
message SaveUncertain {
  optional string request_id = 1;
  optional string save_name = 2;
  rimgovernor.common.v1.ObservationContext observed_context = 3;
  optional string detail = 4;
}
message SaveReply {
  oneof outcome {
    SaveCompleted completed = 1;
    SaveUncertain uncertain = 2;
    rimgovernor.common.v1.Failure failure = 3;
  }
}
enum Readiness {
  READINESS_UNSPECIFIED = 0;
  READINESS_MAP = 1;
  READINESS_VISUAL = 2;
}
message LoadRequest {
  // Before a map exists, instance ownership is validated by the Go controller gamehost adapter.
  optional string request_id = 1;
  optional string save_name = 2;
  optional Readiness readiness = 3;
  optional uint32 timeout_ms = 4;
  // Required when replacing a live map. Before-map admission uses owned instance+direction.
  PlayerLifecycleContext expected_player = 5;
  optional string expected_instance_id = 6;
  optional uint64 player_direction = 7;
}
message LoadCompleted {
  optional string request_id = 1;
  optional string save_name = 2;
  LoadedIdentity loaded = 3;
  optional Readiness readiness = 4;
}
message LoadPending {
  optional string request_id = 1;
  optional string save_name = 2;
  optional bool process_connected = 3;
  optional bool map_ready = 4;
  optional bool visual_ready = 5;
  optional string detail = 6;
}
message LoadSuperseded {
  optional string request_id = 1;
  rimgovernor.common.v1.ObservationContext observed_context = 2;
  optional string detail = 3;
}
message LoadReply {
  oneof outcome {
    LoadCompleted completed = 1;
    LoadPending pending = 2;
    rimgovernor.common.v1.Failure failure = 3;
    LoadSuperseded superseded = 4;
  }
}
message RequestStatus {
  optional string request_id = 1;
  optional string expected_instance_id = 2;
}
// New colony (#2019): native generates a colony from a spec on a fresh main
// menu and saves it as the last phase, so the spec carries the save name.
// Unset temperature fields leave the game default. world_temperature is the
// RimWorld OverallTemperature name; planet_coverage is 0.05..1; map_size is
// the square side in cells (100..400).
message NewColonySpec {
  optional string scenario = 1;
  optional uint32 colonist_count = 2;
  optional string seed = 3;
  repeated string biomes = 4;
  optional bool flat_tile = 5;
  optional string difficulty = 6;
  optional string storyteller = 7;
  optional float min_temperature = 8;
  optional float max_temperature = 9;
  optional string world_temperature = 10;
  optional uint32 map_size = 11;
  optional float planet_coverage = 12;
  optional string save_name = 13;
  rimgovernor.common.v1.IdeoligionDesign ideoligion = 14;
  // Go resolves this request through the definition catalog before dispatch.
  optional bool governor_ideoligion = 15;
}
message NewColonyRequest {
  optional string request_id = 1;
  NewColonySpec spec = 2;
  optional uint32 timeout_ms = 3;
}
// Native phases only; restarting the game is launcher-side.
enum NewColonyPhase {
  NEW_COLONY_PHASE_UNSPECIFIED = 0;
  NEW_COLONY_PHASE_GENERATING_WORLD = 1;
  NEW_COLONY_PHASE_CHOOSING_TILE = 2;
  NEW_COLONY_PHASE_ROLLING_COLONISTS = 3;
  NEW_COLONY_PHASE_GENERATING_MAP = 4;
  NEW_COLONY_PHASE_FINISHING = 5;
  NEW_COLONY_PHASE_SAVING = 6;
}
message NewColonyCompleted {
  optional string request_id = 1;
  optional string save_name = 2;
  rimgovernor.common.v1.ObservationContext context = 3;
  optional bool paused = 4;
  optional uint64 byte_length = 5;
  // The seed the colony was generated from, after any reroll native made.
  optional string seed = 6;
}
message NewColonyPending {
  optional string request_id = 1;
  optional NewColonyPhase phase = 2;
  optional string detail = 3;
  optional uint64 elapsed_ms = 4;
  optional uint32 reroll_count = 5;
}
message NewColonySuperseded {
  optional string request_id = 1;
  optional string detail = 2;
}
message NewColonyReply {
  oneof outcome {
    NewColonyCompleted completed = 1;
    NewColonyPending pending = 2;
    rimgovernor.common.v1.Failure failure = 3;
    NewColonySuperseded superseded = 4;
  }
}
// Governor state (#882): opaque ASCII blobs Go keeps in the save's
// GovernorState game component. Native stores and returns them verbatim and
// never interprets them; they persist once the game next saves.
message GovernorStateRequest {}
message GovernorStateBlobs { map<string, string> blobs = 1; }
message GovernorStateReply {
  oneof outcome {
    GovernorStateBlobs loaded = 1;
    rimgovernor.common.v1.Unavailable unavailable = 2;
    rimgovernor.common.v1.Failure failure = 3;
  }
}
// PutBatch replaces the whole blob set (#2357): keys absent from blobs are
// removed. It runs off the game thread; the reply's loaded outcome is empty.
message PutGovernorStateBatchRequest { map<string, string> blobs = 1; }
// Save-time handshake (#2358). Native's SaveGame prefix never cancels a
// save. When Go holds a WaitSaveSignal call and the save is not Go-initiated,
// native hands that call a pre_save signal, blocks the game thread until
// FlushDone acks its token (or ~3 s pass), then lets the save run. Signals
// are not durable: a signal raised with no held call is dropped. Both tools
// run on the bridge worker thread, never the game thread.
message WaitSaveSignalRequest { optional int32 timeout_ms = 1; }
message SaveSignal { optional string kind = 1; optional string token = 2; }
message SaveSignalTimeout {}
message WaitSaveSignalReply {
  oneof outcome {
    SaveSignal signal = 1;
    SaveSignalTimeout timeout = 2;
    rimgovernor.common.v1.Failure failure = 3;
  }
}
message FlushDoneRequest { optional string token = 1; }
message FlushDoneAcked {}
message FlushDoneReply {
  oneof outcome {
    FlushDoneAcked acked = 1;
    rimgovernor.common.v1.Failure failure = 2;
  }
}
service Lifecycle {
  rpc WaitSaveSignal(WaitSaveSignalRequest) returns (WaitSaveSignalReply);
  rpc FlushDone(FlushDoneRequest) returns (FlushDoneReply);
  rpc ReadGovernorState(GovernorStateRequest) returns (GovernorStateReply);
  rpc PutGovernorStateBatch(PutGovernorStateBatchRequest) returns (GovernorStateReply);
  rpc ReadIdentity(IdentityRequest) returns (IdentityReply);
  rpc Save(SaveRequest) returns (SaveReply);
  rpc Load(LoadRequest) returns (LoadReply);
  rpc ReadLoad(RequestStatus) returns (LoadReply);
  rpc ReadSave(RequestStatus) returns (SaveReply);
  rpc NewColony(NewColonyRequest) returns (NewColonyReply);
  rpc ReadNewColony(RequestStatus) returns (NewColonyReply);
}
