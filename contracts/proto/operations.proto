syntax = "proto3";
package rimgovernor.operations.v1;
option csharp_namespace = "RimGovernor.Protocol.Operations";
option go_package = "github.com/davidarcher/RimGovernor/go/internal/wire/operationspb;operationspb";
import "common.proto";
import "placement.proto";
import "receipts.proto";


// Tokens are opaque native snapshots scoped to request identity and exact entity.
message EntityPrecondition { optional string entity_id = 1; optional string expected_snapshot_token = 2; }
message Clear {}
message Assignment { oneof value { string entity_id = 1; Clear clear = 2; } }
message DefCount { optional string def_name = 1; optional int32 count = 2; }
message CellList { repeated rimgovernor.common.v1.Cell cells = 1; }
message Rectangle { rimgovernor.common.v1.Cell origin = 1; optional int32 width = 2; optional int32 height = 3; }
message Cells { oneof selection { CellList explicit_cells = 1; Rectangle rectangle = 2; } }
// Batched combat micro (#850), the Actions/Apply combat_orders arm (#939):
// every order applies in request order within one apply, so on one game
// tick. Each pawn's snapshot token, when sent, is checked once, before any
// order runs; a pawn may carry several orders (fire mode then move). A pawn
// order needs an eligible drafted pawn, which a draft order earlier in the
// batch may make. A door or mortar_fire order names no pawn. Per-order refusals come back
// in CombatOrdersEffect; only a malformed batch refuses the whole action.
enum CombatFireMode { COMBAT_FIRE_MODE_UNSPECIFIED = 0; COMBAT_FIRE_MODE_AT_WILL = 1; COMBAT_FIRE_MODE_HOLD = 2; }
// FORBID and ALLOW (#867) set the door's forbidden flag, which every player
// pawn's path respects, drafted or not (ForbidUtility.IsForbiddenToPass).
enum CombatDoorMode { COMBAT_DOOR_MODE_UNSPECIFIED = 0; COMBAT_DOOR_MODE_HOLD_OPEN = 1; COMBAT_DOOR_MODE_CLOSE = 2; COMBAT_DOOR_MODE_FORBID = 3; COMBAT_DOOR_MODE_ALLOW = 4; }
// Rescue (#867): the pawn carries the downed colonist to a bed by the
// vanilla rescue job, under the pawn-target rescue order's eligibility
// (HealthAIUtility.CanRescueNow, a non-hostile patient) and bed search.
// dest, when set, is the bed's cell; absent, the vanilla bed search picks.
// Refusals: cannot_rescue, no_bed, unreachable.
message CombatRescue { EntityPrecondition downed = 1; rimgovernor.common.v1.Cell dest = 2; }
// Repair (#900): the drafted pawn repairs the damaged player building on
// cell (a door the fight uses) by the vanilla Repair job, staying drafted.
// Refusals: cannot_repair (no damaged player building there, or the pawn
// cannot construct), unreachable.
message CombatRepair { rimgovernor.common.v1.Cell cell = 1; }
// MortarFire (#1202) names no pawn: the unroofed player mortar on mortar
// force-targets target, as the vanilla attack gizmo (OrderAttack); a
// man_mortar order crews it. Refusals: not_a_mortar, cannot_hit (inside
// the minimum or past the maximum range). shell (#1051), when set, is the
// shell ThingDef to fire: a different loaded shell is unloaded beside the
// mortar, the mortar's shell filter allows only shell, and a pawn manning
// it retakes ManTurret to load it. Refusals: unknown_shell (not a shell
// this mortar accepts), no_shell (no unforbidden stack of it, in the
// manning pawn's reach when one mans it).
// No target (#1235) clears the mortar's forced target, as the vanilla
// stop-forced-attack gizmo; it names no shell. Refusal: not_a_mortar.
message CombatMortarFire { rimgovernor.common.v1.Cell mortar = 1; rimgovernor.common.v1.Cell target = 2; optional string shell = 3; }
// Animal orders (#1057) name a player-faction animal, not a drafted pawn:
// no draft claim is needed, and the animal carries no snapshot token.
// Refusals: not_ours (not a spawned player animal), untrained (release
// without the Release training).
// animal_area restricts the animal to one cell by a native-owned allowed
// area; clear restores the area it had before (none when unknown, as
// after a reload) and removes the native area.
message CombatAnimalArea { oneof area { rimgovernor.common.v1.Cell cell = 1; Clear clear = 2; } }
message CombatDoor { rimgovernor.common.v1.Cell cell = 1; optional CombatDoorMode mode = 2; }
message CombatOrder {
  EntityPrecondition pawn = 1;
  oneof order {
    rimgovernor.common.v1.Cell move = 2;
    // A spawned pawn or a hostile building thing (#930): any spawned
    // hostile-faction building or frame with hit points (a crashed ship
    // part, its cluster buildings, a siege mortar or its frame). Native
    // picks melee or ranged as the vanilla float menu does for the pawn's
    // weapon (#939); there is no other attack order.
    EntityPrecondition attack = 3;
    // Force-fire a ground-targetable verb (grenades, launchers) at a cell.
    rimgovernor.common.v1.Cell attack_ground = 4;
    CombatFireMode fire_mode = 5;
    Clear hold_position = 6;
    CombatDoor door = 7;
    Clear stop = 8;
    CombatRescue rescue = 9;
    CombatRepair repair = 10;
    // Draft (#910): draft an eligible pawn; one already drafted applies
    // again. The controller undrafts pawns no live plan needs (#939).
    // Refusal: cannot_draft (not eligible).
    Clear draft = 11;
    // ManMortar (#1202): the drafted pawn mans the unroofed player mortar
    // on the cell (vanilla ManTurret, which loads shells from stock); one
    // already manning it applies. Refusals: not_a_mortar, unreachable.
    rimgovernor.common.v1.Cell man_mortar = 15;
    CombatMortarFire mortar_fire = 16;
    // Release (#1057): a release-trained player animal attacks one spawned
    // pawn by the vanilla melee attack job, as a released animal does.
    // Refusals: not_ours, untrained, not_found, cannot_hit, unreachable.
    EntityPrecondition release = 13;
    CombatAnimalArea animal_area = 14;
  }
  reserved 12;
}
message CombatOrders { repeated CombatOrder orders = 1; }
enum ThingDesignation {
  THING_DESIGNATION_UNSPECIFIED = 0;
  THING_DESIGNATION_ALLOW = 1;
  THING_DESIGNATION_FORBID = 2;
  THING_DESIGNATION_HUNT = 3;
  THING_DESIGNATION_HARVEST_PLANT = 4;
  THING_DESIGNATION_DECONSTRUCT = 5;
  // CutPlant on one exact blighted plant (ColonyFactsSnapshot.blighted_plants).
  THING_DESIGNATION_CUT_PLANT = 6;
  // Strip on one exact spawned pawn or corpse wearing or carrying
  // strippable gear (#1117); colonists strip it through Hauling work.
  THING_DESIGNATION_STRIP = 7;
}
enum PowerSetting { POWER_SETTING_UNSPECIFIED = 0; POWER_SETTING_ON = 1; POWER_SETTING_OFF = 2; }
enum MedicalCare {
  MEDICAL_CARE_UNSPECIFIED = 0; MEDICAL_CARE_NO_CARE = 1; MEDICAL_CARE_NO_MEDICINE = 2;
  MEDICAL_CARE_HERBAL_OR_WORSE = 3; MEDICAL_CARE_NORMAL_OR_WORSE = 4; MEDICAL_CARE_BEST = 5;
}
message WorkPriority { optional string work_type_def = 1; optional int32 priority = 2; }
message Schedule { repeated string assignment_defs = 1; }
message FilterSelector { oneof definition { string thing_def = 1; string category_def = 2; string special_filter_def = 3; } }
message SelectorList { repeated FilterSelector selectors = 1; }
message FilterPatch {
  // Absent replacement preserves existing membership; present empty denies all.
  SelectorList replace = 1;
  repeated FilterSelector allow = 2;
  repeated FilterSelector disallow = 3;
  // Hit-point range as fractions in [0, 1] (the storage tab's percent slider)
  // and quality range by QualityCategory name (Awful..Legendary); both ends
  // of a range are required together. Absent ranges are preserved.
  optional double hit_points_min = 4; optional double hit_points_max = 5;
  optional string quality_min = 6; optional string quality_max = 7;
}
enum RepeatMode { REPEAT_MODE_UNSPECIFIED = 0; REPEAT_MODE_FOREVER = 1; REPEAT_MODE_COUNT = 2; REPEAT_MODE_TARGET = 3; }
enum StoreMode { STORE_MODE_UNSPECIFIED = 0; STORE_MODE_BEST_STOCKPILE = 1; STORE_MODE_DROP_ON_FLOOR = 2; }
message BillStore { oneof destination { StoreMode mode = 1; string zone_id = 2; } }
message BillSettings {
  optional RepeatMode repeat_mode = 1;
  optional int32 repeat_count = 2;
  optional int32 target_count = 3;
  optional int32 unpause_threshold = 4;
  optional bool pause_when_satisfied = 5;
  optional bool suspended = 6;
  optional float ingredient_search_radius = 7;
  optional int32 skill_min = 8;
  optional int32 skill_max = 9;
  Assignment worker = 10;
  BillStore store = 11;
  FilterPatch ingredients = 12;
  // Wort bill whose target counts wort, fermenting contents and finished beer.
  optional bool beer_reserve = 13;
  // Corpse bill ingredient filter (#833): whose corpses a corpse recipe
  // (ButcherCorpseFlesh, CremateCorpse) takes. Required on corpse recipes,
  // refused on others; a butcher bill with a pinned worker is humanlike.
  optional rimgovernor.common.v1.CorpseClass corpse_class = 14;
}
message DefinitionList { repeated string defs = 1; }
enum ZoneType { ZONE_TYPE_UNSPECIFIED = 0; ZONE_TYPE_STOCKPILE = 1; ZONE_TYPE_DUMPING = 2; ZONE_TYPE_GROWING = 3; ZONE_TYPE_FISHING = 4; }
enum StoragePriority { STORAGE_PRIORITY_UNSPECIFIED = 0; STORAGE_PRIORITY_LOW = 1; STORAGE_PRIORITY_NORMAL = 2; STORAGE_PRIORITY_PREFERRED = 3; STORAGE_PRIORITY_IMPORTANT = 4; STORAGE_PRIORITY_CRITICAL = 5; }
enum FilterPreset { FILTER_PRESET_UNSPECIFIED = 0; FILTER_PRESET_EVERYTHING = 1; FILTER_PRESET_NOTHING = 2; FILTER_PRESET_FOOD = 3; FILTER_PRESET_PERISHABLES = 4; FILTER_PRESET_NONPERISHABLES = 5; FILTER_PRESET_OUTDOOR_SAFE = 6; }
message StockpileSettings { optional StoragePriority priority = 1; optional FilterPreset preset = 2; FilterPatch filter = 3; }
message GrowingSettings { optional string plant_def = 1; optional bool allow_sow = 2; optional bool allow_cut = 3; }
message FishingSettings { optional double population_floor = 1; }
message CreateZone { reserved 1; reserved "expected_map_snapshot_token"; optional ZoneType type = 2; optional string label = 3; Cells cells = 4; StockpileSettings stockpile = 5; GrowingSettings growing = 6; optional bool require_covered_empty = 7; FishingSettings fishing = 8; optional string extend_zone_id = 9; }
// Delete one zone. Native refuses a zone holding a phantom cell or a
// stockpile whose haul grid disagrees with its cells; a zone already gone
// applies again.
message DeleteZoneIntent { optional string zone_id = 1; }
// Designate the foundation laid on one cell (def_name, a Bridge) for
// removal (#954). A cell without that foundation, or one already
// designated, applies again; ordinary construction work lifts it.
message RemoveFoundationIntent { rimgovernor.common.v1.Cell cell = 1; optional string def_name = 2; }
enum CellEdit { CELL_EDIT_UNSPECIFIED = 0; CELL_EDIT_ADD = 1; CELL_EDIT_REMOVE = 2; }
// Add free zoneable cells to one zone, or remove cells of its own. Native
// checks the zone, every cell and a contiguous result live when it applies;
// cells already in (add) or already out of (remove) the zone apply again.
message ZoneCellsIntent { optional string zone_id = 1; optional CellEdit edit = 2; Cells cells = 3; }
// Set the priority and filter of one stockpile zone or player storage
// building (a shelf). Native resolves the settings against the target's
// storable definitions when it applies; settings that already hold apply
// again.
message StockpileIntent { optional string target_id = 1; StockpileSettings settings = 2; }
enum ServiceMethod { SERVICE_METHOD_UNSPECIFIED = 0; SERVICE_METHOD_REPAIR = 1; SERVICE_METHOD_BREAKDOWN = 2; SERVICE_METHOD_REFUEL = 3; }
// expected_target_snapshot_token is decoupled from target's own EntityPrecondition
// (whose token field is unused for this operation; only entity_id identity is
// required) because the target's recovery-specific CAS token
// (NativeRecoveryOperations.Token) has no existing observation read that could
// produce it ahead of time: an unconstrained preview (this field omitted)
// establishes the baseline.
enum Need { NEED_UNSPECIFIED = 0; NEED_FOOD = 1; NEED_REST = 2; NEED_JOY = 3; }
// Exclusive prisoner interaction modes. REDUCE_RESISTANCE and RELEASE are
// Core; ENSLAVE and CONVERT resolve only while Ideology is active and are
// refused as unsupported otherwise. Execution and non-exclusive modes stay
// player-only.
enum PrisonerInteraction {
  PRISONER_INTERACTION_UNSPECIFIED = 0; PRISONER_INTERACTION_ATTEMPT_RECRUIT = 1; PRISONER_INTERACTION_MAINTAIN_ONLY = 2;
  PRISONER_INTERACTION_REDUCE_RESISTANCE = 3; PRISONER_INTERACTION_RELEASE = 4; PRISONER_INTERACTION_ENSLAVE = 5; PRISONER_INTERACTION_CONVERT = 6;
}
enum PawnOrderKind { PAWN_ORDER_KIND_UNSPECIFIED = 0; PAWN_ORDER_KIND_EQUIP = 1; PAWN_ORDER_KIND_RESCUE = 2; PAWN_ORDER_KIND_CAPTURE = 3; PAWN_ORDER_KIND_TEND = 4; PAWN_ORDER_KIND_REPAIR = 7; PAWN_ORDER_KIND_CLEAN = 8; PAWN_ORDER_KIND_OPEN_CASKET = 9; PAWN_ORDER_KIND_ARREST = 12; PAWN_ORDER_KIND_WEAR = 13; PAWN_ORDER_KIND_SUBDUE = 14; reserved 5, 6, 10, 11; reserved "PAWN_ORDER_KIND_HAUL", "PAWN_ORDER_KIND_WORK"; }
// Trade steps, sent as TradeIntent through Actions/Apply, act on RimWorld's
// one live trade session. Native validates each against live state when it
// applies and refuses with a reason when the session is gone or held by a
// different trader or negotiator; repeating one is harmless. OpenTrade
// reuses a matching open session or walk.
message OpenTrade { reserved 1, 2, 4, 5; reserved "trader_id", "negotiator_id"; optional bool gift_mode = 3; }
message TradeLine { optional string line_id = 1; optional int32 absolute_count = 2; }
message SetTradeLines { reserved 1, 4, 5; reserved "trader_id", "negotiator_id"; repeated TradeLine lines = 2; optional bool allow_pawns = 3; }
message AcceptTrade { reserved 1, 6, 7; reserved "trader_id", "negotiator_id"; optional string expected_deal_signature = 2; repeated DefCount economic_floors = 3; optional bool allow_empty = 4; optional bool receive_quest = 5; }
enum EndTradeKind { END_TRADE_KIND_UNSPECIFIED = 0; END_TRADE_KIND_CANCEL = 1; END_TRADE_KIND_CLOSE_DIALOG = 2; }
// A cancel with no live session is a no-op, not a refusal.
message EndTrade { reserved 1, 4, 5; reserved "trader_id", "negotiator_id"; optional EndTradeKind kind = 2; optional bool receive_quest = 3; }

// Zone siting (#1130): a plain read planners run per candidate zone. Native
// checks the ground as the create_zone Action arm would, creating nothing.
// accepted false is the ground refusing (a littered or occupied cell); a bad
// configuration is a failure.
service Zones {
  rpc Preview(ZonePreviewRequest) returns (ZonePreviewReply);
}
message ZonePreviewRequest { rimgovernor.common.v1.Identity identity = 1; CreateZone zone = 2; }
message ZonePreview { rimgovernor.common.v1.ObservationContext context = 1; optional bool accepted = 2; }
message ZonePreviewReply {
  oneof outcome {
    ZonePreview evaluated = 1;
    rimgovernor.common.v1.Failure failure = 2;
  }
}

// Actions/Apply carries idempotent intents (#856). Actions apply on the game
// thread in order and independently: native validates each against live
// state and applies it or refuses it with a reason. A resent key returns its
// first result while native remembers it (an in-memory window, not saved).
// The key names the attempt; only the identity is checked.
service Actions {
  rpc Apply(ApplyRequest) returns (ApplyReply);
}
message ApplyRequest {
  rimgovernor.common.v1.Identity identity = 1;
  repeated Action actions = 2;
}
// One intent kind per arm.
message Action {
  optional string key = 1;
  // Why the controller applies this action, one short ASCII line such as
  // "Food supply: hunt, food runway 1.5d" (#822, #1129). Native keeps it with
  // the jobs, blueprints and designations the apply places and the
  // "activity" overlay shows it over the pawn; it never changes the apply.
  optional string purpose = 2;
  // Melee attacks are combat orders; subdue is PawnOrderIntent SUBDUE (#939).
  reserved 14; reserved "melee";
  oneof intent {
    TradeIntent trade = 10;
    BuildingIntent building = 11;
    MoveIntent move = 12;
    HaulIntent haul = 13;
    ApparelPolicyIntent apparel_policy = 15;
    ResearchIntent research = 16;
    NamingIntent naming = 17;
    DialogIntent dialog = 18;
    PrisonerInteractionIntent prisoner = 19;
    AcceptQuestIntent accept_quest = 20;
    FormCaravanIntent form_caravan = 21;
    BedAssignIntent bed_assign = 22;
    WorkSettingsIntent work_settings = 23;
    ProductionBillIntent production_bill = 24;
    HusbandryIntent husbandry = 25;
    // Create one zone (native checks the ground live when it applies). A zone whose cells and
    // configuration already equal the request, or a fishing zone already
    // extended over them, applies again; applied evidence names the zone.
    CreateZone create_zone = 26;
    DeleteZoneIntent delete_zone = 27;
    ZoneCellsIntent zone_cells = 28;
    StockpileIntent stockpile = 29;
    RemoveFoundationIntent remove_foundation = 30;
    HomeIntent home = 31;
    CoverIntent cover = 32;
    DesignateIntent designate = 33;
    DeconstructIntent deconstruct = 34;
    ExcavateIntent excavate = 35;
    WasteIntent waste = 36;
    RecoverIntent recover = 37;
    RelocateIntent relocate = 38;
    BuildingPatchIntent building_patch = 39;
    RemoveWallIntent remove_wall = 40;
    PawnOrderIntent pawn_order = 41;
    NeedReliefIntent need_relief = 42;
    UseItemIntent use_item = 43;
    DraftIntent draft = 44;
    CombatOrders combat_orders = 45;
    AcquireIntent acquire = 46;
    SurgeryIntent surgery = 47;
  }
}
// Queue one medical operation bill on one patient (#1162): the recipe on the
// body part at part_index in the race body's AllParts (absent for a
// whole-body recipe). Native re-checks the patient, the recipe and the part
// live and refuses a recipe that is a violation on the patient unless
// acknowledge_violation is set. Other bills on the patient never block; a
// recipe whose hediff already stands on the part is refused.
// Evidence is the SurgeryEffect: QUEUED with the Bill_Medical id; the same
// recipe and part already queued applies again. Native doctor jobs choose
// the surgeon; applied means queued, and the health read decides success.
message SurgeryIntent { optional string pawn_id = 1; optional string recipe_def = 2; optional int32 part_index = 3; optional bool acknowledge_violation = 4; }
// Designate one census source for its resource: a plant harvest or cut, a
// hunt (the animal wherever it is now, cell the hint) or a mine cell. With
// withdraw, remove that designation instead (the planner's stall withdraw,
// #1046). Native checks the source live; a designation already in the
// requested state applies again. Applied means ordered; the next census
// reads progress.
message AcquireIntent { optional string source_id = 1; optional string resource_def_name = 2; rimgovernor.common.v1.Cell cell = 3; optional bool withdraw = 4; }
// Draft or undraft one eligible colonist (#939). Drafts are plan-owned: the
// controller drafts for a plan and undrafts any drafted colonist no live plan
// needs. A pawn already in the wanted state applies again.
message DraftIntent { optional string pawn_id = 1; optional bool drafted = 2; }
// Order one pawn onto one target with the job the game's own work giver or
// float menu builds for that kind (repair, clean, open a casket, tend,
// equip, rescue, capture, arrest). Native checks the pawn and the target
// live; a pawn already running that job on the target applies again.
// Applied means ordered, not finished; the next census reads the outcome.
// ARREST alone names bed_id, the exact prisoner bed; it needs an armed,
// drafted arrester and a target in an arrestable mental state. SUBDUE puts
// the pawn (drafted if it is not) on a blunt containment melee attack on an
// aggressive colonist, ending once the target is downed or out of the break.
message PawnOrderIntent { optional string pawn_id = 1; optional string target_id = 2; optional PawnOrderKind kind = 3; optional string bed_id = 4; }
// Offer one undrafted colonist the ordinary native job for one deficient
// need (food, rest or recreation), the job its own need giver issues.
// Native checks the pawn, its current job, timetable and the need live; a
// pawn already running the need's job applies again. Applied means the job
// was started; the next census reads the need.
message NeedReliefIntent { optional string pawn_id = 1; optional Need need = 2; }
// Order one colonist to use one targetable item on one pawn (#1038): the
// target verb of an item the pawn wears or equips (Verb_CastTargetEffect,
// the psychic shock and insanity lances), or the use job of a CompTargetable
// item. Native checks the pawn is a player-controlled colonist able to use
// it, the verb's charges and its own ValidateTarget (or the comp's target
// check) live; a pawn already running that job on the target applies again.
// Applied means ordered, not cast; the next census reads the target.
message UseItemIntent { optional string pawn_id = 1; optional string item_id = 2; optional string target_id = 3; }
// Extend Home over the missing cells of one facility's bounded batch (a
// colonist building plus its connected enclosed roofed rooms, or a
// stockpile's cells), recomputed live when native applies it. A batch
// already all Home applies again. Home is never removed.
message HomeIntent { optional string target_id = 1; }
// Place the one designation (Mine, CutPlant, Haul or Deconstruct) that
// removes the raider cover thing_id standing at cell. Native checks the
// thing, its kind, the kind's safety rule, the game designator and a
// reachable worker live; the designation already standing applies again.
message CoverIntent { optional string thing_id = 1; optional string designation_def = 2; rimgovernor.common.v1.Cell cell = 3; }
// Allow or forbid one exact colony supply item, or order one exact blighted
// plant cut (CUT_PLANT). Native checks the thing's eligibility live when it
// applies; a thing already in the wanted state applies again.
message DesignateIntent { optional string thing_id = 1; optional ThingDesignation designation = 2; }
// Designate one exact building for deconstruction, adopting a player
// designation already on it. Native checks the target's safety (roof
// support, enclosing colony walls, a pending wall upgrade) and the game
// designator live when it applies; a target this controller already owns
// applies again. Revoking authority releases every owned designation.
message DeconstructIntent { optional string target_id = 1; }
// Designate one rock cell for ordinary pawn mining as part of a staged
// room/corridor, adopting a Mine designation already there. Native checks
// the rock, roof support and the game designator live when it applies; a
// cell the pawns already cleared applies as cleared.
// Order one undrafted colonist to haul one exposed waste item (spoiled, a
// rotting corpse, or one the caller declares unwanted) to a separated dirty
// outdoor stockpile or an empty grave, with the game's own Hauling
// WorkGiver job. Protected items (forbidden, quest, hazardous, named or
// colony corpses) are refused; a pawn already hauling the item applies again.
// Order one undrafted colonist to repair, fix a breakdown on or refuel one
// colony building with the game's own WorkGiver job. Native refuses a
// building that no longer needs the method; a pawn already servicing the
// building applies again.
// Move one exact installed player building (or install a packed item, named
// by its own id or its inner building's) at destination/rotation through the
// game's reinstall or install blueprint; with uninstall, designate the
// building for vanilla Uninstall where it stands (destination ignored).
// Evidence is the InstallationEffect: QUEUED with the blueprint id, or
// UNINSTALL_QUEUED. A blueprint or designation already standing for the same
// order applies again.
message RelocateIntent { optional string thing_id = 1; rimgovernor.common.v1.Cell destination = 2; optional rimgovernor.placement.v1.Rotation rotation = 3; optional bool uninstall = 4; }
// One settings change on one exact building: a CompTempControl target,
// a humanlike bed's medical flag, prisoner use or slave use (for_prisoners and
// for_slaves drop every owner; only setting it is meaningful), a grower's crop under the game's
// sow rules, or a claim of a claimable building. Native checks it live; an
// already-applied change applies again.
message BuildingPatchIntent {
  optional string thing_id = 1;
  oneof change { float target_temperature = 2; bool medical = 3; Clear for_prisoners = 4; string plant_def = 5; Clear claim = 6; Clear for_slaves = 7; bool auto_refuel = 8; }
}
message RecoverIntent { optional string pawn_id = 1; optional string thing_id = 2; optional ServiceMethod method = 3; }
message WasteIntent { optional string pawn_id = 1; optional string thing_id = 2; optional bool unwanted = 3; }
// Designate the guarded stone-shell removal of the colonist wall standing at
// cell (the original a replacement rebuilds, or a backup that held the shell
// open). Native resolves the wall-upgrade site from the wall live (several
// admissible sites refuse) and its guards hold the demolition to enclosure,
// support and roof safety until a pawn finishes. expected_wall_id, when set,
// must name the wall at cell. A removal this controller already designated,
// or a cell whose wall is already gone, applies again. Go waits for the
// census to show the cell clear before releasing work that needs it (#989).
message RemoveWallIntent { rimgovernor.common.v1.Cell cell = 1; optional string expected_wall_id = 2; }
message ExcavateIntent { rimgovernor.common.v1.Cell cell = 1; optional string expected_mineable_def_name = 2; }
// Activate one option of the force-pausing choice dialog ColonyFactsSnapshot.dialog
// observed (Verse.Dialog_NodeTree): window_id plus the exact observed option index
// and label stand in for an entity precondition, and native refuses on any drift.
// With joiner_letter_token, window_id is a WandererJoins letter ID and option 0
// accepts the joiner; a joiner already accepted by that letter applies again.
// One animal's husbandry order: a recursive training request, a slaughter,
// tame or release-to-wild designation or the cancel of one, or an
// Animals-tab setting. trainable_def is TRAIN's argument; target_id is the
// allowed area or master colonist (absent clears it); follow is the flag a
// FOLLOW order sets. Tame targets a wild animal, every other order a player
// animal. Native checks the animal and the order's own eligibility
// (canTrain, safe to slaughter or release, tameable, Obedience for master
// and following, a safe reachable area) live when it applies; an order that
// already holds applies again.
enum HusbandryOrder {
  HUSBANDRY_ORDER_UNSPECIFIED = 0; HUSBANDRY_ORDER_TRAIN = 1; HUSBANDRY_ORDER_SLAUGHTER = 2; HUSBANDRY_ORDER_TAME = 3;
  HUSBANDRY_ORDER_RELEASE = 4; HUSBANDRY_ORDER_ALLOWED_AREA = 5; HUSBANDRY_ORDER_MASTER = 6; HUSBANDRY_ORDER_FOLLOW_DRAFTED = 7;
  HUSBANDRY_ORDER_FOLLOW_FIELDWORK = 8; HUSBANDRY_ORDER_CANCEL_SLAUGHTER = 9; HUSBANDRY_ORDER_CANCEL_RELEASE = 10;
}
message HusbandryIntent { optional string animal_id = 1; optional HusbandryOrder order = 2; optional string trainable_def = 3; optional string target_id = 4; optional bool follow = 5; }
// Add one production bill to a player bench: the recipe, its repeat
// settings, ingredient filter, corpse class and pinned worker. Native checks
// the bench, recipe, ingredients and a skilled reaching worker live when it
// applies; a bench already carrying a matching bill applies again. With
// replace_owned_bill_id the named bill (same recipe on this bench, or an
// ordinary meal tier on this map) is deleted in the same apply.
message ProductionBillIntent {
  optional string bench_id = 1;
  optional string recipe_def = 2;
  BillSettings settings = 3;
  optional string replace_owned_bill_id = 4;
}
// Write one free colonist's settings: work priorities, allowed area, the
// 24-hour timetable and food additions together, or the medicine ceiling
// alone, or the named social-only drug policy alone (created or updated,
// assigned and made the default; no hard drugs or scheduled use). Native
// checks the pawn and each field live when it applies; settings that
// already hold apply again.
message WorkSettingsIntent {
  optional string pawn_id = 1;
  repeated WorkPriority work = 2;
  Assignment allowed_area = 3;
  Schedule schedule = 4;
  optional MedicalCare medical_care = 5;
  DefinitionList food_allow = 6;
  optional string drug_policy = 7;
}
// Assign one free colonist to one humanlike bed, replacing the bed it owned
// when the planner chose (expected_previous_bed: that bed or clear). Native
// checks the pawn, the bed and that ownership live; a pawn that already owns
// the bed applies again.
message BedAssignIntent { optional string pawn_id = 1; optional string bed_id = 2; Assignment expected_previous_bed = 3; }
// Set one colony prisoner's exclusive interaction mode. Native checks the
// prisoner and the mode's eligibility (recruitable, wild man, Ideology) live;
// a prisoner already set to the mode applies again.
message PrisonerInteractionIntent { optional string pawn_id = 1; optional PrisonerInteraction interaction = 2; }
message DialogIntent { optional int32 window_id = 1; optional int32 option_index = 2; optional string option_label = 3; optional string joiner_letter_token = 4; }
// Confirm the exact observed suggestions of the colony-wide initial
// faction/settlement naming dialog; window_id plus the suggestions stand in
// for an entity precondition, so a changed window or suggestion is refused.
// Names that already hold with the dialog gone are applied again. It is
// independent of presentation.proto's explicit-player ConfirmColonyNames.
message NamingIntent { optional int32 window_id = 1; optional string faction_name = 2; optional string settlement_name = 3; }
// Make the project the ordinary research slot's current project; native
// refuses a finished, unstartable or anomaly knowledge project, and a
// project already current is applied again.
message ResearchIntent { optional string project_def = 1; }
// Create or update the named role apparel policy and assign it to one free
// colonist; tainted apparel is always excluded and forced or locked apparel
// is released. A pawn already on a matching policy is applied again.
message ApparelPolicyIntent { optional string pawn_id = 1; optional string name = 2; repeated string allowed_defs = 3; optional float min_hit_points = 4; optional float max_hit_points = 5; optional int32 min_quality = 6; optional int32 max_quality = 7; }
// Form a caravan of the named home colonists carrying cargo (by definition,
// journey food included) toward destination_tile, and send it: RimWorld's
// own formation, whose crew gathers the cargo and walks to the exit before
// the caravan exists. Native checks the crew, the cargo, at least one
// colonist left home, the exit route, mass, a day of food and the game's own
// formation errors when it applies. A crew already forming or already a
// caravan is applied again. Applied says formation started, not that the
// caravan left.
message FormCaravanIntent {
  repeated string pawn_ids = 1;
  repeated DefCount cargo = 2;
  optional int32 destination_tile = 3;
}
// Accept one visible quest offer, choosing reward option reward_choice of its
// single choice part (-1 when it has none) and, when the quest requires one,
// naming the accepting colonist. Native checks the game's own acceptance
// rules when it applies; a quest already accepted is applied again.
message AcceptQuestIntent {
  optional string quest_id = 1;
  optional string accepter_pawn_id = 2;
  optional int32 reward_choice = 3;
}
// Order one alive, spawned, drafted pawn to walk to one standable,
// reachable cell. Applied means the order was given, or already matched (the
// pawn stands on the cell or is walking there); arrival is not reported.
message MoveIntent {
  optional string pawn_id = 1;
  rimgovernor.common.v1.Cell destination = 2;
}
// Order one colonist to haul one loose item to the storage the game's own
// hauling WorkGiver picks. Native refuses when the pawn cannot take the job
// or the item is gone; a pawn already hauling the item is applied again.
message HaulIntent {
  optional string pawn_id = 1;
  optional string thing_id = 2;
}
// Place one ordinary blueprint (or an instant building). Native validates the
// placement against live state and refuses with the placement reason; a
// matching blueprint, frame or building already on the cell counts as
// applied. Native stamps what it places with the action key and carries the
// key blueprint -> frame -> building, saved with the game, so the building
// census reports which intent built each building (BuildingState.intent_key).
message BuildingIntent {
  rimgovernor.placement.v1.PlacementCandidate placement = 1;
}
// One step against RimWorld's single live trade session, named by its
// trader and negotiator.
message TradeIntent {
  optional string trader_id = 1;
  optional string negotiator_id = 2;
  oneof step {
    OpenTrade open = 3;
    SetTradeLines set_lines = 4;
    AcceptTrade accept = 5;
    EndTrade end = 6;
  }
}
message Refusal {
  optional rimgovernor.common.v1.FailureCode code = 1;
  optional string reason = 2;
}
message ActionResult {
  optional string key = 1;
  oneof outcome {
    rimgovernor.receipts.v1.Receipt applied = 2;
    Refusal refused = 3;
    rimgovernor.common.v1.Failure failed = 4;
  }
}
// batch_failure means no action in the batch was applied.
message ApplyReply {
  repeated ActionResult results = 1;
  rimgovernor.common.v1.Failure batch_failure = 2;
}
