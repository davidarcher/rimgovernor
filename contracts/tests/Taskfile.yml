# Native contract probes. NativeContractProbes.csproj builds without game inputs against fake
# Verse/Harmony stubs; it never takes a real 0Harmony.dll (NativeHookSetProbe is the real-Harmony
# project). A Category 3 probe (native-proto-*) runs against a built mod; prerequisites are in
# NativeContractProbes/native-proto-presentation/README.md.
version: '3'

vars:
  REPO: '{{.TASKFILE_DIR}}/../..'
  EVIDENCE: '{{.REPO}}/.rimgovernor/task/probes'
  HARMONY_ASSEMBLY: '{{.HARMONY_ASSEMBLY | default "C:/Program Files (x86)/Steam/steamapps/workshop/content/294100/2009463077/Current/Assemblies/0Harmony.dll"}}'
  HOST_ASSEMBLY_DIR: '{{.HOST_ASSEMBLY_DIR | default (printf "%s/.rimgovernor/task/native/mod/RimGovernor/Assemblies" .REPO)}}'

tasks:
  build:
    desc: NativeContractProbes (ungated set) with warnings as errors and a locked restore
    cmds:
      - dotnet build NativeContractProbes.csproj -c Release -v minimal -nologo -p:RestoreLockedMode=true "-p:OutputPath={{.EVIDENCE}}/bin/" "-p:BaseIntermediateOutputPath={{.EVIDENCE}}/obj/"
      # NativeConstructionHookSet needs real Harmony (#935); skipped when it is not installed.
      - |
        if [ ! -f "{{.HARMONY_ASSEMBLY}}" ]; then
          echo "native-hook-set: unavailable (missing {{.HARMONY_ASSEMBLY}})"
          exit 0
        fi
        dotnet build NativeHookSetProbe/NativeHookSetProbe.csproj -c Release -v minimal -nologo "-p:HarmonyAssembly={{.HARMONY_ASSEMBLY}}" "-p:OutputPath={{.EVIDENCE}}/hookset/bin/" "-p:BaseIntermediateOutputPath={{.EVIDENCE}}/hookset/obj/"

  test:
    desc: Pure geometry and phase-accounting checks; game-dependent probes run through native acceptance
    deps: [build]
    cmds:
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-roof-support'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-designation-guards'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-home-coverage'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-team-policy'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-traffic-counts'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-production-bill-settings'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-observation-work'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-reply-encoder'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-threat-classifier'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-acquisition-token'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-ref-index'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe native-rule-runtime'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe gab-dispatch'
      - '{{if ne OS "windows"}}mono {{end}}{{.EVIDENCE}}/bin/NativeContractProbes.exe mod-log'
      # Binds against the host RimGovernor.Host.dll that native:build staged;
      # reports unavailable when it has not been built.
      - |
        server="{{.HOST_ASSEMBLY_DIR}}/RimGovernor.Host.dll"
        if [ ! -f "$server" ]; then
          echo "native-proto-boundary: unavailable (missing $server)"
          exit 0
        fi
        {{if ne OS "windows"}}mono {{end}}"{{.EVIDENCE}}/bin/NativeContractProbes.exe" native-proto-boundary "$server"
      - |
        if [ ! -f "{{.EVIDENCE}}/hookset/bin/NativeHookSetProbe.exe" ]; then
          echo "native-hook-set: unavailable (not built; Harmony missing)"
          exit 0
        fi
        {{if ne OS "windows"}}mono {{end}}"{{.EVIDENCE}}/hookset/bin/NativeHookSetProbe.exe"
