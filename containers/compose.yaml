services:
  worker:
    labels:
      io.rimgovernor.colony: "1"
      io.rimgovernor.colony.name: ${RIMGOVERNOR_COLONY_NAME:-}
    build:
      context: ..
      dockerfile: containers/Dockerfile
      target: worker
    init: true
    stop_grace_period: 60s
    environment:
      RIMGOVERNOR_DISPLAY: ${RIMGOVERNOR_DISPLAY:-headless}
      RIMGOVERNOR_DISPLAY_RESOLUTION: ${RIMGOVERNOR_DISPLAY_RESOLUTION:-1280x720}
      RIMGOVERNOR_DISPLAY_RENDERER: ${RIMGOVERNOR_DISPLAY_RENDERER:-llvmpipe}
      RIMGOVERNOR_UNITY_GC_TIME_SLICE: ${RIMGOVERNOR_UNITY_GC_TIME_SLICE:-0}
      RIMGOVERNOR_ALLOW_DOCKER_HOST_MODEL: "1"
      RIMGOVERNOR_MODEL_URL: http://host.docker.internal:1234/v1
      RIMGOVERNOR_MODEL: ${RIMGOVERNOR_MODEL:-qwen3.5-4b}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ${RIMGOVERNOR_LINUX_GAME:?Set RIMGOVERNOR_LINUX_GAME}
        target: /inputs/game
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RIMGOVERNOR_WORKER_MODS:?Set RIMGOVERNOR_WORKER_MODS}
        target: /inputs/mods
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RIMGOVERNOR_WORKER_PROFILE:?Set RIMGOVERNOR_WORKER_PROFILE}
        target: /inputs/profile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RIMGOVERNOR_LINUX_GABS:?Set RIMGOVERNOR_LINUX_GABS}
        target: /inputs/gabs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RIMGOVERNOR_WORKER_OUTPUT:?Set a fresh RIMGOVERNOR_WORKER_OUTPUT}
        target: /worker
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${RIMGOVERNOR_WORKER_PORT:-8788}:8787"
