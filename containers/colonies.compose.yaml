services:
  colonies:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      target: directory
    image: rimgovernor-colonies:local
    command: ["python", "-m", "rimgovernor", "--colonies", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${RIMGOVERNOR_COLONIES_PORT:-8790}:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
