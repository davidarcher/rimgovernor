# C# brain solution (epic #3043): Go packages ported by hand into in-process libraries.
# Conventions: docs/developers/architecture/go-to-csharp-port-conventions.md.
# Needs only the .NET SDK 10; the projects reference game assemblies through RimWorldDir
# once a port needs them, and then report `unavailable` the way the native build does.
version: '3'

tasks:
  wire-defs:
    desc: Generate the gitignored Defs.cs that Brain.Wire link-compiles (temporary, until protobuf collapses in #3100)
    sources:
      - ../contracts/proto/defs.proto
    generates:
      - ../contracts/generated/protobuf/csharp/Defs.cs
    cmds:
      - go -C ../go run ./internal/protobufgen/cmd/generatecsharp

  build:
    desc: Brain solution with nullable and warnings as errors, restored in locked mode
    deps: [wire-defs]
    sources:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.editorconfig'
      - '**/packages.lock.json'
      - 'RimGovernor.Brain.sln'
      - exclude: '**/bin/**'
      - exclude: '**/obj/**'
    cmds:
      - dotnet build RimGovernor.Brain.sln --configuration Release --nologo -p:RestoreLockedMode=true -p:TreatWarningsAsErrors=true

  test:
    desc: Brain tests (bug-driven only; the suite is empty until a bug needs one)
    cmds:
      - dotnet test RimGovernor.Brain.sln --configuration Release --nologo --no-build
