# Go controller. Included by the repository Taskfile; runs standalone too.
version: '3'

vars:
  REPO: '{{.TASKFILE_DIR}}/..'
  EVIDENCE: '{{.REPO}}/.rimgovernor/task'

tasks:
  build:
    desc: Pinned toolchain, gofmt, module integrity, vet, staticcheck, gated build
    cmds:
      - |
        want="go$(<.go-version)"
        if [ "$GOTOOLCHAIN" != "$want" ] || [ "$(go env GOVERSION)" != "$want" ]; then
          echo "Go toolchain: GOTOOLCHAIN=$GOTOOLCHAIN, go env GOVERSION=$(go env GOVERSION), .go-version=$want"
          exit 1
        fi
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then echo "gofmt -l: $unformatted"; exit 1; fi
      - go mod verify
      - go mod tidy -diff
      - go vet ./...
      - go tool staticcheck ./...
      - go build -trimpath -o {{.EVIDENCE}}/go/rimgovernor{{exeExt}} ./cmd/rimgovernor

  test:
    desc: Unit tests under a 60s per-test ceiling
    # The ceiling catches a test that has structurally become slow, not one
    # that lands a few seconds late while ./... saturates the machine: a
    # 10s gate over tests that idle at 8-9s failed on load alone
    # (#546, #551-#554).
    # The -race pass is not part of the landing gate: it is several times
    # slower on Windows, and every race-related commit in the history fixed
    # a timing flake the pass itself caused rather than a data race it found.
    # Run `task go:test:race` when a change touches shared-state concurrency
    # (clock, bridge, buildingruntime, ownership), or `go test -race` on that
    # package alone.
    cmds:
      - go test -json ./... | go run ./internal/testkit/cmd/checktesttimes -max 60s

  test:race:
    desc: Whole-module go test -race; opt-in, needs a C compiler on PATH
    cmds:
      - |
        if command -v gcc >/dev/null 2>&1; then
          # Ownership tests exercise a one-second subprocess shutdown deadline.
          # Race instrumentation is several times slower on Windows; capping
          # in-package parallelism keeps CPU-bound tests inside their 5s call
          # deadlines.
          CGO_ENABLED=1 GORACE=atexit_sleep_ms=0 go test -race -parallel 8 ./...
        else
          echo "race: unavailable (no C compiler on PATH)"
        fi
